<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">⚙️ Settings</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Manage your account, preferences, and privacy</text>
  </g>

  <!-- Sidebar -->
  <g transform="translate(80, 200)">
    <rect width="240" height="640" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)" fill="#374151" font-size="14">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">ACCOUNT</text>
      <g transform="translate(0, 20)">
        <rect width="200" height="36" rx="8" fill="#ECFDF5"/>
        <text x="20" y="23" fill="#10B981" font-size="13" font-weight="600">👤 Account</text>
      </g>
      <g transform="translate(0, 60)">
        <text x="20" y="20">🔔 Notifications</text>
      </g>
      <g transform="translate(0, 100)">
        <text x="20" y="20">🔒 Privacy</text>
      </g>
      <g transform="translate(0, 140)">
        <text x="20" y="20">💳 Payments</text>
      </g>

      <text x="0" y="200" fill="#9CA3AF" font-size="11" font-weight="700">PREFERENCES</text>
      <g transform="translate(0, 220)">
        <text x="20" y="20">🌍 Locale</text>
      </g>
      <g transform="translate(0, 260)">
        <text x="20" y="20">🔗 Wallet</text>
      </g>
      <g transform="translate(0, 300)">
        <text x="20" y="20">📅 Calendars</text>
      </g>

      <text x="0" y="360" fill="#9CA3AF" font-size="11" font-weight="700">DATA</text>
      <g transform="translate(0, 380)">
        <text x="20" y="20">📥 Export</text>
      </g>
      <g transform="translate(0, 420)">
        <text x="20" y="20">🚫 Blocked</text>
      </g>
      <g transform="translate(0, 460)">
        <text x="20" y="20" fill="#EF4444" font-weight="600">⚠️ Delete account</text>
      </g>

      <text x="0" y="540" fill="#9CA3AF" font-size="11" font-weight="700">SUPPORT</text>
      <g transform="translate(0, 560)">
        <text x="20" y="20">❓ Help Center</text>
      </g>
    </g>
  </g>

  <!-- Main content -->
  <g transform="translate(360, 200)">
    <rect width="1000" height="640" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">👤 Account Settings</text>
      <text x="0" y="28" fill="#6B7280" font-size="14">Manage your personal information and login credentials</text>

      <line x1="0" y1="60" x2="936" y2="60" stroke="#E5E7EB"/>

      <!-- Avatar -->
      <g transform="translate(0, 90)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Profile photo</text>
        <circle cx="40" cy="60" r="40" fill="#FEF3C7"/>
        <text x="40" y="76" text-anchor="middle" font-size="36">👩</text>
        <g transform="translate(100, 50)">
          <rect width="140" height="32" rx="16" fill="transparent" stroke="#10B981" stroke-width="2"/>
          <text x="70" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">Upload new</text>
        </g>
        <g transform="translate(250, 50)">
          <rect width="100" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
          <text x="50" y="22" text-anchor="middle" fill="#374151" font-size="12">Remove</text>
        </g>
      </g>

      <!-- Email -->
      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Email address</text>
        <rect x="0" y="14" width="500" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="38" fill="#111827" font-size="13">mai.tran@example.com</text>
        <g transform="translate(180, 22)">
          <rect width="60" height="22" rx="11" fill="#D1FAE5"/>
          <text x="30" y="15" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">✓ Verified</text>
        </g>
        <text x="0" y="74" fill="#6B7280" font-size="11">Used for login and important notifications</text>
      </g>

      <!-- Phone -->
      <g transform="translate(0, 310)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Phone number</text>
        <rect x="0" y="14" width="500" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="38" fill="#111827" font-size="13">🇻🇳 +84 901 234 567</text>
        <g transform="translate(200, 22)">
          <rect width="60" height="22" rx="11" fill="#D1FAE5"/>
          <text x="30" y="15" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">✓ Verified</text>
        </g>
      </g>

      <!-- Password -->
      <g transform="translate(0, 400)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Password</text>
        <rect x="0" y="14" width="500" height="40" rx="8" fill="#F3F4F6"/>
        <text x="16" y="38" fill="#374151" font-size="13">•••••••••••• (last changed 2 months ago)</text>
        <g transform="translate(380, 22)">
          <rect width="100" height="24" rx="12" fill="transparent" stroke="#10B981"/>
          <text x="50" y="16" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">Change</text>
        </g>
      </g>

      <!-- 2FA -->
      <g transform="translate(0, 480)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Two-factor authentication</text>
        <text x="0" y="22" fill="#6B7280" font-size="12">Add an extra layer of security to your account</text>
        <g transform="translate(0, 40)">
          <rect width="180" height="40" rx="20" fill="url(#ctaGrad)"/>
          <text x="90" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">🔒 Enable 2FA</text>
        </g>
        <g transform="translate(220, 40)">
          <rect width="100" height="22" rx="11" fill="#FEF3C7"/>
          <text x="50" y="15" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">⚠️ NOT ENABLED</text>
        </g>
      </g>

      <!-- Save -->
      <g transform="translate(0, 580)">
        <rect width="120" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="60" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Save changes</text>
      </g>
    </g>
  </g>
</svg>
