<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB" opacity="1"/>
  <rect width="1440" height="900" fill="#000000" opacity="0.4"/>

  <!-- Modal -->
  <g transform="translate(420, 150)">
    <rect width="600" height="600" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g>
      <rect width="600" height="64" rx="16" fill="#F9FAFB"/>
      <text x="32" y="40" fill="#111827" font-size="20" font-weight="800">🌍 Choose your language &amp; region</text>
      <text x="568" y="40" text-anchor="end" fill="#9CA3AF" font-size="20">×</text>
    </g>

    <!-- Search -->
    <g transform="translate(32, 90)">
      <rect width="536" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
      <text x="20" y="28" font-size="16">🔍</text>
      <text x="50" y="28" fill="#9CA3AF" font-size="13">Search languages or regions...</text>
    </g>

    <!-- Language list -->
    <g transform="translate(32, 160)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">POPULAR</text>

      <!-- Selected -->
      <g transform="translate(0, 16)">
        <rect width="536" height="56" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" font-size="20">🇬🇧</text>
        </g>
        <g transform="translate(56, 14)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="700">English</text>
          <text x="0" y="32" fill="#065F46" font-size="11">United States · USD ($)</text>
        </g>
        <g transform="translate(496, 18)">
          <path d="M0 12 L8 20 L20 4" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g transform="translate(0, 88)">
        <rect width="536" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" font-size="20">🇻🇳</text>
        </g>
        <g transform="translate(56, 14)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="600">Tiếng Việt</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Vietnam · VND (₫)</text>
        </g>
      </g>

      <g transform="translate(0, 152)">
        <rect width="536" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" font-size="20">🇪🇸</text>
        </g>
        <g transform="translate(56, 14)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="600">Español</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Spain · EUR (€)</text>
        </g>
      </g>

      <g transform="translate(0, 216)">
        <rect width="536" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" font-size="20">🇯🇵</text>
        </g>
        <g transform="translate(56, 14)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="600">日本語</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Japan · JPY (¥)</text>
        </g>
      </g>

      <g transform="translate(0, 280)">
        <rect width="536" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" font-size="20">🇫🇷</text>
        </g>
        <g transform="translate(56, 14)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="600">Français</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">France · EUR (€)</text>
        </g>
      </g>

      <g transform="translate(0, 344)">
        <rect width="536" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" font-size="20">🇩🇪</text>
        </g>
        <g transform="translate(56, 14)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="600">Deutsch</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Germany · EUR (€)</text>
        </g>
      </g>
    </g>

    <!-- Footer -->
    <g transform="translate(32, 540)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11">Don't see your language? Help us <tspan fill="#10B981" font-weight="600">translate SkillSeed</tspan></text>
    </g>

    <!-- Buttons -->
    <g transform="translate(32, 580)">
      <rect width="240" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
      <text x="120" y="26" text-anchor="middle" fill="#374151" font-size="13">Cancel</text>
    </g>
    <g transform="translate(296, 580)">
      <rect width="240" height="40" rx="20" fill="url(#ctaGrad)"/>
      <text x="120" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Apply (English) ✓</text>
    </g>
  </g>
</svg>
