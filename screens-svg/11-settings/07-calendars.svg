<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">⚙️ Settings · Calendars</text>
  </g>

  <!-- Sidebar -->
  <g transform="translate(80, 180)">
    <rect width="240" height="660" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)" fill="#374151" font-size="14">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">ACCOUNT</text>
      <g transform="translate(0, 20)"><text x="20" y="20">👤 Account</text></g>
      <g transform="translate(0, 60)"><text x="20" y="20">🔔 Notifications</text></g>
      <g transform="translate(0, 100)"><text x="20" y="20">🔒 Privacy</text></g>
      <g transform="translate(0, 140)"><text x="20" y="20">💳 Payments</text></g>
      <g transform="translate(0, 200)" fill="#9CA3AF"><text x="0" y="0" font-size="11" font-weight="700">PREFERENCES</text></g>
      <g transform="translate(0, 220)"><text x="20" y="20">🌍 Locale</text></g>
      <g transform="translate(0, 260)"><text x="20" y="20">🔗 Wallet</text></g>
      <g transform="translate(0, 300)">
        <rect width="200" height="36" rx="8" fill="#ECFDF5"/>
        <text x="20" y="23" fill="#10B981" font-size="13" font-weight="600">📅 Calendars</text>
      </g>
      <g transform="translate(0, 340)"><text x="20" y="20">💻 Devices</text></g>
      <g transform="translate(0, 400)" fill="#9CA3AF"><text x="0" y="0" font-size="11" font-weight="700">DATA</text></g>
      <g transform="translate(0, 420)"><text x="20" y="20">📥 Export</text></g>
      <g transform="translate(0, 460)"><text x="20" y="20">🚫 Blocked</text></g>
      <g transform="translate(0, 500)"><text x="20" y="20" fill="#EF4444" font-weight="600">⚠️ Delete account</text></g>
    </g>
  </g>

  <!-- Main -->
  <g transform="translate(360, 180)">
    <rect width="1000" height="660" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">📅 Connected calendars</text>
      <text x="0" y="28" fill="#6B7280" font-size="13">Sync your bookings with your favorite calendar app</text>

      <g transform="translate(0, 80)">
        <!-- Google -->
        <rect width="920" height="100" rx="12" fill="#F9FAFB" stroke="#10B981" stroke-width="2"/>
        <g transform="translate(24, 24)">
          <rect width="48" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="24" y="34" text-anchor="middle" font-size="28">📅</text>
        </g>
        <g transform="translate(88, 24)">
          <text x="0" y="14" fill="#111827" font-size="16" font-weight="700">Google Calendar</text>
          <text x="0" y="34" fill="#6B7280" font-size="12">mai.tran@gmail.com · 12 events synced</text>
          <g transform="translate(0, 50)">
            <rect width="60" height="22" rx="11" fill="#D1FAE5"/>
            <text x="30" y="15" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">✓ Active</text>
          </g>
          <text x="80" y="62" fill="#9CA3AF" font-size="11">· Last sync: 2 min ago</text>
        </g>
        <g transform="translate(800, 30)">
          <rect width="100" height="40" rx="20" fill="transparent" stroke="#EF4444"/>
          <text x="50" y="26" text-anchor="middle" fill="#EF4444" font-size="13" font-weight="600">Disconnect</text>
        </g>
      </g>

      <!-- Apple -->
      <g transform="translate(0, 200)">
        <rect width="920" height="100" rx="12" fill="#F9FAFB"/>
        <g transform="translate(24, 24)">
          <rect width="48" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="24" y="34" text-anchor="middle" font-size="28">🍎</text>
        </g>
        <g transform="translate(88, 24)">
          <text x="0" y="14" fill="#111827" font-size="16" font-weight="700">Apple Calendar (iCloud)</text>
          <text x="0" y="34" fill="#6B7280" font-size="12">Not connected</text>
        </g>
        <g transform="translate(800, 30)">
          <rect width="100" height="40" rx="20" fill="url(#ctaGrad)"/>
          <text x="50" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Connect</text>
        </g>
      </g>

      <!-- Outlook -->
      <g transform="translate(0, 320)">
        <rect width="920" height="100" rx="12" fill="#F9FAFB"/>
        <g transform="translate(24, 24)">
          <rect width="48" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="24" y="34" text-anchor="middle" font-size="28">📧</text>
        </g>
        <g transform="translate(88, 24)">
          <text x="0" y="14" fill="#111827" font-size="16" font-weight="700">Outlook Calendar</text>
          <text x="0" y="34" fill="#6B7280" font-size="12">Not connected</text>
        </g>
        <g transform="translate(800, 30)">
          <rect width="100" height="40" rx="20" fill="url(#ctaGrad)"/>
          <text x="50" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Connect</text>
        </g>
      </g>

      <!-- CalDAV URL -->
      <g transform="translate(0, 460)">
        <rect width="920" height="160" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-dasharray="6 4"/>
        <g transform="translate(24, 24)">
          <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">📡 CalDAV / Webcal URL</text>
          <text x="0" y="22" fill="#6B7280" font-size="12">For advanced users: subscribe via URL in any CalDAV-compatible app</text>
          <rect x="0" y="40" width="800" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
          <text x="16" y="64" fill="#111827" font-size="12" font-family="monospace">webcal://skillseed.app/cal/mai_tran/feed.ics</text>
          <g transform="translate(816, 40)">
            <rect width="56" height="40" rx="8" fill="url(#ctaGrad)"/>
            <text x="28" y="26" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">📋 Copy</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
