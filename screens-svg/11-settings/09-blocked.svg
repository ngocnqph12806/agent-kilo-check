<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">⚙️ Settings · Blocked Users</text>
  </g>

  <!-- Sidebar -->
  <g transform="translate(80, 180)">
    <rect width="240" height="660" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)" fill="#374151" font-size="14">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">ACCOUNT</text>
      <g transform="translate(0, 20)"><text x="20" y="20">👤 Account</text></g>
      <g transform="translate(0, 60)"><text x="20" y="20">🔔 Notifications</text></g>
      <g transform="translate(0, 100)"><text x="20" y="20">🔒 Privacy</text></g>
      <g transform="translate(0, 140)"><text x="20" y="20">💳 Payments</text></g>
      <g transform="translate(0, 200)" fill="#9CA3AF"><text x="0" y="0" font-size="11" font-weight="700">PREFERENCES</text></g>
      <g transform="translate(0, 220)"><text x="20" y="20">🌍 Locale</text></g>
      <g transform="translate(0, 260)"><text x="20" y="20">🔗 Wallet</text></g>
      <g transform="translate(0, 300)"><text x="20" y="20">📅 Calendars</text></g>
      <g transform="translate(0, 340)"><text x="20" y="20">💻 Devices</text></g>
      <g transform="translate(0, 400)" fill="#9CA3AF"><text x="0" y="0" font-size="11" font-weight="700">DATA</text></g>
      <g transform="translate(0, 420)"><text x="20" y="20">📥 Export</text></g>
      <g transform="translate(0, 460)">
        <rect width="200" height="36" rx="8" fill="#ECFDF5"/>
        <text x="20" y="23" fill="#10B981" font-size="13" font-weight="600">🚫 Blocked</text>
      </g>
      <g transform="translate(0, 500)"><text x="20" y="20" fill="#EF4444" font-weight="600">⚠️ Delete account</text></g>
    </g>
  </g>

  <!-- Main -->
  <g transform="translate(360, 180)">
    <rect width="1000" height="660" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">🚫 Blocked users (3)</text>
      <text x="0" y="28" fill="#6B7280" font-size="13">People you've blocked can't see your profile, message you, or book sessions with you.</text>

      <g transform="translate(0, 80)">
        <rect width="920" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
        <text x="20" y="22" fill="#9CA3AF" font-size="14">🔍</text>
        <text x="50" y="38" fill="#9CA3AF" font-size="13">Search blocked users...</text>
      </g>

      <g transform="translate(0, 160)">
        <rect width="920" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(20, 16)">
          <circle cx="24" cy="24" r="24" fill="#FED7AA"/>
          <text x="24" y="36" text-anchor="middle" font-size="22">👨</text>
        </g>
        <g transform="translate(80, 24)">
          <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Spam User 1234</text>
          <text x="0" y="20" fill="#6B7280" font-size="11">Blocked Sep 5, 2026 · Spam / Scam</text>
        </g>
        <g transform="translate(800, 20)">
          <rect width="100" height="40" rx="20" fill="transparent" stroke="#10B981"/>
          <text x="50" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">Unblock</text>
        </g>
      </g>

      <g transform="translate(0, 256)">
        <rect width="920" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(20, 16)">
          <circle cx="24" cy="24" r="24" fill="#FBCFE8"/>
          <text x="24" y="36" text-anchor="middle" font-size="22">👩</text>
        </g>
        <g transform="translate(80, 24)">
          <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Bad Actor</text>
          <text x="0" y="20" fill="#6B7280" font-size="11">Blocked Aug 22, 2026 · Harassment</text>
        </g>
        <g transform="translate(800, 20)">
          <rect width="100" height="40" rx="20" fill="transparent" stroke="#10B981"/>
          <text x="50" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">Unblock</text>
        </g>
      </g>

      <g transform="translate(0, 352)">
        <rect width="920" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <g transform="translate(20, 16)">
          <circle cx="24" cy="24" r="24" fill="#FEF3C7"/>
          <text x="24" y="36" text-anchor="middle" font-size="22">👨</text>
        </g>
        <g transform="translate(80, 24)">
          <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Troll Account</text>
          <text x="0" y="20" fill="#6B7280" font-size="11">Blocked Aug 12, 2026 · Spam</text>
        </g>
        <g transform="translate(800, 20)">
          <rect width="100" height="40" rx="20" fill="transparent" stroke="#10B981"/>
          <text x="50" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">Unblock</text>
        </g>
      </g>

      <g transform="translate(0, 480)">
        <rect width="920" height="120" rx="10" fill="#FEF3C7"/>
        <g transform="translate(24, 24)">
          <text x="0" y="0" font-size="28">ℹ️</text>
        </g>
        <g transform="translate(72, 24)">
          <text x="0" y="14" fill="#92400E" font-size="14" font-weight="700">Need to report someone?</text>
          <text x="0" y="38" fill="#78350F" font-size="12">If someone is harassing you or violating our community guidelines,</text>
          <text x="0" y="58" fill="#78350F" font-size="12">please <tspan fill="#10B981" font-weight="600">submit a report</tspan> instead of just blocking.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
