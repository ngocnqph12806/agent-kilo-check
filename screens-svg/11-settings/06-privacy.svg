<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">⚙️ Settings · Privacy</text>
  </g>

  <!-- Sidebar -->
  <g transform="translate(80, 180)">
    <rect width="240" height="660" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)" fill="#374151" font-size="14">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">ACCOUNT</text>
      <g transform="translate(0, 20)"><text x="20" y="20">👤 Account</text></g>
      <g transform="translate(0, 60)"><text x="20" y="20">🔔 Notifications</text></g>
      <g transform="translate(0, 100)">
        <rect width="200" height="36" rx="8" fill="#ECFDF5"/>
        <text x="20" y="23" fill="#10B981" font-size="13" font-weight="600">🔒 Privacy</text>
      </g>
      <g transform="translate(0, 140)"><text x="20" y="20">💳 Payments</text></g>
      <g transform="translate(0, 200)" fill="#9CA3AF"><text x="0" y="0" font-size="11" font-weight="700">PREFERENCES</text></g>
      <g transform="translate(0, 220)"><text x="20" y="20">🌍 Locale</text></g>
      <g transform="translate(0, 260)"><text x="20" y="20">🔗 Wallet</text></g>
      <g transform="translate(0, 300)"><text x="20" y="20">📅 Calendars</text></g>
      <g transform="translate(0, 340)"><text x="20" y="20">💻 Devices</text></g>
      <g transform="translate(0, 400)" fill="#9CA3AF"><text x="0" y="0" font-size="11" font-weight="700">DATA</text></g>
      <g transform="translate(0, 420)"><text x="20" y="20">📥 Export</text></g>
      <g transform="translate(0, 460)"><text x="20" y="20">🚫 Blocked</text></g>
      <g transform="translate(0, 500)"><text x="20" y="20" fill="#EF4444" font-weight="600">⚠️ Delete account</text></g>
    </g>
  </g>

  <!-- Main -->
  <g transform="translate(360, 180)">
    <rect width="1000" height="660" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">🔒 Privacy controls</text>
      <text x="0" y="28" fill="#6B7280" font-size="13">Control who can see your activity and how your data is used</text>

      <line x1="0" y1="60" x2="920" y2="60" stroke="#E5E7EB"/>

      <!-- Profile visibility -->
      <g transform="translate(0, 90)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Profile visibility</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">Who can see your profile and skills?</text>
        <g transform="translate(0, 40)">
          <rect width="280" height="60" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
          <text x="20" y="24" fill="#047857" font-size="13" font-weight="700">🌍 Public</text>
          <text x="20" y="44" fill="#065F46" font-size="11">Anyone can find and view</text>
        </g>
        <g transform="translate(296, 40)">
          <rect width="280" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
          <text x="20" y="24" fill="#111827" font-size="13" font-weight="600">👥 Pod members only</text>
          <text x="20" y="44" fill="#6B7280" font-size="11">Only people in your pods</text>
        </g>
        <g transform="translate(592, 40)">
          <rect width="280" height="60" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
          <text x="20" y="24" fill="#111827" font-size="13" font-weight="600">🔒 Private</text>
          <text x="20" y="44" fill="#6B7280" font-size="11">Only you can see</text>
        </g>
      </g>

      <!-- Online status -->
      <g transform="translate(0, 240)">
        <rect width="920" height="60" rx="10" fill="#F9FAFB"/>
        <g transform="translate(20, 12)">
          <circle cx="14" cy="14" r="6" fill="#10B981"/>
          <text x="0" y="34" fill="#111827" font-size="13" font-weight="600">🟢 Show online status</text>
          <text x="0" y="48" fill="#6B7280" font-size="11">Let others see when you're active</text>
        </g>
        <g transform="translate(820, 18)">
          <rect width="48" height="24" rx="12" fill="#10B981"/>
          <circle cx="36" cy="12" r="10" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Discoverable -->
      <g transform="translate(0, 312)">
        <rect width="920" height="60" rx="10" fill="#F9FAFB"/>
        <g transform="translate(20, 12)">
          <text x="0" y="34" fill="#111827" font-size="13" font-weight="600">🔍 Appear in search results</text>
          <text x="0" y="48" fill="#6B7280" font-size="11">Get matched with new learning partners</text>
        </g>
        <g transform="translate(820, 18)">
          <rect width="48" height="24" rx="12" fill="#10B981"/>
          <circle cx="36" cy="12" r="10" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Read receipts -->
      <g transform="translate(0, 384)">
        <rect width="920" height="60" rx="10" fill="#F9FAFB"/>
        <g transform="translate(20, 12)">
          <text x="0" y="34" fill="#111827" font-size="13" font-weight="600">✓✓ Read receipts</text>
          <text x="0" y="48" fill="#6B7280" font-size="11">Let others see when you've read their messages</text>
        </g>
        <g transform="translate(820, 18)">
          <rect width="48" height="24" rx="12" fill="#10B981"/>
          <circle cx="36" cy="12" r="10" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Data sharing -->
      <g transform="translate(0, 460)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Data &amp; analytics</text>
        <g transform="translate(0, 20)">
          <rect width="920" height="60" rx="10" fill="#F9FAFB"/>
          <text x="20" y="32" fill="#111827" font-size="13" font-weight="600">📊 Help improve SkillSeed</text>
          <text x="20" y="48" fill="#6B7280" font-size="11">Share anonymous usage data</text>
          <g transform="translate(820, 18)">
            <rect width="48" height="24" rx="12" fill="#10B981"/>
            <circle cx="36" cy="12" r="10" fill="#FFFFFF"/>
          </g>
        </g>
        <g transform="translate(0, 88)">
          <rect width="920" height="60" rx="10" fill="#F9FAFB"/>
          <text x="20" y="32" fill="#111827" font-size="13" font-weight="600">🎯 Personalized AI matching</text>
          <text x="20" y="48" fill="#6B7280" font-size="11">Use my skills/goals for better matches</text>
          <g transform="translate(820, 18)">
            <rect width="48" height="24" rx="12" fill="#10B981"/>
            <circle cx="36" cy="12" r="10" fill="#FFFFFF"/>
          </g>
        </g>
      </g>

      <g transform="translate(0, 620)">
        <rect width="140" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="70" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Save changes</text>
      </g>
    </g>
  </g>
</svg>
