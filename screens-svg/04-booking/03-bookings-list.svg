      <text x="180" y="20" fill="#374151" font-size="11" font-family="monospace">#SK-2026-09-1058</text>
    </g>
  </g>

  <!-- Booking card 3 -->
  <g transform="translate(80, 590)">
    <rect width="1280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect width="6" height="140" rx="3" fill="#F59E0B"/>

    <g transform="translate(28, 20)">
