      <text x="40" y="34" text-anchor="middle" fill="#92400E" font-size="11" font-weight="700">SEP</text>
      <text x="40" y="64" text-anchor="middle" fill="#111827" font-size="32" font-weight="800">17</text>
      <text x="40" y="86" text-anchor="middle" fill="#6B7280" font-size="11">Tuesday</text>
