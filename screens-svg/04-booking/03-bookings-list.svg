  </g>

  <!-- Tabs -->
  <g transform="translate(80, 200)">
    <rect width="200" height="44" rx="22" fill="#10B981"/>
    <text x="100" y="28" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Upcoming (3)</text>
    <g transform="translate(212, 0)">
      <rect width="120" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="28" text-anchor="middle" fill="#374151" font-size="13">Past (24)</text>
    </g>
    <g transform="translate(344, 0)">
