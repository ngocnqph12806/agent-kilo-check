        <text x="50" y="22" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">Reschedule</text>
      </g>
      <g transform="translate(110, 70)">
        <rect width="80" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
        <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="13">Cancel</text>
      </g>
    </g>
