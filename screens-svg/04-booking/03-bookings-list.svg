      <text x="0" y="22" fill="#6B7280" font-size="13">🧘 Morning Meditation Routine · 30 min · 1 seed</text>
      <text x="0" y="44" fill="#6B7280" font-size="12">⏰ Tue Sep 17 · 07:00 - 07:30 · 📍 Online (video call)</text>
