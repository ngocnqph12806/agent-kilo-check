<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Top nav -->
  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Centered card -->
  <g transform="translate(420, 130)">
    <rect width="600" height="660" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Success icon -->
    <g transform="translate(240, 60)">
      <circle cx="60" cy="60" r="60" fill="#ECFDF5"/>
      <circle cx="60" cy="60" r="48" fill="#10B981"/>
      <path d="M40 60 L55 75 L82 45" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="300" y="240" text-anchor="middle" fill="#111827" font-size="32" font-weight="800">Booking confirmed!</text>
    <text x="300" y="270" text-anchor="middle" fill="#6B7280" font-size="14">We've notified Chef Marco. See you on Tuesday.</text>

    <!-- Booking details -->
    <g transform="translate(40, 300)">
      <rect width="520" height="240" rx="12" fill="#F9FAFB"/>
      <g transform="translate(20, 20)">
        <circle cx="30" cy="30" r="30" fill="#DBEAFE"/>
        <text x="30" y="46" text-anchor="middle" font-size="26">👨‍🍳</text>
      </g>
      <g transform="translate(90, 28)">
        <text x="0" y="0" fill="#111827" font-size="18" font-weight="700">Chef Marco Rossi</text>
        <text x="0" y="22" fill="#6B7280" font-size="13">🍝 Italian Pasta Masterclass</text>
      </g>

      <line x1="20" y1="80" x2="500" y2="80" stroke="#E5E7EB"/>

      <g transform="translate(20, 100)" fill="#374151" font-size="13">
        <g>
          <text x="0" y="0" fill="#9CA3AF" font-size="11">📅 DATE</text>
          <text x="0" y="20" fill="#111827" font-weight="600">Tuesday, Sep 10, 2026</text>
        </g>
        <g transform="translate(170, 0)">
          <text x="0" y="0" fill="#9CA3AF" font-size="11">⏰ TIME</text>
          <text x="0" y="20" fill="#111827" font-weight="600">19:00 - 19:45</text>
        </g>
        <g transform="translate(340, 0)">
          <text x="0" y="0" fill="#9CA3AF" font-size="11">🌱 COST</text>
          <text x="0" y="20" fill="#111827" font-weight="600">2 seeds</text>
        </g>
      </g>

      <g transform="translate(20, 160)" fill="#374151" font-size="13">
        <g>
          <text x="0" y="0" fill="#9CA3AF" font-size="11">🆔 BOOKING ID</text>
          <text x="0" y="20" fill="#111827" font-weight="600" font-family="monospace">#SK-2026-09-1042</text>
        </g>
        <g transform="translate(280, 0)">
          <text x="0" y="0" fill="#9CA3AF" font-size="11">💼 BALANCE</text>
          <text x="0" y="20" fill="#10B981" font-weight="700">140 seeds remaining</text>
        </g>
      </g>
    </g>

    <!-- Reminder info -->
    <g transform="translate(40, 560)">
      <rect width="520" height="48" rx="10" fill="#FEF3C7"/>
      <g transform="translate(16, 16)">
        <circle cx="8" cy="8" r="8" fill="#F59E0B"/>
        <text x="8" y="13" text-anchor="middle" fill="#FFFFFF" font-size="10">⏰</text>
      </g>
      <text x="44" y="22" fill="#92400E" font-size="12" font-weight="600">Calendar invite sent to your email</text>
      <text x="44" y="38" fill="#78350F" font-size="11">We'll send you a reminder 1 hour before the session starts</text>
    </g>

    <!-- Buttons -->
    <g transform="translate(40, 630)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">View bookings</text>
    </g>
    <g transform="translate(220, 630)">
      <rect width="180" height="44" rx="22" fill="transparent" stroke="#10B981" stroke-width="2"/>
      <text x="90" y="28" text-anchor="middle" fill="#10B981" font-size="14" font-weight="600">Add to calendar</text>
    </g>
    <g transform="translate(420, 630)">
      <rect width="140" height="44" rx="22" fill="url(#ctaGrad)"/>
      <text x="70" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Done →</text>
    </g>
  </g>
</svg>
