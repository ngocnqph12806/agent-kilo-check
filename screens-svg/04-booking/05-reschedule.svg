<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB" opacity="1"/>
  <rect width="1440" height="900" fill="#000000" opacity="0.4"/>

  <!-- Modal -->
  <g transform="translate(370, 80)">
    <rect width="700" height="740" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(0, 0)">
      <rect width="700" height="72" rx="16" fill="#F9FAFB"/>
      <text x="32" y="44" fill="#111827" font-size="20" font-weight="800">📅 Reschedule session</text>
      <text x="668" y="44" text-anchor="end" fill="#9CA3AF" font-size="20">×</text>
    </g>

    <!-- Current -->
    <g transform="translate(32, 96)">
      <rect width="636" height="60" rx="10" fill="#FEE2E2"/>
      <text x="20" y="26" fill="#991B1B" font-size="11" font-weight="600">CURRENT BOOKING</text>
      <text x="20" y="48" fill="#7F1D1D" font-size="13">Tue, Sep 10 · 19:00 - 19:45 · Chef Marco Rossi</text>
    </g>

    <!-- Pick a new date -->
    <g transform="translate(32, 180)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Pick a new date</text>
      <g transform="translate(0, 16)">
        <rect width="636" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="32" fill="#111827" font-size="14">📅 September 2026</text>
        <text x="616" y="32" text-anchor="end" fill="#9CA3AF" font-size="14">‹ ›</text>
      </g>
      <!-- Mini calendar -->
      <g transform="translate(0, 80)">
        <g fill="#9CA3AF" font-size="11" font-weight="600">
          <text x="20" y="0">MON</text>
          <text x="110" y="0">TUE</text>
          <text x="200" y="0">WED</text>
          <text x="290" y="0">THU</text>
          <text x="380" y="0">FRI</text>
          <text x="470" y="0">SAT</text>
          <text x="560" y="0">SUN</text>
        </g>
        <!-- Week 1 -->
        <g transform="translate(0, 20)">
          <g><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">1</text></g>
          <g transform="translate(90, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">2</text></g>
          <g transform="translate(180, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">3</text></g>
          <g transform="translate(270, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">4</text></g>
          <g transform="translate(360, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">5</text></g>
          <g transform="translate(450, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#F3F4F6"/><text x="26" y="26" text-anchor="middle" fill="#9CA3AF" font-size="13">6</text></g>
          <g transform="translate(540, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#F3F4F6"/><text x="26" y="26" text-anchor="middle" fill="#9CA3AF" font-size="13">7</text></g>
        </g>
        <!-- Week 2 -->
        <g transform="translate(0, 70)">
          <g><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">8</text></g>
          <g transform="translate(90, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">9</text></g>
          <g transform="translate(180, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FEE2E2"/><text x="26" y="26" text-anchor="middle" fill="#991B1B" font-size="13" font-weight="700">10</text></g>
          <g transform="translate(270, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#10B981"/><text x="26" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">11</text></g>
          <g transform="translate(360, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#10B981"/><text x="26" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">12</text></g>
          <g transform="translate(450, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#F3F4F6"/><text x="26" y="26" text-anchor="middle" fill="#9CA3AF" font-size="13">13</text></g>
          <g transform="translate(540, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#F3F4F6"/><text x="26" y="26" text-anchor="middle" fill="#9CA3AF" font-size="13">14</text></g>
        </g>
        <!-- Week 3 -->
        <g transform="translate(0, 120)">
          <g><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">15</text></g>
          <g transform="translate(90, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">16</text></g>
          <g transform="translate(180, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="26" y="26" text-anchor="middle" fill="#111827" font-size="13">17</text></g>
          <g transform="translate(270, 0)"><rect x="6" y="0" width="40" height="40" rx="8" fill="#10B981"/><text x="26" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">18</text></g>
        </g>
      </g>
    </g>

    <!-- Time slots -->
    <g transform="translate(32, 440)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Available time slots (Thu, Sep 11)</text>
      <g transform="translate(0, 16)">
        <g><rect width="90" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="45" y="25" text-anchor="middle" fill="#374151" font-size="13">10:00</text></g>
        <g transform="translate(102, 0)"><rect width="90" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="45" y="25" text-anchor="middle" fill="#374151" font-size="13">12:00</text></g>
        <g transform="translate(204, 0)"><rect width="90" height="40" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="45" y="25" text-anchor="middle" fill="#10B981" font-size="13" font-weight="700">14:00</text></g>
        <g transform="translate(306, 0)"><rect width="90" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="45" y="25" text-anchor="middle" fill="#374151" font-size="13">16:00</text></g>
        <g transform="translate(408, 0)"><rect width="90" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="45" y="25" text-anchor="middle" fill="#374151" font-size="13">19:00</text></g>
        <g transform="translate(510, 0)"><rect width="126" height="40" rx="8" fill="#F3F4F6"/><text x="63" y="25" text-anchor="middle" fill="#9CA3AF" font-size="13">More...</text></g>
      </g>
    </g>

    <!-- Reason -->
    <g transform="translate(32, 540)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Reason for rescheduling (optional)</text>
      <g transform="translate(0, 16)">
        <rect width="636" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="32" fill="#9CA3AF" font-size="12">Let the mentor know why...</text>
      </g>
    </g>

    <!-- Notice -->
    <g transform="translate(32, 620)">
      <rect width="636" height="44" rx="10" fill="#FEF3C7"/>
      <text x="20" y="28" fill="#92400E" font-size="12" font-weight="600">ℹ️ Free reschedule. No seeds will be charged or refunded.</text>
    </g>

    <!-- Buttons -->
    <g transform="translate(32, 680)">
      <rect width="200" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="100" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">Keep original time</text>
    </g>
    <g transform="translate(248, 680)">
      <rect width="420" height="44" rx="22" fill="url(#ctaGrad)"/>
      <text x="210" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Confirm new time: Thu Sep 11, 14:00 →</text>
    </g>
  </g>
</svg>
