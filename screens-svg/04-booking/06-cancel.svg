<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB" opacity="1"/>
  <rect width="1440" height="900" fill="#000000" opacity="0.4"/>

  <g transform="translate(420, 200)">
    <rect width="600" height="500" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Warning icon -->
    <g transform="translate(252, 40)">
      <circle cx="48" cy="48" r="48" fill="#FEE2E2"/>
      <circle cx="48" cy="48" r="40" fill="#EF4444"/>
      <text x="48" y="64" text-anchor="middle" fill="#FFFFFF" font-size="48" font-weight="700">!</text>
    </g>

    <text x="300" y="200" text-anchor="middle" fill="#111827" font-size="24" font-weight="800">Cancel this booking?</text>
    <text x="300" y="230" text-anchor="middle" fill="#6B7280" font-size="14">This action cannot be undone.</text>

    <!-- Booking summary -->
    <g transform="translate(40, 260)">
      <rect width="520" height="80" rx="10" fill="#F9FAFB"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#DBEAFE"/>
        <text x="24" y="38" text-anchor="middle" font-size="20">👨‍🍳</text>
      </g>
      <g transform="translate(80, 20)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Chef Marco Rossi</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">Tue, Sep 10 · 19:00 - 19:45 · Italian Pasta</text>
        <text x="0" y="38" fill="#10B981" font-size="12" font-weight="600">Refund: 2 seeds</text>
      </g>
    </g>

    <!-- Reason options -->
    <g transform="translate(40, 360)">
      <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Why are you cancelling? (helps us improve)</text>
      <g transform="translate(0, 16)">
        <rect width="520" height="32" rx="8" fill="transparent" stroke="#E5E7EB"/>
        <text x="20" y="22" fill="#374151" font-size="13">○ Schedule conflict</text>
      </g>
      <g transform="translate(0, 52)">
        <rect width="520" height="32" rx="8" fill="transparent" stroke="#E5E7EB"/>
        <text x="20" y="22" fill="#374151" font-size="13">○ Found another mentor</text>
      </g>
      <g transform="translate(0, 88)">
        <rect width="520" height="32" rx="8" fill="transparent" stroke="#E5E7EB"/>
        <text x="20" y="22" fill="#374151" font-size="13">○ No longer need this skill</text>
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(40, 580)">
      <rect width="240" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="120" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">Keep booking</text>
    </g>
    <g transform="translate(296, 580)">
      <rect width="264" height="44" rx="22" fill="url(#dangerGrad)"/>
      <text x="132" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Yes, cancel &amp; refund 2 seeds</text>
    </g>
  </g>
</svg>
