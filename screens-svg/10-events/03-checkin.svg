<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Top nav -->
  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Card -->
  <g transform="translate(420, 130)">
    <rect width="600" height="700" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Success badge -->
    <g transform="translate(252, 40)">
      <circle cx="48" cy="48" r="48" fill="#ECFDF5"/>
      <circle cx="48" cy="48" r="40" fill="#10B981"/>
      <path d="M28 48 L42 62 L70 34" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="300" y="200" text-anchor="middle" fill="#111827" font-size="28" font-weight="800">You're checked in! 🎉</text>
    <text x="300" y="226" text-anchor="middle" fill="#6B7280" font-size="14">Welcome to Pasta Making 101</text>

    <!-- Event info -->
    <g transform="translate(40, 260)">
      <rect width="520" height="100" rx="12" fill="#DBEAFE"/>
      <g transform="translate(20, 20)">
        <text x="0" y="0" font-size="40">🎓</text>
      </g>
      <g transform="translate(80, 26)">
        <text x="0" y="0" fill="#111827" font-size="16" font-weight="700">Pasta Making 101</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">The Hive, District 1, HCMC</text>
        <text x="0" y="38" fill="#6B7280" font-size="12">Sat Sep 14 · 14:00 - 17:00</text>
      </g>
    </g>

    <!-- Check-in code -->
    <g transform="translate(40, 380)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">YOUR CHECK-IN CODE</text>
      <rect x="0" y="10" width="520" height="80" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="260" y="64" text-anchor="middle" fill="#111827" font-size="32" font-weight="800" font-family="monospace">PSTA-9F3K-2M7H</text>
      <text x="260" y="86" text-anchor="middle" fill="#10B981" font-size="11">Show this code at the entrance</text>
    </g>

    <!-- QR -->
    <g transform="translate(220, 490)">
      <rect width="160" height="160" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <g fill="#111827">
        <rect x="16" y="16" width="40" height="40"/>
        <rect x="104" y="16" width="40" height="40"/>
        <rect x="16" y="104" width="40" height="40"/>
      </g>
      <g fill="#FFFFFF">
        <rect x="24" y="24" width="24" height="24"/>
        <rect x="112" y="24" width="24" height="24"/>
        <rect x="24" y="112" width="24" height="24"/>
      </g>
      <g fill="#111827">
        <rect x="32" y="32" width="8" height="8"/>
        <rect x="64" y="40" width="8" height="8"/>
        <rect x="80" y="48" width="8" height="8"/>
        <rect x="96" y="56" width="8" height="8"/>
        <rect x="72" y="72" width="8" height="8"/>
        <rect x="88" y="80" width="8" height="8"/>
        <rect x="64" y="104" width="8" height="8"/>
        <rect x="80" y="120" width="8" height="8"/>
        <rect x="96" y="128" width="8" height="8"/>
        <rect x="120" y="112" width="8" height="8"/>
      </g>
    </g>

    <!-- Info -->
    <g transform="translate(40, 670)" fill="#374151" font-size="13">
      <text x="0" y="0">📍 <tspan fill="#111827" font-weight="600">The Hive</tspan> · 248 Pasteur, District 1</text>
      <text x="0" y="20">🚪 Look for the "SkillSeed" sign on the 3rd floor</text>
      <text x="0" y="40">📞 Host contact: +84 901 234 567 (Marco)</text>
    </g>

    <!-- Buttons -->
    <g transform="translate(40, 730)">
      <rect width="240" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="120" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">Add to calendar</text>
    </g>
    <g transform="translate(300, 730)">
      <rect width="240" height="44" rx="22" fill="url(#ctaGrad)"/>
      <text x="120" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">View event details →</text>
    </g>
  </g>
</svg>
