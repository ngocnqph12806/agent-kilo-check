<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
      <text x="160" y="20" fill="#9CA3AF" font-size="13">· Acme Corp</text>
    </g>
  </g>

  <g transform="translate(80, 100)" fill="#374151" font-size="13">
    <text x="0" y="0">Reports</text>
    <text x="80" y="0">›</text>
    <text x="95" y="0" fill="#10B981" font-weight="600">Export Report</text>
  </g>

  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">📥 Export Report</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Generate a detailed report of your organization's learning activity</text>
  </g>

  <!-- Config card -->
  <g transform="translate(80, 200)">
    <rect width="800" height="560" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <text x="0" y="0" fill="#111827" font-size="18" font-weight="800">📊 Configure your report</text>

      <g transform="translate(0, 40)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Report type</text>
        <g transform="translate(0, 16)">
          <rect width="368" height="60" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
          <g transform="translate(20, 12)">
            <rect width="36" height="36" rx="8" fill="#10B981"/>
            <text x="18" y="26" text-anchor="middle" fill="#FFFFFF" font-size="16">📊</text>
          </g>
          <g transform="translate(72, 16)">
            <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">📈 Org Summary</text>
            <text x="0" y="32" fill="#065F46" font-size="11">Overview of all metrics</text>
          </g>
        </g>
        <g transform="translate(384, 16)">
          <rect width="368" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <g transform="translate(20, 12)">
            <rect width="36" height="36" rx="8" fill="#DBEAFE"/>
            <text x="18" y="26" text-anchor="middle" fill="#1E40AF" font-size="16">👥</text>
          </g>
          <g transform="translate(72, 16)">
            <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Member roster</text>
            <text x="0" y="32" fill="#6B7280" font-size="11">Detailed member data</text>
          </g>
        </g>
        <g transform="translate(0, 88)">
          <rect width="368" height="60" rx="10" bg fill="#FFFFFF" stroke="#E5E7EB"/>
          <g transform="translate(20, 12)">
            <rect width="36" height="36" rx="8" fill="#FEF3C7"/>
            <text x="18" y="26" text-anchor="middle" fill="#92400E" font-size="16">📚</text>
          </g>
          <g transform="translate(72, 16)">
            <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Skill pool</text>
            <text x="0" y="32" fill="#6B7280" font-size="11">Skills &amp; coverage report</text>
          </g>
        </g>
        <g transform="translate(384, 88)">
          <rect width="368" height="60" rx="10" bg fill="#FFFFFF" stroke="#E5E7EB"/>
          <g transform="translate(20, 12)">
            <rect width="36" height="36" rx="8" fill="#FCE7F3"/>
            <text x="18" y="26" text-anchor="middle" fill="#9D174D" font-size="16">💳</text>
          </g>
          <g transform="translate(72, 16)">
            <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Billing</text>
            <text x="0" y="32" fill="#6B7280" font-size="11">Invoices &amp; seats</text>
          </g>
        </g>
      </g>

      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Date range</text>
        <g transform="translate(0, 16)">
          <rect width="368" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="28" fill="#111827" font-size="13">📅 Aug 1, 2026</text>
        </g>
        <text x="380" y="44" text-anchor="middle" fill="#9CA3AF" font-size="13">→</text>
        <g transform="translate(404, 16)">
          <rect width="368" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="28" fill="#111827" font-size="13">📅 Sep 7, 2026</text>
        </g>
      </g>

      <g transform="translate(0, 308)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Format</text>
        <g transform="translate(0, 16)">
          <rect width="180" height="44" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
          <text x="20" y="28" fill="#111827" font-size="13">📄 PDF</text>
          <text x="160" y="28" text-anchor="end" fill="#10B981" font-size="13">✓</text>
        </g>
        <g transform="translate(190, 16)">
          <rect width="180" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="28" fill="#111827" font-size="13">📊 Excel</text>
        </g>
        <g transform="translate(380, 16)">
          <rect width="180" height="44" rx="10" bg fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="28" fill="#111827" font-size="13">📋 CSV</text>
        </g>
      </g>

      <g transform="translate(0, 410)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Email to recipients</text>
        <rect x="0" y="10" width="736" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="38" fill="#111827" font-size="13">admins@acme.com, finance@acme.com</text>
      </g>

      <g transform="translate(0, 480)">
        <rect width="140" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
        <text x="70" y="26" text-anchor="middle" fill="#374151" font-size="13">Cancel</text>
      </g>
      <g transform="translate(156, 480)">
        <rect width="200" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="100" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">📥 Generate report</text>
      </g>
    </g>
  </g>

  <!-- Recent exports -->
  <g transform="translate(900, 200)">
    <rect width="460" height="560" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📂 Recent reports</text>

      <g transform="translate(0, 24)">
        <rect width="412" height="80" rx="10" fill="#F9FAFB"/>
        <g transform="translate(16, 16)">
          <rect width="48" height="48" rx="8" fill="#FEE2E2"/>
          <text x="24" y="32" text-anchor="middle" fill="#991B1B" font-size="20">📄</text>
        </g>
        <g transform="translate(76, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Org Summary · Aug 2026</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Generated Sep 1 · 4.2 MB · 28 pages</text>
          <text x="0" y="50" fill="#10B981" font-size="11" font-weight="600">📥 Download PDF</text>
        </g>
      </g>

      <g transform="translate(0, 116)">
        <rect width="412" height="80" rx="10" fill="#F9FAFB"/>
        <g transform="translate(16, 16)">
          <rect width="48" height="48" rx="8" fill="#DBEAFE"/>
          <text x="24" y="32" text-anchor="middle" fill="#1E40AF" font-size="20">📊</text>
        </g>
        <g transform="translate(76, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Member Roster · Aug 2026</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Generated Aug 31 · 1.8 MB · Excel</text>
          <text x="0" y="50" fill="#10B981" font-size="11" font-weight="600">📥 Download XLSX</text>
        </g>
      </g>

      <g transform="translate(0, 208)">
        <rect width="412" height="80" rx="10" fill="#F9FAFB"/>
        <g transform="translate(16, 16)">
          <rect width="48" height="48" rx="8" fill="#FEF3C7"/>
          <text x="24" y="32" text-anchor="middle" fill="#92400E" font-size="20">📚</text>
        </g>
        <g transform="translate(76, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Skill Pool · Q2 2026</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">Generated Jul 1 · 2.4 MB · 14 pages</text>
          <text x="0" y="50" fill="#10B981" font-size="11" font-weight="600">📥 Download PDF</text>
        </g>
      </g>

      <g transform="translate(0, 300)">
        <rect width="412" height="80" rx="10" bg fill="#FEF3C7" stroke="#F59E0B"/>
        <g transform="translate(16, 16)">
          <rect width="48" height="48" rx="8" fill="#F59E0B"/>
          <circle cx="24" cy="24" r="14" fill="#FFFFFF"/>
          <text x="24" y="30" text-anchor="middle" fill="#F59E0B" font-size="14">⟳</text>
        </g>
        <g transform="translate(76, 16)">
          <text x="0" y="14" fill="#92400E" font-size="13" font-weight="700">⏳ Generating...</text>
          <text x="0" y="32" fill="#78350F" font-size="11">Org Summary · Sep 2026</text>
          <text x="0" y="50" fill="#92400E" font-size="11">~30s remaining · 47%</text>
        </g>
      </g>

      <g transform="translate(0, 420)">
        <rect width="412" height="40" rx="20" fill="transparent" stroke="#10B981" stroke-width="2"/>
        <text x="206" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">View all exports →</text>
      </g>

      <g transform="translate(0, 480)">
        <text x="0" y="0" fill="#9CA3AF" font-size="11">💡 Reports are retained for 90 days</text>
        <text x="0" y="16" fill="#9CA3AF" font-size="11">📧 Auto-emailed to admins monthly</text>
      </g>
    </g>
  </g>
</svg>
