<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
      <text x="160" y="20" fill="#9CA3AF" font-size="13">· Acme Corp</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">📈 Reports &amp; Analytics</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Org-wide insights · Last 90 days · Auto-generated</text>
    <g transform="translate(1180, -10)">
      <rect width="180" height="40" rx="20" fill="url(#ctaGrad)"/>
      <text x="90" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">📥 Export PDF</text>
    </g>
  </g>

  <!-- Time tabs -->
  <g transform="translate(80, 200)">
    <rect width="80" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="12">7d</text>
    <g transform="translate(90, 0)">
      <rect width="80" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="12">30d</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="80" height="36" rx="18" fill="#1E40AF"/>
      <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">90d</text>
    </g>
    <g transform="translate(270, 0)">
      <rect width="120" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="12">Custom range</text>
    </g>
  </g>

  <!-- KPI cards -->
  <g transform="translate(80, 280)">
    <rect width="290" height="120" rx="12" fill="url(#heroGrad)" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#BFDBFE" font-size="11" font-weight="700">📊 ACTIVE LEARNERS</text>
      <text x="0" y="60" fill="#FFFFFF" font-size="36" font-weight="800">142</text>
      <text x="0" y="86" fill="#BFDBFE" font-size="12">↑ 23% vs prev period</text>
    </g>
  </g>
  <g transform="translate(390, 280)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">🎓 SESSIONS HELD</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">3,847</text>
      <text x="0" y="86" fill="#10B981" font-size="12">↑ 18% vs prev period</text>
    </g>
  </g>
  <g transform="translate(700, 280)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">⏱️ TOTAL HOURS</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">5,820h</text>
      <text x="0" y="86" fill="#10B981" font-size="12">↑ 12% vs prev period</text>
    </g>
  </g>
  <g transform="translate(1010, 280)">
    <rect width="350" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">⭐ AVG SATISFACTION</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">4.8</text>
      <text x="100" y="60" fill="#F59E0B" font-size="14">⭐⭐⭐⭐⭐</text>
      <text x="0" y="86" fill="#6B7280" font-size="12">From 3,200+ ratings</text>
    </g>
  </g>

  <!-- Charts -->
  <g transform="translate(80, 430)">
    <rect width="800" height="280" rx="12" bg fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📈 Engagement by department</text>
      <text x="0" y="20" fill="#6B7280" font-size="12">Active learners over time, broken down by team</text>
    </g>
    <g transform="translate(60, 80)">
      <line x1="0" y1="0" x2="700" y2="0" stroke="#F3F4F6"/>
      <line x1="0" y1="50" x2="700" y2="50" stroke="#F3F4F6"/>
      <line x1="0" y1="100" x2="700" y2="100" stroke="#F3F4F6"/>
      <line x1="0" y1="150" x2="700" y2="150" stroke="#E5E7EB"/>
      <g transform="translate(0, 30)">
        <polyline points="0,40 50,30 100,40 150,20 200,30 250,10 300,20 350,5" stroke="#1E40AF" stroke-width="3" fill="none"/>
        <circle cx="350" cy="5" r="6" fill="#1E40AF"/>
      </g>
      <g transform="translate(0, 80)">
        <polyline points="0,60 50,50 100,40 150,50 200,30 250,40 300,20 350,30" stroke="#10B981" stroke-width="3" fill="none"/>
        <circle cx="350" cy="30" r="6" fill="#10B981"/>
      </g>
      <g transform="translate(0, 40)">
        <text x="0" y="-10" fill="#1E40AF" font-size="11" font-weight="600">— Engineering</text>
        <text x="140" y="-10" fill="#10B981" font-size="11" font-weight="600">— Marketing</text>
      </g>
    </g>
  </g>

  <!-- Top skills -->
  <g transform="translate(900, 430)">
    <rect width="460" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">🏆 Top skills learned</text>

      <g transform="translate(0, 30)">
        <text x="0" y="14" fill="#374151" font-size="12">React.js</text>
        <rect x="100" y="6" width="280" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="252" height="12" rx="6" fill="#1E40AF"/>
        <text x="388" y="14" fill="#1E40AF" font-size="11" font-weight="700">90%</text>
      </g>
      <g transform="translate(0, 70)">
        <text x="0" y="14" fill="#374151" font-size="12">Vietnamese Cooking</text>
        <rect x="100" y="6" width="280" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="220" height="12" rx="6" fill="#10B981"/>
        <text x="388" y="14" fill="#10B981" font-size="11" font-weight="700">78%</text>
      </g>
      <g transform="translate(0, 110)">
        <text x="0" y="14" fill="#374151" font-size="12">Public Speaking</text>
        <rect x="100" y="6" width="280" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="180" height="12" rx="6" fill="#F59E0B"/>
        <text x="388" y="14" fill="#F59E0B" font-size="11" font-weight="700">64%</text>
      </g>
      <g transform="translate(0, 150)">
        <text x="0" y="14" fill="#374151" font-size="12">Excel Advanced</text>
        <rect x="100" y="6" width="280" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="140" height="12" rx="6" fill="#3B82F6"/>
        <text x="388" y="14" fill="#3B82F6" font-size="11" font-weight="700">50%</text>
      </g>
      <g transform="translate(0, 190)">
        <text x="0" y="14" fill="#374151" font-size="12">UI/UX Design</text>
        <rect x="100" y="6" width="280" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="92" height="12" rx="6" fill="#EC4899"/>
        <text x="388" y="14" fill="#EC4899" font-size="11" font-weight="700">33%</text>
      </g>
    </g>
  </g>

  <!-- Reports list -->
  <g transform="translate(80, 740)">
    <rect width="1280" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 24)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="800">📋 Scheduled reports</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">Auto-emailed to your admins weekly</text>

      <g transform="translate(0, 40)">
        <rect width="380" height="60" rx="10" fill="#F9FAFB"/>
        <g transform="translate(20, 14)">
          <rect width="32" height="32" rx="6" fill="#DBEAFE"/>
          <text x="16" y="22" text-anchor="middle" font-size="16">📊</text>
        </g>
        <g transform="translate(64, 18)">
          <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">📊 Weekly summary</text>
          <text x="0" y="16" fill="#6B7280" font-size="11">Every Monday · 9 AM</text>
        </g>
        <text x="358" y="32" text-anchor="end" fill="#10B981" font-size="11" font-weight="700">✓ Active</text>
      </g>

      <g transform="translate(400, 40)">
        <rect width="380" height="60" rx="10" fill="#F9FAFB"/>
        <g transform="translate(20, 14)">
          <rect width="32" height="32" rx="6" fill="#FCE7F3"/>
          <text x="16" y="22" text-anchor="middle" font-size="16">📈</text>
        </g>
        <g transform="translate(64, 18)">
          <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">📈 Monthly deep dive</text>
          <text x="0" y="16" fill="#6B7280" font-size="11">First of month · 9 AM</text>
        </g>
        <text x="358" y="32" text-anchor="end" fill="#10B981" font-size="11" font-weight="700">✓ Active</text>
      </g>

      <g transform="translate(800, 40)">
        <rect width="380" height="60" rx="10" fill="transparent" stroke="#D1D5DB" stroke-dasharray="6 4"/>
        <text x="190" y="36" text-anchor="middle" fill="#6B7280" font-size="12">+ Schedule custom report</text>
      </g>
    </g>
  </g>
</svg>
