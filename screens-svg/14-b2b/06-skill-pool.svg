<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
      <text x="160" y="20" fill="#9CA3AF" font-size="13">· Acme Corp</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">🎯 Skill Pool</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Aggregate skills across your organization · Find experts, identify gaps</text>
  </g>

  <!-- Filters -->
  <g transform="translate(80, 200)">
    <rect width="320" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="20" y="28" fill="#9CA3AF" font-size="13">🔍 Search skills...</text>
    <g transform="translate(330, 0)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="13">All departments</text>
    </g>
    <g transform="translate(500, 0)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="13">All levels</text>
    </g>
  </g>

  <!-- Skill cards -->
  <g transform="translate(80, 280)">
    <!-- Card 1 -->
    <g>
      <rect width="300" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="36" font-size="40">💻</text>
        <text x="60" y="26" fill="#111827" font-size="16" font-weight="800">React.js</text>
        <text x="60" y="46" fill="#6B7280" font-size="11">Programming · 24 experts</text>

        <g transform="translate(0, 70)">
          <rect width="260" height="14" rx="7" fill="#E5E7EB"/>
          <rect width="220" height="14" rx="7" fill="url(#ctaGrad)"/>
          <text x="260" y="32" text-anchor="end" fill="#111827" font-size="11" font-weight="700">85% coverage</text>
        </g>

        <g transform="translate(0, 110)">
          <text x="0" y="0" fill="#9CA3AF" font-size="10" font-weight="600">LEVELS</text>
          <g transform="translate(0, 8)">
            <rect width="60" height="20" rx="10" fill="#D1FAE5"/>
            <text x="30" y="14" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">Expert · 8</text>
          </g>
          <g transform="translate(66, 8)">
            <rect width="80" height="20" rx="10" fill="#FEF3C7"/>
            <text x="40" y="14" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">Intermediate · 12</text>
          </g>
          <g transform="translate(152, 8)">
            <rect width="60" height="20" rx="10" fill="#F3F4F6"/>
            <text x="30" y="14" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Beginner · 4</text>
          </g>
        </g>

        <g transform="translate(0, 170)">
          <rect width="260" height="32" rx="16" fill="transparent" stroke="#10B981"/>
          <text x="130" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">Browse experts →</text>
        </g>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(320, 0)">
      <rect width="300" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="36" font-size="40">🐍</text>
        <text x="60" y="26" fill="#111827" font-size="16" font-weight="800">Python</text>
        <text x="60" y="46" fill="#6B7280" font-size="11">Programming · 18 experts</text>

        <g transform="translate(0, 70)">
          <rect width="260" height="14" rx="7" fill="#E5E7EB"/>
          <rect width="156" height="14" rx="7" fill="#EF4444"/>
          <text x="260" y="32" text-anchor="end" fill="#EF4444" font-size="11" font-weight="700">60% coverage</text>
        </g>

        <g transform="translate(0, 110)">
          <text x="0" y="0" fill="#9CA3AF" font-size="10" font-weight="600">LEVELS</text>
          <g transform="translate(0, 8)">
            <rect width="60" height="20" rx="10" fill="#FEE2E2"/>
            <text x="30" y="14" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="700">Expert · 3</text>
          </g>
          <g transform="translate(66, 8)">
            <rect width="80" height="20" rx="10" fill="#FEF3C7"/>
            <text x="40" y="14" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">Intermediate · 7</text>
          </g>
          <g transform="translate(152, 8)">
            <rect width="60" height="20" rx="10" fill="#F3F4F6"/>
            <text x="30" y="14" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Beginner · 8</text>
          </g>
        </g>

        <g transform="translate(0, 170)">
          <rect width="260" height="32" rx="16" fill="transparent" stroke="#10B981"/>
          <text x="130" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">Fill gap →</text>
        </g>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(640, 0)">
      <rect width="300" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="36" font-size="40">🎤</text>
        <text x="60" y="26" fill="#111827" font-size="16" font-weight="800">Public Speaking</text>
        <text x="60" y="46" fill="#6B7280" font-size="11">Communication · 12 experts</text>

        <g transform="translate(0, 70)">
          <rect width="260" height="14" rx="7" fill="#E5E7EB"/>
          <rect width="130" height="14" rx="7" fill="#F59E0B"/>
          <text x="260" y="32" text-anchor="end" fill="#F59E0B" font-size="11" font-weight="700">50% coverage</text>
        </g>

        <g transform="translate(0, 110)">
          <text x="0" y="0" fill="#9CA3AF" font-size="10" font-weight="600">LEVELS</text>
          <g transform="translate(0, 8)">
            <rect width="60" height="20" rx="10" fill="#FEE2E2"/>
            <text x="30" y="14" text-anchor="middle" fill="#991B1B" font-size="10" font-weight="700">Expert · 2</text>
          </g>
          <g transform="translate(66, 8)">
            <rect width="80" height="20" rx="10" fill="#FEF3C7"/>
            <text x="40" y="14" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">Intermediate · 5</text>
          </g>
          <g transform="translate(152, 8)">
            <rect width="60" height="20" rx="10" fill="#F3F4F6"/>
            <text x="30" y="14" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Beginner · 5</text>
          </g>
        </g>

        <g transform="translate(0, 170)">
          <rect width="260" height="32" rx="16" fill="transparent" stroke="#10B981"/>
          <text x="130" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">Fill gap →</text>
        </g>
      </g>
    </g>

    <!-- Card 4 -->
    <g transform="translate(960, 0)">
      <rect width="300" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="36" font-size="40">🍳</text>
        <text x="60" y="26" fill="#111827" font-size="16" font-weight="800">Vietnamese Cooking</text>
        <text x="60" y="46" fill="#6B7280" font-size="11">Cultural · 15 experts</text>

        <g transform="translate(0, 70)">
          <rect width="260" height="14" rx="7" fill="#E5E7EB"/>
          <rect width="247" height="14" rx="7" fill="url(#ctaGrad)"/>
          <text x="260" y="32" text-anchor="end" fill="#10B981" font-size="11" font-weight="700">95% coverage</text>
        </g>

        <g transform="translate(0, 110)">
          <text x="0" y="0" fill="#9CA3AF" font-size="10" font-weight="600">LEVELS</text>
          <g transform="translate(0, 8)">
            <rect width="60" height="20" rx="10" fill="#D1FAE5"/>
            <text x="30" y="14" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">Expert · 6</text>
          </g>
          <g transform="translate(66, 8)">
            <rect width="80" height="20" rx="10" fill="#FEF3C7"/>
            <text x="40" y="14" text-anchor="middle" fill="#92400E" font-size="10" font-weight="700">Intermediate · 5</text>
          </g>
          <g transform="translate(152, 8)">
            <rect width="60" height="20" rx="10" fill="#F3F4F6"/>
            <text x="30" y="14" text-anchor="middle" fill="#374151" font-size="10" font-weight="700">Beginner · 4</text>
          </g>
        </g>

        <g transform="translate(0, 170)">
          <rect width="260" height="32" rx="16" fill="transparent" stroke="#10B981"/>
          <text x="130" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">Browse experts →</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Coverage summary -->
  <g transform="translate(80, 540)">
    <rect width="1280" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <text x="0" y="0" fill="#111827" font-size="20" font-weight="800">📊 Org-wide skill coverage</text>
      <text x="0" y="22" fill="#6B7280" font-size="13">Skills where your team has at least one Expert-level member</text>

      <g transform="translate(0, 60)">
        <rect width="1216" height="50" rx="10" fill="#ECFDF5"/>
        <text x="20" y="32" fill="#047857" font-size="16" font-weight="700">🌟 23 skills at expert level</text>
        <text x="380" y="32" fill="#047857" font-size="14">React.js, Vietnamese Cooking, Public Speaking, Cooking...</text>
      </g>

      <g transform="translate(0, 124)">
        <rect width="1216" height="50" rx="10" fill="#FEF3C7"/>
        <text x="20" y="32" fill="#92400E" font-size="16" font-weight="700">⚠️ 12 skills need improvement</text>
        <text x="380" y="32" fill="#92400E" font-size="14">Python, Data Science, Excel, Project Management...</text>
      </g>

      <g transform="translate(0, 188)">
        <rect width="1216" height="50" rx="10" fill="#FEE2E2"/>
        <text x="20" y="32" fill="#991B1B" font-size="16" font-weight="700">❌ 8 skills missing entirely</text>
        <text x="380" y="32" fill="#991B1B" font-size="14">Machine Learning, Cloud Architecture, UX Research, Figma...</text>
      </g>
    </g>
  </g>
</svg>
