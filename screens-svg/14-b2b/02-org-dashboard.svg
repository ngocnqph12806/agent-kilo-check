<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Sidebar -->
  <g>
    <rect width="240" height="900" fill="#FFFFFF"/>
    <line x1="240" y1="0" x2="240" y2="900" stroke="#E5E7EB"/>
    <g transform="translate(20, 24)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="18" font-weight="700">SkillSeed</text>
      <text x="120" y="20" fill="#9CA3AF" font-size="11">· Business</text>
    </g>

    <!-- Org -->
    <g transform="translate(20, 80)">
      <rect width="200" height="48" rx="8" fill="#ECFDF5"/>
      <text x="20" y="22" fill="#9CA3AF" font-size="11" font-weight="700">ORGANIZATION</text>
      <text x="20" y="40" fill="#10B981" font-size="13" font-weight="700">Acme Corp</text>
      <text x="160" y="40" fill="#10B981" font-size="11">▼</text>
    </g>

    <!-- Nav -->
    <g transform="translate(20, 160)" fill="#374151" font-size="13">
      <g>
        <rect width="200" height="36" rx="8" fill="#ECFDF5"/>
        <text x="20" y="23" fill="#10B981" font-weight="600">📊 Dashboard</text>
      </g>
      <g transform="translate(0, 48)"><text x="20" y="20">👥 Members (142)</text></g>
      <g transform="translate(0, 88)"><text x="20" y="20">🎯 Skill Pool</text></g>
      <g transform="translate(0, 128)"><text x="20" y="20">🔍 Internal Matching</text></g>
      <g transform="translate(0, 168)"><text x="20" y="20">📈 Reports</text></g>
      <g transform="translate(0, 208)"><text x="20" y="20">💳 Billing</text></g>

      <text x="0" y="280" fill="#9CA3AF" font-size="11" font-weight="700">ADMIN</text>
      <g transform="translate(0, 300)"><text x="20" y="20">⚙️ Org Settings</text></g>
      <g transform="translate(0, 340)"><text x="20" y="20">🔌 SSO Config</text></g>
      <g transform="translate(0, 380)"><text x="20" y="20">📋 Audit Log</text></g>
    </g>
  </g>

  <!-- Main -->
  <g transform="translate(280, 30)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">📊 Acme Corp Dashboard</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Workspace overview · Last updated 2 min ago</text>
  </g>

  <!-- KPIs -->
  <g transform="translate(280, 110)">
    <rect width="290" height="120" rx="12" fill="url(#heroGrad)" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#BFDBFE" font-size="11" font-weight="700">👥 ACTIVE MEMBERS</text>
      <text x="0" y="60" fill="#FFFFFF" font-size="36" font-weight="800">142/200</text>
      <text x="0" y="86" fill="#BFDBFE" font-size="12">71% activation · ↑ 12 this week</text>
    </g>
  </g>

  <g transform="translate(590, 110)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">🎓 SESSIONS THIS MONTH</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">487</text>
      <text x="0" y="86" fill="#10B981" font-size="12">↑ 23% vs last month</text>
    </g>
  </g>

  <g transform="translate(900, 110)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">🏅 SBTs EARNED</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">847</text>
      <text x="0" y="86" fill="#6B7280" font-size="12">Across 23 skill categories</text>
    </g>
  </g>

  <g transform="translate(1210, 110)">
    <rect width="160" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">💼 SEATS</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">142/200</text>
      <text x="0" y="74" fill="#10B981" font-size="11">58 available</text>
    </g>
  </g>

  <!-- Charts row -->
  <g transform="translate(280, 260)">
    <rect width="600" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📈 Skill learning velocity</text>
      <text x="0" y="20" fill="#6B7280" font-size="12">Skills completed per week (last 12 weeks)</text>

      <g transform="translate(0, 60)">
        <line x1="0" y1="0" x2="552" y2="0" stroke="#F3F4F6"/>
        <line x1="0" y1="50" x2="552" y2="50" stroke="#F3F4F6"/>
        <line x1="0" y1="100" x2="552" y2="100" stroke="#F3F4F6"/>
        <line x1="0" y1="150" x2="552" y2="150" stroke="#E5E7EB"/>

        <g fill="url(#ctaGrad)">
          <rect x="10" y="100" width="32" height="50" rx="3"/>
          <rect x="56" y="80" width="32" height="70" rx="3"/>
          <rect x="102" y="60" width="32" height="90" rx="3"/>
          <rect x="148" y="90" width="32" height="60" rx="3"/>
          <rect x="194" y="40" width="32" height="110" rx="3"/>
          <rect x="240" y="60" width="32" height="90" rx="3"/>
          <rect x="286" y="30" width="32" height="120" rx="3"/>
          <rect x="332" y="50" width="32" height="100" rx="3"/>
          <rect x="378" y="20" width="32" height="130" rx="3"/>
          <rect x="424" y="40" width="32" height="110" rx="3"/>
          <rect x="470" y="30" width="32" height="120" rx="3"/>
          <rect x="516" y="10" width="32" height="140" rx="3"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Skill gaps -->
  <g transform="translate(900, 260)">
    <rect width="470" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">🔥 Top skill gaps</text>
      <text x="0" y="20" fill="#6B7280" font-size="12">Skills you want vs have</text>

      <g transform="translate(0, 50)">
        <text x="0" y="14" fill="#374151" font-size="12">Python</text>
        <rect x="100" y="6" width="320" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="80" height="12" rx="6" fill="#EF4444"/>
        <text x="426" y="14" fill="#EF4444" font-size="11" font-weight="600">-75%</text>
      </g>

      <g transform="translate(0, 80)">
        <text x="0" y="14" fill="#374151" font-size="12">Data Science</text>
        <rect x="100" y="6" width="320" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="120" height="12" rx="6" fill="#F59E0B"/>
        <text x="426" y="14" fill="#F59E0B" font-size="11" font-weight="600">-62%</text>
      </g>

      <g transform="translate(0, 110)">
        <text x="0" y="14" fill="#374151" font-size="12">Public Speaking</text>
        <rect x="100" y="6" width="320" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="160" height="12" rx="6" fill="#10B981"/>
        <text x="426" y="14" fill="#10B981" font-size="11" font-weight="600">-50%</text>
      </g>

      <g transform="translate(0, 140)">
        <text x="0" y="14" fill="#374151" font-size="12">Excel</text>
        <rect x="100" y="6" width="320" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="180" height="12" rx="6" fill="#10B981"/>
        <text x="426" y="14" fill="#10B981" font-size="11" font-weight="600">-44%</text>
      </g>

      <g transform="translate(0, 170)">
        <text x="0" y="14" fill="#374151" font-size="12">React.js</text>
        <rect x="100" y="6" width="320" height="12" rx="6" fill="#E5E7EB"/>
        <rect x="100" y="6" width="200" height="12" rx="6" fill="#10B981"/>
        <text x="426" y="14" fill="#10B981" font-size="11" font-weight="600">-38%</text>
      </g>

      <g transform="translate(0, 220)">
        <rect width="420" height="32" rx="6" fill="transparent" stroke="#10B981"/>
        <text x="210" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">View full skill gap report →</text>
      </g>
    </g>
  </g>

  <!-- Recent activity -->
  <g transform="translate(280, 560)">
    <rect width="1090" height="290" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📊 Recent team activity</text>

      <g transform="translate(0, 32)">
        <rect width="1040" height="44" rx="8" fill="#F9FAFB"/>
        <text x="16" y="28" fill="#111827" font-size="13"><tspan font-weight="600">Mai Tran</tspan> completed a session with <tspan font-weight="600">Sarah Lin</tspan> on React Hooks</text>
        <text x="1024" y="28" text-anchor="end" fill="#9CA3AF" font-size="12">5m ago</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="1040" height="44" rx="8" fill="#F9FAFB"/>
        <text x="16" y="28" fill="#111827" font-size="13"><tspan font-weight="600">Hung Tran</tspan> minted SBT: <tspan fill="#10B981" font-weight="600">Italian Cooking Beginner</tspan></text>
        <text x="1024" y="28" text-anchor="end" fill="#9CA3AF" font-size="12">2h ago</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="1040" height="44" rx="8" fill="#F9FAFB"/>
        <text x="16" y="28" fill="#111827" font-size="13"><tspan font-weight="600">David Lee</tspan> joined the <tspan fill="#10B981" font-weight="600">Italian Cooking Crew</tspan> pod</text>
        <text x="1024" y="28" text-anchor="end" fill="#9CA3AF" font-size="12">5h ago</text>
      </g>

      <g transform="translate(0, 188)">
        <rect width="1040" height="44" rx="8" fill="#F9FAFB"/>
        <text x="16" y="28" fill="#111827" font-size="13"><tspan font-weight="600">Anna Kim</tspan> sent a message in <tspan font-weight="600">Frontend Devs Vietnam</tspan></text>
        <text x="1024" y="28" text-anchor="end" fill="#9CA3AF" font-size="12">Yesterday</text>
      </g>
    </g>
  </g>
</svg>
