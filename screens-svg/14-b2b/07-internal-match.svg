          <text x="14" y="38" fill="#1E3A8A" font-size="12">React.js · 5 yrs experience</text>
        </g>
      </g>
      <g transform="translate(20, 200)">
        <rect width="580" height="36" rx="18" fill="url(#ctaGrad)"/>
        <text x="290" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">💬 Message &amp; propose internal session</text>
      </g>
    </g>

    <g transform="translate(640, 0)">
      <rect width="620" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="620" height="100" rx="12" fill="#DBEAFE"/>
      <g transform="translate(20, 16)">
        <circle cx="32" cy="32" r="32" fill="#FFFFFF"/>
        <text x="32" y="48" text-anchor="middle" font-size="28">👩</text>
      </g>
      <g transform="translate(96, 24)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Anna Kim · Marketing</text>
        <text x="0" y="20" fill="#BFDBFE" font-size="11">🎤 Public Speaking · Wants to learn Cooking</text>
      </g>

      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">📊 Mutual match (88%)</text>
        <g transform="translate(0, 16)">
          <rect width="280" height="48" rx="8" fill="#ECFDF5"/>
          <text x="14" y="20" fill="#047857" font-size="11" font-weight="700">🟢 YOU TEACH</text>
          <text x="14" y="38" fill="#065F46" font-size="12">Cooking · Vietnamese</text>
        </g>
        <g transform="translate(296, 16)">
          <rect width="280" height="48" rx="8" fill="#FCE7F3"/>
          <text x="14" y="20" fill="#9D174D" font-size="11" font-weight="700">🟣 SHE TEACHES</text>
          <text x="14" y="38" fill="#831843" font-size="12">Public Speaking</text>
        </g>
      </g>
      <g transform="translate(20, 200)">
        <rect width="580" height="36" rx="18" fill="url(#ctaGrad)"/>
        <text x="290" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">💬 Message &amp; propose internal session</text>
      </g>
    </g>
  </g>

  <g transform="translate(80, 580)">
    <rect width="1280" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 16)">
      <circle cx="32" cy="32" r="32" fill="#D1FAE5"/>
      <text x="32" y="48" text-anchor="middle" font-size="28">👩</text>
    </g>
    <g transform="translate(96, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="700">Hung Tran · Product</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">🍝 Italian Cooking · Wants to learn Data viz</text>
    </g>

    <g transform="translate(20, 120)">
      <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">📊 Mutual match (85%)</text>
      <g transform="translate(0, 16)">
        <rect width="280" height="48" rx="8" fill="#ECFDF5"/>
        <text x="14" y="20" fill="#047857" font-size="11" font-weight="700">🟢 YOU TEACH</text>
        <text x="14" y="38" fill="#065F46" font-size="12">Data viz (Excel)</text>
