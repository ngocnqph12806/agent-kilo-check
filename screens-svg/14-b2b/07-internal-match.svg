      <g transform="translate(296, 16)">
        <rect width="280" height="48" rx="8" fill="#FEF3C7"/>
        <text x="14" y="20" fill="#92400E" font-size="11" font-weight="700">🟡 HE TEACHES</text>
        <text x="14" y="38" fill="#78350F" font-size="12">Italian Cooking · Expert</text>
        </g>
      <g transform="translate(1080, 30)">
        <rect width="180" height="44" rx="22" fill="url(#ctaGrad)"/>
        <text x="90" y="28" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">💬 Connect</text>
