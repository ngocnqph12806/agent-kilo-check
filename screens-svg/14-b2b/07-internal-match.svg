<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
      <text x="160" y="20" fill="#9CA3AF" font-size="13">· Acme Corp</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">🔍 Internal Matching</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Match teammates for internal skill exchanges · Free for your org</text>
  </g>

  <!-- Filters -->
  <g transform="translate(80, 200)">
    <rect width="320" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="20" y="28" fill="#9CA3AF" font-size="13">🔍 Search by name or skill...</text>
    <g transform="translate(330, 0)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="13">All departments</text>
    </g>
    <g transform="translate(500, 0)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="13">All levels</text>
    </g>
  </g>

  <!-- Matches -->
  <g transform="translate(80, 280)">
    <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">🎯 23 internal matches found</text>
    <text x="0" y="22" fill="#6CA3AF" font-size="12">Based on your profile and goals</text>
  </g>

  <g transform="translate(80, 320)">
    <!-- Card 1 -->
    <g>
      <rect width="620" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="620" height="100" rx="12" fill="#FCE7F3"/>
      <g transform="translate(20, 16)">
        <circle cx="32" cy="32" r="32" fill="#FFFFFF"/>
        <text x="32" y="48" text-anchor="middle" font-size="28">👨</text>
      </g>
      <g transform="translate(96, 24)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">David Lee · Engineering</text>
        <text x="0" y="20" fill="#FCE7F3" font-size="11">💻 React.js expert · Wants to learn Vietnamese</text>
      </g>

      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">📊 Mutual match (92%)</text>
        <g transform="translate(0, 16)">
          <rect width="280" height="48" rx="8" fill="#ECFDF5"/>
          <text x="14" y="20" fill="#047857" font-size="11" font-weight="700">🟢 YOU TEACH</text>
          <text x="14" y="38" fill="#065F46" font-size="12">Vietnamese Cooking</text>
        </g>
        <g transform="translate(296, 16)">
          <rect width="280" height="48" rx="8" fill="#DBEAFE"/>
