<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#000000" opacity="0.4"/>

  <g transform="translate(370, 130)">
    <rect width="700" height="640" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g>
      <rect width="700" height="72" rx="16" fill="#F9FAFB"/>
      <text x="32" y="44" fill="#111827" font-size="20" font-weight="800">✉️ Invite Team Members</text>
      <text x="668" y="44" text-anchor="end" fill="#9CA3AF" font-size="20">×</text>
    </g>

    <g transform="translate(40, 100)">
      <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Email addresses (comma-separated)</text>
      <rect x="0" y="14" width="620" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="42" fill="#9CA3AF" font-size="13">alex@acme.com, sarah@acme.com, john@acme.com</text>
      <text x="16" y="68" fill="#10B981" font-size="11" font-weight="600">✓ 3 valid · 0 invalid</text>
    </g>

    <g transform="translate(40, 220)">
      <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Default role</text>
      <g transform="translate(0, 16)">
        <rect width="180" height="44" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="20" y="28" fill="#111827" font-size="13">👤 Member</text>
      </g>
    </g>

    <g transform="translate(40, 300)">
      <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Department</text>
      <g transform="translate(0, 16)">
        <rect width="620" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" fill="#111827" font-size="13">Auto-assign (based on email domain)</text>
      </g>
    </g>

    <g transform="translate(40, 380)">
      <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Welcome message (optional)</text>
      <rect x="0" y="14" width="620" height="120" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="42" fill="#9CA3AF" font-size="13">Hi there!</text>
      <text x="16" y="64" fill="#9CA3AF" font-size="13">You've been invited to join Acme Corp's SkillSeed workspace.</text>
      <text x="16" y="86" fill="#9CA3AF" font-size="13">Click the link below to get started. 🚀</text>
      <text x="16" y="116" fill="#10B981" font-size="11">→ {{invite_link}}</text>
    </g>

    <g transform="translate(40, 530)">
      <rect width="620" height="40" rx="10" fill="#FEF3C7"/>
      <text x="20" y="26" fill="#92400E" font-size="12" font-weight="600">⏰ Invite expires in 7 days · 142 seats remaining (out of 200)</text>
    </g>

    <g transform="translate(40, 590)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">Cancel</text>
    </g>
    <g transform="translate(216, 590)">
      <rect width="220" height="44" rx="22" fill="transparent" stroke="#10B981" stroke-width="2"/>
      <text x="110" y="28" text-anchor="middle" fill="#10B981" font-size="14" font-weight="600">📋 Copy share link</text>
    </g>
    <g transform="translate(452, 590)">
      <rect width="208" height="44" rx="22" fill="url(#ctaGrad)"/>
      <text x="104" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">📤 Send 3 invites</text>
    </g>
  </g>
</svg>
