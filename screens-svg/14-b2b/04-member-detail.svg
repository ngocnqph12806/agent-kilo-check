      <text x="48" y="68" text-anchor="middle" font-size="44">👩</text>
    </g>
    <g transform="translate(150, 36)">
      <text x="0" y="0" fill="#111827" font-size="18" font-weight="700">Mai Tran</text>
      <text x="0" y="22" fill="#6B7280" font-size="12">@mai_tran · ID: 1F4A8B2C</text>
      <g transform="translate(0, 40)">
