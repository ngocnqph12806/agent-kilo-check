      <g transform="translate(0, 72)">
        <rect width="412" height="40" rx="8" fill="#F9FAFB"/>
        <text x="16" y="26" fill="#111827" font-size="13" font-weight="600">✅ Manage SSO config</text>
        <text x="392" y="26" text-anchor="end" fill="#10B981" font-size="11" font-weight="700">Allowed</text>
      </g>
      <g transform="translate(0, 120)">
