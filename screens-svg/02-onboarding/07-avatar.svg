<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g transform="translate(80, 40)">
    <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
    <text x="38" y="20" fill="#111827" font-size="18" font-weight="700">SkillSeed</text>
    <text x="1280" y="20" fill="#6B7280" font-size="14" text-anchor="end">Step 7 of 7</text>
    <text x="1280" y="40" fill="#10B981" font-size="13" font-weight="600" text-anchor="end">99% complete</text>
  </g>

  <g transform="translate(80, 100)">
    <rect width="1280" height="6" rx="3" fill="#E5E7EB"/>
    <rect width="1267" height="6" rx="3" fill="url(#ctaGrad)"/>
  </g>

  <g transform="translate(720, 180)" text-anchor="middle">
    <text x="0" y="0" fill="#111827" font-size="40" font-weight="800">Add a profile photo</text>
    <text x="0" y="38" fill="#6B7280" font-size="16">Profiles with photos get 5x more matches.</text>
  </g>

  <!-- Big avatar -->
  <g transform="translate(620, 280)">
    <circle cx="100" cy="100" r="100" fill="#E5E7EB"/>
    <circle cx="100" cy="100" r="96" fill="#FEF3C7"/>
    <text x="100" y="130" text-anchor="middle" font-size="80">👩</text>
    <!-- Upload overlay -->
    <g transform="translate(140, 140)">
      <circle cx="20" cy="20" r="20" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
      <text x="20" y="28" text-anchor="middle" fill="#FFFFFF" font-size="18">📷</text>
    </g>
  </g>

  <!-- Avatar options -->
  <g transform="translate(420, 500)">
    <text x="300" y="0" text-anchor="middle" fill="#374151" font-size="14" font-weight="700">Or pick an avatar</text>
  </g>

  <g transform="translate(420, 530)">
    <g>
      <circle cx="30" cy="30" r="30" fill="#FEF3C7"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👩</text>
    </g>
    <g transform="translate(70, 0)">
      <circle cx="30" cy="30" r="30" fill="#FEF3C7" stroke="#10B981" stroke-width="3"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👨</text>
    </g>
    <g transform="translate(140, 0)">
      <circle cx="30" cy="30" r="30" fill="#DBEAFE"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👩‍💻</text>
    </g>
    <g transform="translate(210, 0)">
      <circle cx="30" cy="30" r="30" fill="#FCE7F3"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👨‍🍳</text>
    </g>
    <g transform="translate(280, 0)">
      <circle cx="30" cy="30" r="30" fill="#D1FAE5"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👩‍🎨</text>
    </g>
    <g transform="translate(350, 0)">
      <circle cx="30" cy="30" r="30" fill="#E0E7FF"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👨‍🔬</text>
    </g>
    <g transform="translate(420, 0)">
      <circle cx="30" cy="30" r="30" fill="#FED7AA"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👩‍🏫</text>
    </g>
    <g transform="translate(490, 0)">
      <circle cx="30" cy="30" r="30" fill="#FBCFE8"/>
      <text x="30" y="44" text-anchor="middle" font-size="36">👨‍🎤</text>
    </g>
    <g transform="translate(560, 0)">
      <circle cx="30" cy="30" r="30" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="3 3"/>
      <text x="30" y="44" text-anchor="middle" fill="#6B7280" font-size="20">+</text>
    </g>
  </g>

  <!-- Display name -->
  <g transform="translate(420, 650)">
    <text x="300" y="0" text-anchor="middle" fill="#374151" font-size="14" font-weight="700">Display name</text>
    <g transform="translate(50, 16)">
      <rect width="500" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="30" fill="#111827" font-size="14">Mai Tran</text>
    </g>
    <text x="300" y="86" text-anchor="middle" fill="#9CA3AF" font-size="11">This is how others will see you. You can change it later.</text>
  </g>

  <g transform="translate(540, 800)">
    <rect width="160" height="48" rx="24" fill="transparent" stroke="#D1D5DB"/>
    <text x="80" y="30" text-anchor="middle" fill="#6B7280" font-size="14">← Back</text>
  </g>
  <g transform="translate(740, 800)">
    <rect width="160" height="48" rx="24" fill="url(#ctaGrad)"/>
    <text x="80" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Finish →</text>
  </g>
</svg>
