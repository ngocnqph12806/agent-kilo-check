<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Confetti -->
  <g fill="#10B981" opacity="0.5">
    <circle cx="200" cy="150" r="6"/>
    <circle cx="280" cy="100" r="4"/>
    <circle cx="350" cy="200" r="5"/>
    <circle cx="1100" cy="120" r="5"/>
    <circle cx="1200" cy="180" r="6"/>
    <circle cx="1250" cy="100" r="4"/>
  </g>
  <g fill="#F59E0B" opacity="0.5">
    <circle cx="180" cy="700" r="5"/>
    <circle cx="300" cy="780" r="4"/>
    <circle cx="1150" cy="700" r="5"/>
    <circle cx="1250" cy="780" r="4"/>
  </g>
  <g fill="#3B82F6" opacity="0.5">
    <circle cx="220" cy="350" r="5"/>
    <circle cx="1230" cy="350" r="5"/>
  </g>

  <!-- Center -->
  <g transform="translate(720, 250)" text-anchor="middle">
    <!-- Success icon -->
    <circle cx="0" cy="0" r="80" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="68" fill="#10B981"/>
    <path d="M-30 0 L-10 20 L30 -20" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="0" y="160" fill="#111827" font-size="56" font-weight="800">You're all set! 🎉</text>
    <text x="0" y="220" fill="#4B5563" font-size="20">Your profile is ready. We've already matched you with</text>
    <text x="0" y="248" fill="#4B5563" font-size="20"><tspan font-weight="700" fill="#10B981">12 amazing learning partners</tspan> waiting to chat.</text>
  </g>

  <!-- Seeds awarded -->
  <g transform="translate(560, 600)">
    <rect width="320" height="80" rx="12" fill="#FFFFFF"/>
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="20">🌱</text>
    </g>
    <text x="70" y="36" fill="#111827" font-size="16" font-weight="700">30 starter seeds</text>
    <text x="70" y="58" fill="#6B7280" font-size="13">Added to your wallet</text>
  </g>

  <!-- Buttons -->
  <g transform="translate(580, 720)">
    <rect width="280" height="56" rx="28" fill="url(#ctaGrad)"/>
    <text x="140" y="36" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">See my matches →</text>
  </g>

  <g transform="translate(580, 800)">
    <text x="140" y="0" text-anchor="middle" fill="#6B7280" font-size="14">Complete profile later for 50 more bonus seeds</text>
  </g>
</svg>
