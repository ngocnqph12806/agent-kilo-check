      <text x="70" y="36" fill="#111827" font-size="14" font-weight="700">Italian Cooking</text>
      <text x="70" y="56" fill="#6B7280" font-size="12">680 mentors worldwide</text>
      <g transform="translate(70, 70)">
        <text x="0" y="0" fill="#F59E0B" font-size="11">⭐⭐⭐⭐⭐ 4.9</text>
      </g>
      <g transform="translate(220, 36)">
        <rect width="80" height="32" rx="16" fill="url(#learnGrad)"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">+ Add</text>
      </g>
    </g>
    <!-- Skill card 3 -->
    <g transform="translate(680, 0)">
      <rect width="320" height="100" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="40" font-size="32">🇬🇧</text>
      <text x="70" y="36" fill="#111827" font-size="14" font-weight="700">Business English</text>
      <text x="70" y="56" fill="#6B7280" font-size="12">2,100 mentors worldwide</text>
      <g transform="translate(70, 70)">
        <text x="0" y="0" fill="#F59E0B" font-size="11">⭐⭐⭐⭐⭐ 4.7</text>
      </g>
      <g transform="translate(220, 36)">
        <rect width="80" height="32" rx="16" fill="url(#learnGrad)"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">+ Add</text>
