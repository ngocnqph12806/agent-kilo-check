        <rect width="120" height="36" rx="18" fill="url(#learnGrad)"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🇬🇧 English</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(130, 0)">
        <rect width="120" height="36" rx="18" fill="url(#learnGrad)"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🎸 Guitar</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(260, 0)">
        <rect width="120" height="36" rx="18" fill="url(#learnGrad)"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">📊 Excel</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(390, 0)">
        <rect width="140" height="36" rx="18" fill="url(#learnGrad)"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🍝 Italian Cooking</text>
        <text x="120" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(540, 0)">
        <rect width="140" height="36" rx="18" fill="url(#learnGrad)"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🧘 Meditation</text>
        <text x="120" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
    </g>
  </g>

  <!-- Search -->
