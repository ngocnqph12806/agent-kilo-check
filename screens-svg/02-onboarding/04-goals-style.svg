<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g transform="translate(80, 40)">
    <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
    <text x="38" y="20" fill="#111827" font-size="18" font-weight="700">SkillSeed</text>
    <text x="1280" y="20" fill="#6B7280" font-size="14" text-anchor="end">Step 4 of 7</text>
    <text x="1280" y="40" fill="#10B981" font-size="13" font-weight="600" text-anchor="end">57% complete</text>
  </g>

  <g transform="translate(80, 100)">
    <rect width="1280" height="6" rx="3" fill="#E5E7EB"/>
    <rect width="730" height="6" rx="3" fill="url(#ctaGrad)"/>
  </g>

  <g transform="translate(220, 180)">
    <text x="0" y="0" fill="#111827" font-size="40" font-weight="800">Goals &amp; learning style</text>
    <text x="0" y="38" fill="#6B7280" font-size="16">Help AI match you with the perfect partners.</text>
  </g>

  <!-- Primary goal -->
  <g transform="translate(220, 260)">
    <text x="0" y="0" fill="#374151" font-size="14" font-weight="700">What's your primary goal?</text>
    <g transform="translate(0, 16)">
      <rect width="245" height="80" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="20" y="32" font-size="22">💼</text>
      <text x="60" y="30" fill="#111827" font-size="13" font-weight="700">Career growth</text>
      <text x="60" y="50" fill="#10B981" font-size="11" font-weight="600">✓ Selected</text>
    </g>
    <g transform="translate(257, 16)">
      <rect width="245" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="32" font-size="22">🌱</text>
      <text x="60" y="30" fill="#111827" font-size="13" font-weight="700">Personal hobby</text>
    </g>
    <g transform="translate(514, 16)">
      <rect width="245" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="32" font-size="22">🎓</text>
      <text x="60" y="30" fill="#111827" font-size="13" font-weight="700">Academic study</text>
    </g>
    <g transform="translate(771, 16)">
      <rect width="229" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="32" font-size="22">🌍</text>
      <text x="60" y="30" fill="#111827" font-size="13" font-weight="700">Just curious</text>
    </g>
  </g>

  <!-- Commitment -->
  <g transform="translate(220, 400)">
    <text x="0" y="0" fill="#374151" font-size="14" font-weight="700">How much time can you commit weekly?</text>
    <g transform="translate(0, 16)">
      <rect width="245" height="64" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="32" fill="#111827" font-size="14" font-weight="600">&lt; 1 hour</text>
      <text x="20" y="52" fill="#6B7280" font-size="11">Casual</text>
    </g>
    <g transform="translate(257, 16)">
      <rect width="245" height="64" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="20" y="32" fill="#111827" font-size="14" font-weight="600">1-3 hours</text>
      <text x="20" y="52" fill="#10B981" font-size="11">✓ Regular</text>
    </g>
    <g transform="translate(514, 16)">
      <rect width="245" height="64" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="32" fill="#111827" font-size="14" font-weight="600">3-5 hours</text>
      <text x="20" y="52" fill="#6B7280" font-size="11">Dedicated</text>
    </g>
    <g transform="translate(771, 16)">
      <rect width="229" height="64" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="20" y="32" fill="#111827" font-size="14" font-weight="600">5+ hours</text>
      <text x="20" y="52" fill="#6B7280" font-size="11">Intensive</text>
    </g>
  </g>

  <!-- Learning style -->
  <g transform="translate(220, 540)">
    <text x="0" y="0" fill="#374151" font-size="14" font-weight="700">Preferred learning style? (pick all that apply)</text>
    <g transform="translate(0, 16)">
      <rect width="160" height="44" rx="22" fill="#10B981"/>
      <text x="22" y="28" fill="#FFFFFF" font-size="13">📺 Visual demos</text>
      <text x="140" y="28" fill="#FFFFFF" font-size="13">✓</text>
    </g>
    <g transform="translate(170, 16)">
      <rect width="160" height="44" rx="22" fill="#10B981"/>
      <text x="22" y="28" fill="#FFFFFF" font-size="13">🎯 Hands-on practice</text>
      <text x="140" y="28" fill="#FFFFFF" font-size="13">✓</text>
    </g>
    <g transform="translate(340, 16)">
      <rect width="160" height="44" rx="22" fill="#F3F4F6"/>
      <text x="22" y="28" fill="#374151" font-size="13">📖 Reading &amp; theory</text>
    </g>
    <g transform="translate(510, 16)">
      <rect width="160" height="44" rx="22" fill="#F3F4F6"/>
      <text x="22" y="28" fill="#374151" font-size="13">🗣 Discussion-based</text>
    </g>
    <g transform="translate(680, 16)">
      <rect width="160" height="44" rx="22" fill="#10B981"/>
      <text x="22" y="28" fill="#FFFFFF" font-size="13">🛠 Project-based</text>
      <text x="140" y="28" fill="#FFFFFF" font-size="13">✓</text>
    </g>
  </g>

  <!-- Pace slider -->
  <g transform="translate(220, 660)">
    <text x="0" y="0" fill="#374151" font-size="14" font-weight="700">Preferred pace</text>
    <g transform="translate(0, 30)">
      <rect width="1000" height="8" rx="4" fill="#E5E7EB"/>
      <rect x="0" y="0" width="500" height="8" rx="4" fill="url(#ctaGrad)"/>
      <circle cx="500" cy="4" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    </g>
    <text x="0" y="60" fill="#6B7280" font-size="12">Relaxed</text>
    <text x="500" y="60" text-anchor="middle" fill="#111827" font-size="12" font-weight="600">Balanced</text>
    <text x="1000" y="60" text-anchor="end" fill="#6B7280" font-size="12">Intensive</text>
  </g>

  <g transform="translate(220, 800)">
    <rect width="160" height="48" rx="24" fill="transparent" stroke="#D1D5DB"/>
    <text x="80" y="30" text-anchor="middle" fill="#6B7280" font-size="14">← Back</text>
  </g>
  <g transform="translate(1060, 800)">
    <rect width="160" height="48" rx="24" fill="url(#ctaGrad)"/>
    <text x="80" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Continue →</text>
  </g>
</svg>
