    <!-- Legend -->
    <g transform="translate(40, 460)">
      <rect width="14" height="14" rx="3" fill="#10B981"/>
      <text x="22" y="12" fill="#6B7280" font-size="12">Available</text>
      <g transform="translate(120, 0)">
        <rect width="14" height="14" rx="3" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="22" y="12" fill="#6B7280" font-size="12">Preferred</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="14" height="14" rx="3" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="22" y="12" fill="#6B7280" font-size="12">Unavailable</text>
      </g>
    </g>
