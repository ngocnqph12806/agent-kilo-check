<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Pulse rings -->
  <g transform="translate(720, 450)">
    <circle cx="0" cy="0" r="200" fill="url(#pulseGrad)" opacity="0.3"/>
    <circle cx="0" cy="0" r="160" fill="url(#pulseGrad)" opacity="0.5"/>
    <circle cx="0" cy="0" r="120" fill="url(#pulseGrad)" opacity="0.7"/>

    <!-- Mic button -->
    <circle cx="0" cy="0" r="100" fill="url(#ctaGrad)"/>
    <circle cx="0" cy="0" r="96" fill="#FFFFFF" opacity="0.1"/>
    <text x="0" y="20" text-anchor="middle" fill="#FFFFFF" font-size="64">🎤</text>
  </g>

  <!-- Top text -->
  <g transform="translate(720, 130)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="2">VOICE ASSISTANT</text>
    <text x="0" y="60" fill="#FFFFFF" font-size="48" font-weight="800">Hi Mai, how can I help?</text>
    <text x="0" y="100" fill="#94A3B8" font-size="18">Just speak naturally — I'll handle the rest</text>
  </g>

  <!-- Suggestions -->
  <g transform="translate(220, 720)">
    <text x="0" y="0" fill="#94A3B8" font-size="11" font-weight="700">TRY SAYING</text>
  </g>

  <g transform="translate(220, 740)">
    <rect width="280" height="56" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="140" y="34" text-anchor="middle" fill="#E0E7FF" font-size="13">"Find a Python mentor"</text>
  </g>
  <g transform="translate(520, 740)">
    <rect width="280" height="56" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="140" y="34" text-anchor="middle" fill="#E0E7FF" font-size="13">"Schedule with Sarah tomorrow"</text>
  </g>
  <g transform="translate(820, 740)">
    <rect width="280" height="56" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="140" y="34" text-anchor="middle" fill="#E0E7FF" font-size="13">"Show my SBT passport"</text>
  </g>

  <!-- Status -->
  <g transform="translate(580, 820)">
    <rect width="280" height="40" rx="20" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981"/>
    <circle cx="20" cy="20" r="6" fill="#10B981"/>
    <text x="40" y="26" fill="#A7F3D0" font-size="13" font-weight="600">Listening... say "Hey Skillseed"</text>
  </g>

  <!-- Close -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-size="18" font-weight="700">🌱 SkillSeed</text>
  </g>
  <g transform="translate(1340, 60)">
    <text x="40" y="0" text-anchor="middle" fill="#94A3B8" font-size="20">×</text>
  </g>
</svg>
