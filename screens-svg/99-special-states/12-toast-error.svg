<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="toastShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <rect width="1440" height="72" fill="#FFFFFF"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
  <g transform="translate(80, 22)">
    <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
    <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
  </g>

  <!-- Toast -->
  <g transform="translate(1040, 130)">
    <rect width="380" height="100" rx="12" fill="#FFFFFF" filter="url(#toastShadow)"/>
    <rect width="6" height="100" rx="3" fill="url(#dangerGrad)"/>
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="20" fill="url(#dangerGrad)"/>
      <text x="20" y="28" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">×</text>
    </g>
    <g transform="translate(76, 16)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">⚠️ Booking failed</text>
      <text x="0" y="22" fill="#374151" font-size="12">Payment could not be processed</text>
      <text x="0" y="42" fill="#6B7280" font-size="11">Your card was declined. Try a different method.</text>
      <g transform="translate(0, 54)">
        <rect width="100" height="24" rx="12" fill="transparent" stroke="#EF4444"/>
        <text x="50" y="16" text-anchor="middle" fill="#EF4444" font-size="11" font-weight="600">Retry payment</text>
      </g>
    </g>
    <g transform="translate(348, 12)">
      <text x="0" y="14" fill="#9CA3AF" font-size="14">×</text>
    </g>
  </g>
</svg>
