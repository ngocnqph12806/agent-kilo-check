<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>
  <rect width="1440" height="72" fill="#FFFFFF"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
  <g transform="translate(80, 22)">
    <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
    <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
  </g>

  <g transform="translate(720, 130)" text-anchor="middle">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">🔔 Notifications</text>
    <text x="0" y="32" fill="#6CA3AF" font-size="14">All caught up!</text>
  </g>

  <g transform="translate(720, 380)" text-anchor="middle">
    <circle cx="0" cy="0" r="120" fill="#ECFDF5"/>
    <text x="0" y="30" text-anchor="middle" font-size="80">📭</text>
    <text x="0" y="200" fill="#111827" font-size="32" font-weight="800">No new notifications</text>
    <text x="0" y="240" fill="#6B7280" font-size="16">We'll let you know when something interesting happens.</text>

    <g transform="translate(-160, 310)">
      <rect width="160" height="48" rx="24" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">⚙️ Settings</text>
    </g>
    <g transform="translate(20, 310)">
      <rect width="180" height="48" rx="24" fill="url(#ctaGrad)"/>
      <text x="90" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">🔍 Find mentors</text>
    </g>
  </g>
</svg>
