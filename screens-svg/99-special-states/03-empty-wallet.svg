    <text x="0" y="180" fill="#111827" font-size="32" font-weight="800">Your wallet is empty</text>
    <text x="0" y="220" fill="#6B7280" font-size="16">Start your learning journey with free starter seeds!</text>

    <g transform="translate(-180, 290)">
      <rect width="180" height="48" rx="24" fill="url(#ctaGrad)"/>
      <text x="90" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">🎁 Claim 30 free</text>
    </g>
    <g transform="translate(20, 290)">
      <rect width="160" height="48" rx="24" fill="transparent" stroke="#10B981" stroke-width="2"/>
      <text x="80" y="30" text-anchor="middle" fill="#10B981" font-size="14" font-weight="600">📦 Buy seeds</text>
    </g>
  </g>

  <g transform="translate(720, 800)" text-anchor="middle">
    <text x="0" y="0" fill="#9CA3AF" font-size="12">💡 New users get 30 starter seeds · Pro users get 200/month</text>
