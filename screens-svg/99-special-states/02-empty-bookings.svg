    <text x="0" y="180" fill="#111827" font-size="32" font-weight="800">No bookings yet</text>
    <text x="0" y="220" fill="#6B7280" font-size="16">Book your first session to start learning!</text>

    <g transform="translate(-180, 290)">
      <rect width="200" height="48" rx="24" fill="url(#ctaGrad)"/>
      <text x="100" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">🔍 Find a mentor</text>
    </g>
    <g transform="translate(40, 290)">
