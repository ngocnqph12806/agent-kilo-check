      <text x="80" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">📦 Buy seeds</text>
    </g>
  </g>

  <g transform="translate(720, 800)" text-anchor="middle">
    <text x="0" y="0" fill="#9CA3AF" font-size="12">💡 Pro tip: New users get 30 free starter seeds · 142 mentors are waiting</text>
