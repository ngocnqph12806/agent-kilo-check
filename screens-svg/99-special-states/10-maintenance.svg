<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#heroGrad)"/>

  <!-- Big icon -->
  <g transform="translate(720, 320)" text-anchor="middle">
    <circle cx="0" cy="0" r="80" fill="rgba(255,255,255,0.15)"/>
    <circle cx="0" cy="0" r="64" fill="#FFFFFF"/>
    <text x="0" y="20" text-anchor="middle" font-size="56" font-weight="700">🔧</text>
  </g>

  <g transform="translate(720, 480)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-size="56" font-weight="800">We'll be right back</text>
    <text x="0" y="50" fill="#FEF3C7" font-size="20">SkillSeed is under maintenance · Brief downtime</text>
    <text x="0" y="86" fill="#FEF3C7" font-size="16">Estimated: 30 minutes · Started at 03:00 UTC</text>
  </g>

  <!-- Status badge -->
  <g transform="translate(560, 620)">
    <rect width="320" height="60" rx="30" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)"/>
    <g transform="translate(20, 18)">
      <circle cx="14" cy="14" r="14" fill="#EF4444"/>
      <circle cx="14" cy="14" r="6" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="60" y="26" fill="#FFFFFF" font-size="14" font-weight="700">Major upgrade in progress</text>
    <text x="60" y="44" fill="#FEF3C7" font-size="11">Database migration · v2.4.1</text>
  </g>

  <g transform="translate(420, 730)">
    <rect width="600" height="60" rx="30" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.3)"/>
    <g transform="translate(28, 18)">
      <circle cx="14" cy="14" r="14" fill="rgba(255,255,255,0.3)"/>
      <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14">📊</text>
    </g>
    <text x="60" y="26" fill="#FFFFFF" font-size="13" font-weight="600">Live status updates</text>
    <text x="60" y="44" fill="#FEF3C7" font-size="11">status.skillseed.app · Twitter @skillseed</text>
  </g>

  <g transform="translate(720, 850)" text-anchor="middle">
    <text x="0" y="0" fill="#FEF3C7" font-size="13">🔔 Subscribe to updates · We'll email when we're back</text>
  </g>
</svg>
