        <text x="0" y="22" fill="#6B7280" font-size="13">🍝 Italian Cooking · 12 years experience · Professional Chef</text>
        <text x="0" y="44" fill="#6B7280" font-size="12">🇮🇹 Rome, Italy · GMT+1 · Speaks English, Italian</text>
        <g transform="translate(0, 60)">
          <text x="0" y="0" fill="#F59E0B" font-size="12">⭐⭐⭐⭐⭐ 4.9 (245 reviews)</text>
          <text x="180" y="0" fill="#6B7280" font-size="12">· 1,200 sessions completed</text>
        </g>
        <g transform="translate(0, 80)">
          <rect width="80" height="20" rx="10" fill="#ECFDF5"/>
          <text x="40" y="14" text-anchor="middle" fill="#047857" font-size="10" font-weight="600">98% match</text>
        </g>
      </g>
      <g transform="translate(940, 32)">
        <rect width="160" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book session</text>
        <g transform="translate(180, 0)">
          <rect width="120" height="40" rx="20" fill="transparent" stroke="#10B981"/>
          <text x="60" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">View profile</text>
        </g>
      </g>
    </g>

    <!-- Result 2 -->
    <g transform="translate(0, 160)">
      <rect width="1280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <circle cx="50" cy="50" r="50" fill="#FEF3C7"/>
        <text x="50" y="68" text-anchor="middle" font-size="40">👩‍🍳</text>
      </g>
      <g transform="translate(140, 24)">
        <text x="0" y="0" fill="#111827" font-size="18" font-weight="700">Giulia Bianchi</text>
        <g transform="translate(140, -10)">
          <rect width="60" height="20" rx="10" fill="#10B981"/>
          <text x="30" y="14" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600">✓ Verified</text>
        </g>
        <text x="0" y="22" fill="#6B7280" font-size="13">🍝 Italian Home Cooking · Pasta, Risotto, Tiramisu</text>
        <text x="0" y="44" fill="#6B7280" font-size="12">🇮🇹 Milan, Italy · GMT+1 · Speaks English, Italian, Spanish</text>
        <g transform="translate(0, 60)">
          <text x="0" y="0" fill="#F59E0B" font-size="12">⭐⭐⭐⭐⭐ 4.8 (132 reviews)</text>
          <text x="180" y="0" fill="#6B7280" font-size="12">· 580 sessions completed</text>
        </g>
        <g transform="translate(0, 80)">
          <rect width="80" height="20" rx="10" fill="#ECFDF5"/>
          <text x="40" y="14" text-anchor="middle" fill="#047857" font-size="10" font-weight="600">94% match</text>
        </g>
      </g>
      <g transform="translate(940, 32)">
        <rect width="160" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book session</text>
        <g transform="translate(180, 0)">
          <rect width="120" height="40" rx="20" fill="transparent" stroke="#10B981"/>
          <text x="60" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">View profile</text>
        </g>
      </g>
    </g>

    <!-- Result 3 -->
    <g transform="translate(0, 320)">
      <rect width="1280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <circle cx="50" cy="50" r="50" fill="#D1FAE5"/>
        <text x="50" y="68" text-anchor="middle" font-size="40">👨‍🍳</text>
      </g>
      <g transform="translate(140, 24)">
        <text x="0" y="0" fill="#111827" font-size="18" font-weight="700">Antonio Verde</text>
        <text x="0" y="22" fill="#6B7280" font-size="13">🍕 Pizza &amp; Italian Street Food · Beginner-friendly</text>
        <text x="0" y="44" fill="#6B7280" font-size="12">🇮🇹 Naples, Italy · GMT+1 · Speaks Italian, basic English</text>
        <g transform="translate(0, 60)">
          <text x="0" y="0" fill="#F59E0B" font-size="12">⭐⭐⭐⭐ 4.6 (78 reviews)</text>
          <text x="160" y="0" fill="#6B7280" font-size="12">· 290 sessions completed</text>
        </g>
        <g transform="translate(0, 80)">
          <rect width="80" height="20" rx="10" fill="#FEF3C7"/>
          <text x="40" y="14" text-anchor="middle" fill="#92400E" font-size="10" font-weight="600">86% match</text>
        </g>
      </g>
      <g transform="translate(940, 32)">
        <rect width="160" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book session</text>
        <g transform="translate(180, 0)">
          <rect width="120" height="40" rx="20" fill="transparent" stroke="#10B981"/>
          <text x="60" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">View profile</text>
        </g>
