<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Top nav (compact) -->
  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(540, 26)" fill="#374151" font-size="15">
      <text x="0" y="0" fill="#10B981" font-weight="600">Discover</text>
      <text x="100" y="0">Bookings</text>
      <text x="200" y="0">Pods</text>
      <text x="280" y="0">Events</text>
      <text x="360" y="0">Wallet</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Filter modal -->
  <g transform="translate(240, 100)">
    <rect width="960" height="720" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g transform="translate(0, 0)">
      <rect width="960" height="64" rx="16" fill="#F9FAFB"/>
      <text x="32" y="40" fill="#111827" font-size="20" font-weight="800">🔍 Advanced Filters</text>
      <text x="920" y="40" text-anchor="end" fill="#9CA3AF" font-size="20">×</text>
    </g>

    <!-- Categories -->
    <g transform="translate(32, 90)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Category</text>
      <g transform="translate(0, 16)">
        <rect width="120" height="36" rx="18" fill="#10B981"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">💻 Tech</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(130, 16)">
        <rect width="120" height="36" rx="18" fill="#10B981"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🗣 Languages</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(260, 16)">
        <rect width="140" height="36" rx="18" fill="#F3F4F6"/>
        <text x="20" y="23" fill="#374151" font-size="13">🍳 Cooking</text>
      </g>
      <g transform="translate(410, 16)">
        <rect width="120" height="36" rx="18" fill="#F3F4F6"/>
        <text x="20" y="23" fill="#374151" font-size="13">🎨 Arts</text>
      </g>
      <g transform="translate(540, 16)">
        <rect width="120" height="36" rx="18" fill="#F3F4F6"/>
        <text x="20" y="23" fill="#374151" font-size="13">🎵 Music</text>
      </g>
      <g transform="translate(670, 16)">
        <rect width="160" height="36" rx="18" fill="transparent" stroke="#D1D5DB" stroke-dasharray="3 3"/>
        <text x="20" y="23" fill="#6B7280" font-size="13">+ More</text>
      </g>
    </g>

    <!-- Skills level -->
    <g transform="translate(32, 180)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Skill level</text>
      <g transform="translate(0, 16)">
        <rect width="155" height="64" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="20" y="30" fill="#111827" font-size="13" font-weight="600">⭐ Beginner</text>
        <text x="20" y="50" fill="#10B981" font-size="11">✓ Selected</text>
      </g>
      <g transform="translate(165, 16)">
        <rect width="155" height="64" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="20" y="30" fill="#111827" font-size="13" font-weight="600">⭐⭐ Intermediate</text>
        <text x="20" y="50" fill="#10B981" font-size="11">✓ Selected</text>
      </g>
      <g transform="translate(330, 16)">
        <rect width="155" height="64" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="30" fill="#111827" font-size="13" font-weight="600">⭐⭐⭐ Expert</text>
      </g>
    </g>

    <!-- Price/Session duration -->
    <g transform="translate(32, 300)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Session duration</text>
      <g transform="translate(0, 20)">
        <rect width="80" height="40" rx="20" fill="#10B981"/>
        <text x="40" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">30 min</text>
      </g>
      <g transform="translate(90, 0)">
        <rect width="80" height="40" rx="20" fill="#10B981"/>
        <text x="40" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">45 min</text>
      </g>
      <g transform="translate(180, 0)">
        <rect width="80" height="40" rx="20" fill="#F3F4F6"/>
        <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">60 min</text>
      </g>
      <g transform="translate(270, 0)">
        <rect width="100" height="40" rx="20" fill="#F3F4F6"/>
        <text x="50" y="26" text-anchor="middle" fill="#374151" font-size="13">90+ min</text>
      </g>
    </g>

    <!-- Time of day -->
    <g transform="translate(32, 380)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Available time of day</text>
      <g transform="translate(0, 16)">
        <rect width="220" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" fill="#111827" font-size="13" font-weight="600">🌅 Morning (6-12)</text>
        <text x="20" y="48" fill="#6B7280" font-size="11">Available today: 12 mentors</text>
        <!-- Toggle -->
        <g transform="translate(180, 18)">
          <rect width="32" height="20" rx="10" fill="#10B981"/>
          <circle cx="22" cy="10" r="8" fill="#FFFFFF"/>
        </g>
      </g>
      <g transform="translate(232, 16)">
        <rect width="220" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" fill="#111827" font-size="13" font-weight="600">☀️ Afternoon (12-18)</text>
        <text x="20" y="48" fill="#6B7280" font-size="11">Available today: 28 mentors</text>
        <g transform="translate(180, 18)">
          <rect width="32" height="20" rx="10" fill="#10B981"/>
          <circle cx="22" cy="10" r="8" fill="#FFFFFF"/>
        </g>
      </g>
      <g transform="translate(464, 16)">
        <rect width="220" height="60" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="28" fill="#111827" font-size="13" font-weight="600">🌙 Evening (18-24)</text>
        <text x="20" y="48" fill="#6B7280" font-size="11">Available today: 35 mentors</text>
        <g transform="translate(180, 18)">
          <rect width="32" height="20" rx="10" fill="#10B981"/>
          <circle cx="22" cy="10" r="8" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <!-- Languages -->
    <g transform="translate(32, 500)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Languages spoken</text>
      <g transform="translate(0, 16)">
        <rect width="120" height="36" rx="18" fill="#10B981"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🇬🇧 English</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(130, 16)">
        <rect width="120" height="36" rx="18" fill="#10B981"/>
        <text x="20" y="23" fill="#FFFFFF" font-size="13">🇻🇳 Vietnamese</text>
        <text x="100" y="23" fill="#FFFFFF" font-size="13">×</text>
      </g>
      <g transform="translate(260, 16)">
        <rect width="160" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
        <text x="20" y="23" fill="#6B7280" font-size="13">+ Add language</text>
      </g>
    </g>

    <!-- Match quality -->
    <g transform="translate(32, 580)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Minimum match score: 80%</text>
      <g transform="translate(0, 24)">
        <rect width="500" height="8" rx="4" fill="#E5E7EB"/>
        <rect x="0" y="0" width="400" height="8" rx="4" fill="url(#ctaGrad)"/>
        <circle cx="400" cy="4" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
      </g>
      <text x="0" y="50" fill="#9CA3AF" font-size="11">60% (loose) → 100% (strict)</text>
    </g>

    <!-- Footer -->
    <g transform="translate(0, 660)">
      <rect width="960" height="60" fill="#F9FAFB"/>
      <text x="32" y="38" fill="#6B7280" font-size="13">Showing 47 of 8,200 mentors</text>
      <g transform="translate(620, 12)">
        <rect width="140" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
        <text x="70" y="23" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">Clear all</text>
      </g>
      <g transform="translate(780, 12)">
        <rect width="160" height="36" rx="18" fill="url(#ctaGrad)"/>
        <text x="80" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Show 47 matches</text>
      </g>
    </g>
  </g>
</svg>
