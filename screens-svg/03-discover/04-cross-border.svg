<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(540, 26)" fill="#374151" font-size="15">
      <text x="0" y="0" fill="#10B981" font-weight="600">Discover</text>
      <text x="100" y="0">Bookings</text>
      <text x="200" y="0">Pods</text>
      <text x="280" y="0">Events</text>
      <text x="360" y="0">Wallet</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Hero -->
  <rect x="80" y="100" width="1280" height="140" rx="16" fill="url(#heroGrad)"/>
  <g transform="translate(120, 130)">
    <text x="0" y="0" font-size="48">🌍</text>
    <text x="70" y="0" fill="#111827" font-size="28" font-weight="800">Cross-border Learning</text>
    <text x="70" y="32" fill="#4B5563" font-size="14">Connect with mentors worldwide — language barriers vanish with real-time translation</text>
  </g>

  <g transform="translate(1100, 130)">
    <rect width="220" height="80" rx="12" fill="rgba(255,255,255,0.7)"/>
    <text x="20" y="28" fill="#111827" font-size="11" font-weight="600">ACTIVE GLOBALLY</text>
    <text x="20" y="56" fill="#111827" font-size="20" font-weight="800">3,247 mentors</text>
    <text x="120" y="56" fill="#6B7280" font-size="12">in 120 countries</text>
  </g>

  <!-- Map illustration -->
  <g transform="translate(80, 270)">
    <rect width="1280" height="240" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 30)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="700">Live connection map</text>
      <text x="0" y="22" fill="#6B7280" font-size="12">Showing active learning sessions right now</text>
    </g>
    <!-- Dotted world map -->
    <g transform="translate(60, 80)" fill="#E5E7EB">
      <g>
        <circle cx="40" cy="40" r="3"/><circle cx="60" cy="40" r="3"/><circle cx="80" cy="40" r="3"/>
        <circle cx="40" cy="60" r="3"/><circle cx="60" cy="60" r="3"/><circle cx="80" cy="60" r="3"/><circle cx="100" cy="60" r="3"/>
        <circle cx="60" cy="80" r="3"/><circle cx="80" cy="80" r="3"/><circle cx="100" cy="80" r="3"/><circle cx="120" cy="80" r="3"/>
      </g>
      <g transform="translate(280, 0)">
        <circle cx="40" cy="40" r="3"/><circle cx="60" cy="40" r="3"/><circle cx="80" cy="40" r="3"/><circle cx="100" cy="40" r="3"/>
        <circle cx="40" cy="60" r="3"/><circle cx="60" cy="60" r="3"/><circle cx="80" cy="60" r="3"/><circle cx="100" cy="60" r="3"/>
        <circle cx="60" cy="80" r="3"/><circle cx="80" cy="80" r="3"/><circle cx="100" cy="80" r="3"/>
      </g>
      <g transform="translate(560, 0)">
        <circle cx="40" cy="40" r="3"/><circle cx="60" cy="40" r="3"/><circle cx="80" cy="40" r="3"/>
        <circle cx="40" cy="60" r="3"/><circle cx="60" cy="60" r="3"/><circle cx="80" cy="60" r="3"/><circle cx="100" cy="60" r="3"/>
        <circle cx="60" cy="80" r="3"/><circle cx="80" cy="80" r="3"/><circle cx="100" cy="80" r="3"/>
      </g>
    </g>

    <!-- Active session pins -->
    <g transform="translate(140, 130)">
      <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
    </g>
    <g transform="translate(380, 160)">
      <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
    </g>
    <g transform="translate(700, 130)">
      <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
    </g>
    <g transform="translate(900, 150)">
      <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.3"/>
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
    </g>

    <!-- Connection line -->
    <line x1="140" y1="130" x2="700" y2="130" stroke="#10B981" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="380" y1="160" x2="900" y2="150" stroke="#10B981" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <!-- Featured cross-border matches -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" fill="#111827" font-size="20" font-weight="800">Featured international mentors</text>
  </g>

  <g transform="translate(80, 570)">
    <!-- Card 1 -->
    <g>
      <rect width="410" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="410" height="80" rx="12" fill="#FCE7F3"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#FFFFFF"/>
        <text x="24" y="38" text-anchor="middle" font-size="24">👨‍🍳</text>
      </g>
      <g transform="translate(80, 30)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Chef Marco</text>
        <text x="0" y="22" fill="#FFFFFF" font-size="11">🇮🇹 Italy · Auto-translated</text>
      </g>
      <g transform="translate(20, 100)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">Teaches: Italian Cooking</text>
        <text x="0" y="22" fill="#6B7280" font-size="11">Wants to learn: Vietnamese 🇻🇳</text>
        <text x="0" y="44" fill="#6B7280" font-size="11">Time overlap: 4 hours/day</text>
        <g transform="translate(0, 70)">
          <rect width="370" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="185" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book with translation →</text>
        </g>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(430, 0)">
      <rect width="410" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="410" height="80" rx="12" fill="#DBEAFE"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#FFFFFF"/>
        <text x="24" y="38" text-anchor="middle" font-size="24">👩‍💻</text>
      </g>
      <g transform="translate(80, 30)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Sarah Lin</text>
        <text x="0" y="22" fill="#FFFFFF" font-size="11">🇸🇬 Singapore · English native</text>
      </g>
      <g transform="translate(20, 100)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">Teaches: React.js</text>
        <text x="0" y="22" fill="#6B7280" font-size="11">Wants to learn: Vietnamese 🇻🇳</text>
        <text x="0" y="44" fill="#6B7280" font-size="11">Time overlap: 6 hours/day</text>
        <g transform="translate(0, 70)">
          <rect width="370" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="185" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book session →</text>
        </g>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(860, 0)">
      <rect width="420" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="420" height="80" rx="12" fill="#D1FAE5"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#FFFFFF"/>
        <text x="24" y="38" text-anchor="middle" font-size="24">🧘</text>
      </g>
      <g transform="translate(80, 30)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Aiko Tanaka</text>
        <text x="0" y="22" fill="#FFFFFF" font-size="11">🇯🇵 Japan · Bilingual EN/JP</text>
      </g>
      <g transform="translate(20, 100)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">Teaches: Meditation</text>
        <text x="0" y="22" fill="#6B7280" font-size="11">Wants to learn: Cooking 🍳</text>
        <text x="0" y="44" fill="#6B7280" font-size="11">Time overlap: 2 hours/day</text>
        <g transform="translate(0, 70)">
          <rect width="380" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="190" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book session →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
