<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#skyGrad)"/>

  <!-- Floor -->
  <rect y="600" width="1440" height="300" fill="#1F2937"/>
  <g stroke="#6366F1" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="700" x2="1440" y2="700"/>
    <line x1="0" y1="800" x2="1440" y2="800"/>
  </g>

  <!-- Top bar -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-size="18" font-weight="700">🥽 VR Workshop · Whiteboard</text>
  </g>

  <!-- Session info -->
  <g transform="translate(720, 100)" text-anchor="middle">
    <rect x="-200" y="-20" width="400" height="40" rx="20" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.2)"/>
    <text x="0" y="6" fill="#FFFFFF" font-size="14" font-weight="700">🛠️ Hand-drawn whiteboard · 4 collaborators</text>
  </g>

  <!-- Big whiteboard in 3D space -->
  <g transform="translate(720, 450)">
    <!-- Whiteboard background with perspective -->
    <g transform="skewX(-12)">
      <rect x="-560" y="-260" width="1120" height="520" fill="#FFFFFF" stroke="#10B981" stroke-width="4" rx="8"/>

      <!-- Title -->
      <text x="0" y="-200" text-anchor="middle" fill="#111827" font-size="32" font-weight="800">React.js Concept Map</text>
      <text x="0" y="-160" text-anchor="middle" fill="#6B7280" font-size="14">By Mai, Marco, Aiko, David · Last edit 2s ago</text>

      <!-- Central node -->
      <g transform="translate(0, -40)">
        <circle cx="0" cy="0" r="50" fill="#10B981"/>
        <text x="0" y="6" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">⚛️ React</text>
      </g>

      <!-- Spokes -->
      <g stroke="#3B82F6" stroke-width="3" fill="none">
        <line x1="50" y1="-40" x2="280" y2="-160"/>
        <line x1="50" y1="-20" x2="320" y2="-20"/>
        <line x1="50" y1="0" x2="280" y2="120"/>
        <line x1="-50" y1="-40" x2="-280" y2="-160"/>
        <line x1="-50" y1="-20" x2="-320" y2="-20"/>
        <line x1="-50" y1="0" x2="-280" y2="120"/>
      </g>

      <!-- Surrounding nodes -->
      <g transform="translate(280, -160)">
        <circle cx="0" cy="0" r="36" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="700">Components</text>
      </g>
      <g transform="translate(320, -20)">
        <circle cx="0" cy="0" r="36" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="700">JSX</text>
      </g>
      <g transform="translate(280, 120)">
        <circle cx="0" cy="0" r="36" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="700">Hooks</text>
      </g>
      <g transform="translate(-280, -160)">
        <circle cx="0" cy="0" r="36" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" fill="#92400E" font-size="11" font-weight="700">State</text>
      </g>
      <g transform="translate(-320, -20)">
        <circle cx="0" cy="0" r="36" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" fill="#92400E" font-size="11" font-weight="700">Props</text>
      </g>
      <g transform="translate(-280, 120)">
        <circle cx="0" cy="0" r="36" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="0" y="4" text-anchor="middle" fill="#92400E" font-size="11" font-weight="700">Lifecycle</text>
      </g>

      <!-- Notes -->
      <g transform="translate(0, 200)">
        <rect x="-200" y="0" width="400" height="60" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="4 4"/>
        <text x="0" y="24" text-anchor="middle" fill="#92400E" font-size="12" font-style="italic">"Hooks are the modern way!" — Marco</text>
        <text x="0" y="44" text-anchor="middle" fill="#92400E" font-size="12" font-style="italic">"Class components still matter for legacy" — Mai</text>
      </g>
    </g>
  </g>

  <!-- Floating cursors -->
  <g transform="translate(900, 380)">
    <text x="0" y="0" font-size="20">🖊️</text>
    <text x="0" y="-20" fill="#10B981" font-size="11" font-weight="700">Marco</text>
  </g>
  <g transform="translate(540, 520)">
    <text x="0" y="0" font-size="20">🖊️</text>
    <text x="0" y="-20" fill="#3B82F6" font-size="11" font-weight="700">Sarah</text>
  </g>

  <!-- Floating tool menu -->
  <g transform="translate(720, 820)" text-anchor="middle">
    <rect x="-280" y="0" width="560" height="60" rx="30" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.2)"/>

    <g transform="translate(-240, 18)">
      <circle cx="16" cy="16" r="16" fill="#10B981"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">🖊️</text>
    </g>
    <text x="-208" y="36" fill="#FFFFFF" font-size="12" font-weight="600">Pen</text>

    <g transform="translate(-130, 18)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.1)"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">⬜</text>
    </g>
    <text x="-100" y="36" fill="#FFFFFF" font-size="12">Shape</text>

    <g transform="translate(-30, 18)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.1)"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">📝</text>
    </g>
    <text x="0" y="36" fill="#FFFFFF" font-size="12">Sticky</text>

    <g transform="translate(70, 18)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.1)"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">🔗</text>
    </g>
    <text x="100" y="36" fill="#FFFFFF" font-size="12">Connect</text>

    <g transform="translate(170, 18)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.1)"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">📷</text>
    </g>
    <text x="200" y="36" fill="#FFFFFF" font-size="12">Image</text>

    <g transform="translate(260, 18)">
      <circle cx="16" cy="16" r="16" fill="#EF4444"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">🗑️</text>
    </g>
  </g>

  <!-- Top-left panel -->
  <g transform="translate(60, 180)">
    <rect width="220" height="200" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
    <g transform="translate(16, 16)">
      <text x="0" y="0" fill="#FFFFFF" font-size="13" font-weight="700">👥 Collaborators</text>

      <g transform="translate(0, 24)">
        <circle cx="14" cy="14" r="14" fill="#FEF3C7"/>
        <text x="14" y="22" text-anchor="middle" font-size="14">👩</text>
        <text x="36" y="20" fill="#A7F3D0" font-size="12" font-weight="600">Mai (You)</text>
      </g>
      <g transform="translate(0, 56)">
        <circle cx="14" cy="14" r="14" fill="#FCE7F3"/>
        <text x="14" y="22" text-anchor="middle" font-size="14">👨</text>
        <text x="36" y="20" fill="#FFFFFF" font-size="12">Chef Marco</text>
      </g>
      <g transform="translate(0, 88)">
        <circle cx="14" cy="14" r="14" fill="#DBEAFE"/>
        <text x="14" y="22" text-anchor="middle" font-size="14">👩</text>
        <text x="36" y="20" fill="#FFFFFF" font-size="12">Sarah</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="14" cy="14" r="14" fill="#FED7AA"/>
        <text x="14" y="22" text-anchor="middle" font-size="14">👩</text>
        <text x="36" y="20" fill="#FFFFFF" font-size="12">Aiko</text>
      </g>
    </g>
  </g>
</svg>
