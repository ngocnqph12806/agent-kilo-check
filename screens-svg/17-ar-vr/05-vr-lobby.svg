<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="0" y="0" height="500" fill="url(#skyGrad)"/>
  <rect y="0" width="1440" height="500" fill="url(#skyGrad)"/>
  <rect y="500" width="1440" height="400" fill="url(#floorGrad)"/>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="200" cy="120" r="1"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="500" cy="100" r="1"/>
    <circle cx="700" cy="60" r="1.5"/>
    <circle cx="900" cy="90" r="1"/>
    <circle cx="1100" cy="50" r="2"/>
    <circle cx="1300" cy="110" r="1"/>
  </g>

  <!-- Floor grid -->
  <g stroke="#6366F1" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="700" x2="1440" y2="700"/>
    <line x1="0" y1="800" x2="1440" y2="800"/>
    <line x1="200" y1="500" x2="100" y2="900"/>
    <line x1="400" y1="500" x2="300" y2="900"/>
    <line x1="600" y1="500" x2="500" y2="900"/>
    <line x1="800" y1="500" x2="900" y2="900"/>
    <line x1="1000" y1="500" x2="1100" y2="900"/>
    <line x1="1200" y1="500" x2="1300" y2="900"/>
  </g>

  <!-- Top bar -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-size="18" font-weight="700">🥽 SkillSeed VR · Lobby</text>
    <text x="0" y="22" fill="#A5B4FC" font-size="12">Meet other learners in virtual space</text>
  </g>

  <!-- User count -->
  <g transform="translate(1240, 60)">
    <rect width="140" height="40" rx="20" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981"/>
    <circle cx="20" cy="20" r="6" fill="#10B981"/>
    <text x="40" y="26" fill="#A7F3D0" font-size="13" font-weight="600">12 online</text>
  </g>

  <!-- Avatars -->
  <!-- Self avatar (center) -->
  <g transform="translate(720, 580)">
    <ellipse cx="0" cy="100" rx="50" ry="12" fill="#000000" opacity="0.3"/>
    <g transform="translate(0, 0)">
      <!-- Body -->
      <rect x="-30" y="20" width="60" height="100" rx="12" fill="url(#ctaGrad)"/>
      <!-- Head -->
      <circle cx="0" cy="-20" r="32" fill="#FEF3C7"/>
      <text x="0" y="-8" text-anchor="middle" font-size="28">👩</text>
      <!-- Hair -->
      <path d="M -28 -40 Q 0 -60 28 -40 Q 25 -50 0 -55 Q -25 -50 -28 -40" fill="#1F2937"/>
      <!-- Name tag -->
      <g transform="translate(-40, 130)">
        <rect width="80" height="22" rx="11" fill="#10B981"/>
        <text x="40" y="16" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">You (Mai)</text>
      </g>
    </g>
  </g>

  <!-- Other avatars -->
  <g transform="translate(440, 600)">
    <ellipse cx="0" cy="100" rx="40" ry="10" fill="#000000" opacity="0.3"/>
    <g>
      <rect x="-25" y="20" width="50" height="80" rx="10" fill="#3B82F6"/>
      <circle cx="0" cy="-10" r="26" fill="#FCE7F3"/>
      <text x="0" y="0" text-anchor="middle" font-size="22">👨</text>
      <g transform="translate(-30, 110)">
        <rect width="60" height="20" rx="10" fill="rgba(0,0,0,0.6)"/>
        <text x="30" y="14" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Chef Marco</text>
      </g>
    </g>
  </g>

  <g transform="translate(1020, 600)">
    <ellipse cx="0" cy="100" rx="40" ry="10" fill="#000000" opacity="0.3"/>
    <g>
      <rect x="-25" y="20" width="50" height="80" rx="10" fill="#F59E0B"/>
      <circle cx="0" cy="-10" r="26" fill="#FED7AA"/>
      <text x="0" y="0" text-anchor="middle" font-size="22">👩</text>
      <g transform="translate(-25, 110)">
        <rect width="50" height="20" rx="10" fill="rgba(0,0,0,0.6)"/>
        <text x="25" y="14" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Aiko</text>
      </g>
    </g>
  </g>

  <g transform="translate(280, 720)">
    <ellipse cx="0" cy="80" rx="32" ry="8" fill="#000000" opacity="0.3"/>
    <g>
      <rect x="-20" y="14" width="40" height="66" rx="8" fill="#8B5CF6"/>
      <circle cx="0" cy="-8" r="22" fill="#FBCFE8"/>
      <text x="0" y="0" text-anchor="middle" font-size="18">👨</text>
    </g>
  </g>

  <g transform="translate(1180, 720)">
    <ellipse cx="0" cy="80" rx="32" ry="8" fill="#000000" opacity="0.3"/>
    <g>
      <rect x="-20" y="14" width="40" height="66" rx="8" fill="#EC4899"/>
      <circle cx="0" cy="-8" r="22" fill="#D1FAE5"/>
      <text x="0" y="0" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(540, 480)">
    <rect width="160" height="60" rx="12" fill="rgba(255,255,255,0.95)" filter="url(#cardShadow)"/>
    <text x="80" y="24" text-anchor="middle" fill="#111827" font-size="11" font-weight="700">👨 Marco</text>
    <text x="80" y="44" text-anchor="middle" fill="#374151" font-size="11">"Welcome to the lobby! 🎉"</text>
  </g>

  <!-- Bottom panel -->
  <g transform="translate(440, 820)">
    <rect width="560" height="60" rx="30" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <g transform="translate(16, 16)">
      <circle cx="14" cy="14" r="14" fill="#10B981"/>
      <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14">🎤</text>
    </g>
    <text x="56" y="28" fill="#FFFFFF" font-size="13">Tap to talk · "Hey everyone" · Space to mute</text>
    <g transform="translate(460, 14)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">⚙️</text>
    </g>
  </g>

  <!-- Side panel: who's here -->
  <g transform="translate(60, 180)">
    <rect width="220" height="380" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
    <g transform="translate(16, 16)">
      <text x="0" y="0" fill="#FFFFFF" font-size="13" font-weight="700">👥 Who's here (12)</text>

      <g transform="translate(0, 24)">
        <rect width="188" height="40" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981"/>
        <circle cx="20" cy="20" r="14" fill="#FEF3C7"/>
        <text x="20" y="26" text-anchor="middle" font-size="14">👩</text>
        <text x="40" y="18" fill="#FFFFFF" font-size="12" font-weight="600">Mai (You)</text>
        <text x="40" y="32" fill="#A7F3D0" font-size="10">🟢 Speaking</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="188" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
        <circle cx="18" cy="18" r="12" fill="#FCE7F3"/>
        <text x="18" y="24" text-anchor="middle" font-size="12">👨</text>
        <text x="38" y="16" fill="#FFFFFF" font-size="12">Chef Marco</text>
        <text x="38" y="30" fill="#94A3B8" font-size="10">🎙️ Pod Leader</text>
      </g>

      <g transform="translate(0, 122)">
        <rect width="188" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
        <circle cx="18" cy="18" r="12" fill="#FED7AA"/>
        <text x="18" y="24" text-anchor="middle" font-size="12">👩</text>
        <text x="38" y="16" fill="#FFFFFF" font-size="12">Aiko Tanaka</text>
        <text x="38" y="30" fill="#94A3B8" font-size="10">🧘 Meditation</text>
      </g>

      <g transform="translate(0, 168)">
        <text x="0" y="0" fill="#94A3B8" font-size="11">+ 9 more...</text>
      </g>
    </g>
  </g>

  <!-- Right panel: navigation -->
  <g transform="translate(1160, 180)">
    <rect width="220" height="380" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
    <g transform="translate(16, 16)">
      <text x="0" y="0" fill="#FFFFFF" font-size="13" font-weight="700">🗺️ Explore</text>

      <g transform="translate(0, 20)">
        <rect width="188" height="56" rx="8" fill="rgba(255,255,255,0.1)" stroke="#10B981"/>
        <text x="14" y="20" fill="#FFFFFF" font-size="12" font-weight="700">🎓 Lecture Hall</text>
        <text x="14" y="38" fill="#10B981" font-size="10">5 happening now</text>
      </g>

      <g transform="translate(0, 88)">
        <rect width="188" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
        <text x="14" y="20" fill="#FFFFFF" font-size="12" font-weight="700">🛠️ Workshop Room</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10">12 active sessions</text>
      </g>

      <g transform="translate(0, 156)">
        <rect width="188" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
        <text x="14" y="20" fill="#FFFFFF" font-size="12" font-weight="700">🌳 Meditation Garden</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10">Quiet zone</text>
      </g>

      <g transform="translate(0, 224)">
        <rect width="188" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
        <text x="14" y="20" fill="#FFFFFF" font-size="12" font-weight="700">🍽️ Cafe</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10">Social hangout</text>
      </g>

      <g transform="translate(0, 290)">
        <rect width="188" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="94" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">🚀 Teleport</text>
      </g>
    </g>
  </g>
</svg>
