<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#1A1A2E"/>

  <!-- Simulated room -->
  <rect x="0" y="0" width="1440" height="900" fill="#2A2A3E"/>
  <g opacity="0.3">
    <rect x="200" y="400" width="1040" height="500" fill="#3A3A4E"/>
    <line x1="200" y1="400" x2="1240" y2="400" stroke="#4A4A5E" stroke-width="2"/>
  </g>

  <!-- AR screw object in center -->
  <g transform="translate(720, 540)">
    <ellipse cx="0" cy="120" rx="80" ry="20" fill="rgba(0,0,0,0.4)"/>
    <circle cx="0" cy="0" r="60" fill="#9CA3AF" stroke="#6B7280" stroke-width="2"/>
    <path d="M -20 -15 L -10 0 L -20 15 M 0 -20 L 10 -5 L 0 10 M 20 -15 L 10 0 L 20 15" stroke="#374151" stroke-width="3" fill="none"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#FCD34D" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- AR annotation: screwdriver -->
  <g transform="translate(420, 460)">
    <rect x="0" y="-20" width="20" height="60" fill="#3B82F6" transform="rotate(-30 10 10)"/>
    <line x1="40" y1="-80" x2="160" y2="-180" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(160, -220)">
      <rect width="220" height="80" rx="8" fill="rgba(16, 185, 129, 0.9)" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#FFFFFF" font-size="13" font-weight="700">🔧 Phillips #2 screwdriver</text>
      <text x="14" y="38" fill="#A7F3D0" font-size="11">Match the screw head precisely</text>
      <text x="14" y="54" fill="#A7F3D0" font-size="10">📳 Slight vibration = good grip</text>
    </g>
  </g>

  <!-- AR annotation: screw direction -->
  <g transform="translate(950, 380)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="0" y="6" text-anchor="middle" fill="#10B981" font-size="14" font-weight="700">↻</text>
    <line x1="20" y1="40" x2="-100" y2="200" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(-260, 200)">
      <rect width="200" height="60" rx="8" fill="rgba(16, 185, 129, 0.9)" filter="url(#cardShadow)"/>
      <text x="14" y="20" fill="#FFFFFF" font-size="13" font-weight="700">🔄 Clockwise = tighten</text>
      <text x="14" y="38" fill="#A7F3D0" font-size="11">Counter-clockwise = loosen</text>
    </g>
  </g>

  <!-- Top bar -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-size="14" font-weight="700">🔧 AR Repair · Fix Loose Cabinet Handle · 8 min</text>
  </g>
  <g transform="translate(720, 80)" text-anchor="middle">
    <rect x="-90" y="0" width="180" height="36" rx="18" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.2)"/>
    <text x="0" y="22" fill="#FFFFFF" font-size="13" font-weight="700">⏱️ 02:14 / 08:00</text>
  </g>
  <g transform="translate(1300, 60)">
    <rect width="120" height="36" rx="18" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B"/>
    <text x="60" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">⚠️ Caution</text>
  </g>

  <!-- Tools panel -->
  <g transform="translate(60, 200)" opacity="0.9">
    <rect width="220" height="280" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
    <g transform="translate(16, 16)">
      <text x="0" y="0" fill="#FFFFFF" font-size="13" font-weight="700">🔧 Tools needed</text>

      <g transform="translate(0, 24)">
        <rect width="188" height="40" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981"/>
        <text x="14" y="26" fill="#A7F3D0" font-size="13">✓ Phillips #2 screwdriver</text>
      </g>
      <g transform="translate(0, 74)">
        <rect width="188" height="40" rx="8" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B"/>
        <text x="14" y="26" fill="#FCD34D" font-size="13">⚠️ Wood filler (if stripped)</text>
      </g>
      <g transform="translate(0, 124)">
        <rect width="188" height="40" rx="8" fill="rgba(0,0,0,0.3)"/>
        <text x="14" y="26" fill="#9CA3AF" font-size="13">Spare screws (optional)</text>
      </g>
      <g transform="translate(0, 174)">
        <rect width="188" height="40" rx="8" fill="rgba(0,0,0,0.3)"/>
        <text x="14" y="26" fill="#9CA3AF" font-size="13">🧤 Safety gloves</text>
      </g>
    </g>
  </g>

  <!-- Right: 3D model preview -->
  <g transform="translate(1160, 200)" opacity="0.9">
    <rect width="220" height="280" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
    <g transform="translate(110, 130)">
      <circle cx="0" cy="0" r="60" fill="#6B7280" stroke="#9CA3AF" stroke-width="2"/>
      <path d="M -16 -12 L -8 0 L -16 12 M 0 -16 L 8 -4 L 0 8 M 16 -12 L 8 0 L 16 12" stroke="#374151" stroke-width="2" fill="none"/>
    </g>
    <text x="110" y="240" text-anchor="middle" fill="#FFFFFF" font-size="11">🛠 Screw model</text>
    <text x="110" y="258" text-anchor="middle" fill="#A7F3D0" font-size="10">M4 × 16mm · Phillips #2</text>
  </g>

  <!-- Bottom progress -->
  <g transform="translate(60, 800)" fill="#FFFFFF">
    <rect width="1320" height="60" rx="30" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <g transform="translate(30, 18)">
      <circle cx="16" cy="16" r="16" fill="#10B981"/>
      <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
    </g>
    <text x="80" y="22" fill="#FFFFFF" font-size="14" font-weight="700">Step 2 / 4: Tighten screw clockwise</text>
    <text x="80" y="42" fill="#A7F3D0" font-size="12">🗣 Mike: "Stop when it feels snug — don't overtighten!"</text>
    <g transform="translate(1080, 12)">
      <circle cx="32" cy="32" r="32" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">⏭️</text>
    </g>
    <g transform="translate(1160, 12)">
      <circle cx="32" cy="32" r="32" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">⏸️</text>
    </g>
    <g transform="translate(1240, 12)">
      <circle cx="32" cy="32" r="32" fill="#EF4444"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">⏹️</text>
    </g>
  </g>
</svg>
