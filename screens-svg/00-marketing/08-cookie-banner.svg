<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Background page (dimmed) -->
  <g opacity="0.4">
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(720, 380)" text-anchor="middle">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="700">Discover skills to learn</text>
    </g>
  </g>

  <!-- Cookie Banner (bottom) -->
  <g transform="translate(0, 740)">
    <rect width="1440" height="160" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#E5E7EB" stroke-width="2"/>

    <g transform="translate(80, 30)">
      <!-- Cookie icon -->
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="20">🍪</text>

      <g transform="translate(60, 0)">
        <text x="0" y="20" fill="#111827" font-size="16" font-weight="700">We value your privacy</text>
        <text x="0" y="44" fill="#6B7280" font-size="13">We use cookies to enhance your experience, analyze traffic, and improve our service.</text>
        <text x="0" y="62" fill="#6B7280" font-size="13">By clicking "Accept All", you consent to our use of cookies. Read our <tspan fill="#10B981" font-weight="600">Privacy Policy</tspan>.</text>
      </g>

      <!-- Preferences -->
      <g transform="translate(720, 0)">
        <text x="0" y="20" fill="#111827" font-size="13" font-weight="600">Your preferences:</text>

        <g transform="translate(0, 30)">
          <rect width="200" height="32" rx="6" fill="#F3F4F6"/>
          <rect x="6" y="6" width="20" height="20" rx="4" fill="#10B981"/>
          <path d="M11 16 L15 20 L21 12" stroke="#FFFFFF" stroke-width="2" fill="none"/>
          <text x="36" y="22" fill="#374151" font-size="13">Essential (always on)</text>
        </g>
        <g transform="translate(210, 30)">
          <rect width="160" height="32" rx="6" fill="#F3F4F6"/>
          <rect x="6" y="6" width="20" height="20" rx="4" fill="#10B981"/>
          <path d="M11 16 L15 20 L21 12" stroke="#FFFFFF" stroke-width="2" fill="none"/>
          <text x="36" y="22" fill="#374151" font-size="13">Analytics</text>
        </g>
        <g transform="translate(0, 70)">
          <rect width="160" height="32" rx="6" fill="#F3F4F6"/>
          <rect x="6" y="6" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
          <text x="36" y="22" fill="#374151" font-size="13">Marketing</text>
        </g>
        <g transform="translate(210, 70)">
          <rect width="160" height="32" rx="6" fill="#F3F4F6"/>
          <rect x="6" y="6" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
          <text x="36" y="22" fill="#374151" font-size="13">Personalization</text>
        </g>
      </g>

      <!-- Buttons -->
      <g transform="translate(1100, 30)">
        <rect width="140" height="40" rx="20" fill="transparent" stroke="#D1D5DB" stroke-width="1"/>
        <text x="70" y="26" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">Reject All</text>
      </g>
      <g transform="translate(1100, 80)">
        <rect width="140" height="40" rx="20" fill="transparent" stroke="#10B981" stroke-width="2"/>
        <text x="70" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">Save Preferences</text>
      </g>
      <g transform="translate(1260, 30)">
        <rect width="100" height="90" rx="20" fill="url(#ctaGrad)"/>
        <text x="50" y="42" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Accept</text>
        <text x="50" y="62" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">All</text>
      </g>
    </g>
  </g>
</svg>
