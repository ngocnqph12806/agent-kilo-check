<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(540, 26)" fill="#374151" font-size="15">
      <text x="0" y="0">Discover</text>
      <text x="100" y="0">Bookings</text>
      <text x="200" y="0">Pods</text>
      <text x="280" y="0">Events</text>
      <text x="360" y="0" fill="#10B981" font-weight="600">Wallet</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 100)" fill="#374151" font-size="14">
    <text x="0" y="0">Wallet</text>
    <text x="60" y="0">›</text>
    <text x="80" y="0" fill="#10B981" font-weight="600">Transactions</text>
  </g>

  <!-- Header -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">All Transactions</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Complete history of your seed earnings and spending</text>
  </g>

  <!-- Filters bar -->
  <g transform="translate(80, 220)">
    <rect width="1280" height="56" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 12)">
      <text x="0" y="22" fill="#9CA3AF" font-size="13">📅</text>
      <rect x="24" y="0" width="140" height="32" rx="8" fill="#F3F4F6"/>
      <text x="40" y="22" fill="#374151" font-size="12">Last 30 days</text>
    </g>

    <g transform="translate(180, 12)">
      <rect width="120" height="32" rx="8" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="12">All types</text>
    </g>
    <g transform="translate(310, 12)">
      <rect width="120" height="32" rx="8" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="12">Earned</text>
    </g>
    <g transform="translate(440, 12)">
      <rect width="120" height="32" rx="8" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="12">Spent</text>
    </g>
    <g transform="translate(570, 12)">
      <rect width="160" height="32" rx="8" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="22" text-anchor="middle" fill="#374151" font-size="12">SBT Rewards</text>
    </g>

    <g transform="translate(1100, 12)">
      <rect width="160" height="32" rx="8" fill="url(#ctaGrad)"/>
      <text x="80" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">📥 Export CSV</text>
    </g>
  </g>

  <!-- Summary cards -->
  <g transform="translate(80, 300)">
    <rect width="300" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">SEPTEMBER 2026</text>
      <text x="0" y="40" fill="#111827" font-size="22" font-weight="800">+85 / -32</text>
      <text x="0" y="62" fill="#6B7280" font-size="11">Net: +53 seeds</text>
    </g>
  </g>
  <g transform="translate(400, 300)">
    <rect width="300" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">AUGUST 2026</text>
      <text x="0" y="40" fill="#111827" font-size="22" font-weight="800">+72 / -28</text>
      <text x="0" y="62" fill="#6B7280" font-size="11">Net: +44 seeds</text>
    </g>
  </g>
  <g transform="translate(720, 300)">
    <rect width="300" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">JULY 2026</text>
      <text x="0" y="40" fill="#111827" font-size="22" font-weight="800">+45 / -15</text>
      <text x="0" y="62" fill="#6B7280" font-size="11">Net: +30 seeds</text>
    </g>
  </g>
  <g transform="translate(1040, 300)">
    <rect width="320" height="100" rx="12" fill="url(#ctaGrad)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#A7F3D0" font-size="11" font-weight="700">ALL TIME</text>
      <text x="0" y="40" fill="#FFFFFF" font-size="22" font-weight="800">+580 / -438</text>
      <text x="0" y="62" fill="#A7F3D0" font-size="11">Net: +142 seeds (current)</text>
    </g>
  </g>

  <!-- Transactions table -->
  <g transform="translate(80, 430)">
    <rect width="1280" height="400" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Table header -->
    <g transform="translate(0, 0)">
      <rect width="1280" height="40" rx="12" fill="#F9FAFB"/>
      <g transform="translate(20, 0)" fill="#9CA3AF" font-size="11" font-weight="700">
        <text x="0" y="26">DATE</text>
        <text x="160" y="26">DESCRIPTION</text>
        <text x="700" y="26">TYPE</text>
        <text x="900" y="26">AMOUNT</text>
        <text x="1080" y="26">BALANCE</text>
        <text x="1240" y="26" text-anchor="end">TX</text>
      </g>
    </g>

    <g transform="translate(20, 56)" fill="#374151" font-size="13">
      <!-- Row -->
      <g>
        <text x="0" y="20" fill="#6B7280">Sep 7, 19:45</text>
        <text x="160" y="20" fill="#111827">Session with Chef Marco</text>
        <text x="160" y="38" fill="#9CA3AF" font-size="11">Italian Pasta Masterclass</text>
        <text x="700" y="20" fill="#EF4444" font-weight="600">Spent</text>
        <text x="900" y="20" fill="#EF4444" font-weight="700">-2</text>
        <text x="1080" y="20" fill="#111827" font-weight="600">142</text>
        <text x="1240" y="20" text-anchor="end" fill="#10B981" font-size="11">→</text>
      </g>
      <g transform="translate(0, 60)">
        <text x="0" y="20" fill="#6B7280">Sep 7, 19:46</text>
        <text x="160" y="20" fill="#111827">SBT minted: Italian Pasta</text>
        <text x="160" y="38" fill="#9CA3AF" font-size="11">Block #58,392,847</text>
        <text x="700" y="20" fill="#F59E0B" font-weight="600">Reward</text>
        <text x="900" y="20" fill="#10B981" font-weight="700">+5</text>
        <text x="1080" y="20" fill="#111827" font-weight="600">144</text>
        <text x="1240" y="20" text-anchor="end" fill="#10B981" font-size="11">→</text>
      </g>
      <g transform="translate(0, 120)">
        <text x="0" y="20" fill="#6B7280">Sep 6, 14:23</text>
        <text x="160" y="20" fill="#111827">Booked: Sarah Lin - React Hooks</text>
        <text x="160" y="38" fill="#9CA3AF" font-size="11">60 min · Sep 12, 20:00</text>
        <text x="700" y="20" fill="#EF4444" font-weight="600">Spent</text>
        <text x="900" y="20" fill="#EF4444" font-weight="700">-3</text>
        <text x="1080" y="20" fill="#111827" font-weight="600">139</text>
        <text x="1240" y="20" text-anchor="end" fill="#10B981" font-size="11">→</text>
      </g>
      <g transform="translate(0, 180)">
        <text x="0" y="20" fill="#6B7280">Sep 5, 09:15</text>
        <text x="160" y="20" fill="#111827">Received from Anna K.</text>
        <text x="160" y="38" fill="#9CA3AF" font-size="11">Gift for Italian Cooking class</text>
        <text x="700" y="20" fill="#3B82F6" font-weight="600">Received</text>
        <text x="900" y="20" fill="#10B981" font-weight="700">+10</text>
        <text x="1080" y="20" fill="#111827" font-weight="600">142</text>
        <text x="1240" y="20" text-anchor="end" fill="#10B981" font-size="11">→</text>
      </g>
      <g transform="translate(0, 240)">
        <text x="0" y="20" fill="#6B7280">Sep 1, 00:00</text>
        <text x="160" y="20" fill="#111827">Monthly refill (Starter plan)</text>
        <text x="160" y="38" fill="#9CA3AF" font-size="11">Auto-credited · Rollover: 38 seeds</text>
        <text x="700" y="20" fill="#10B981" font-weight="600">Refill</text>
        <text x="900" y="20" fill="#10B981" font-weight="700">+30</text>
        <text x="1080" y="20" fill="#111827" font-weight="600">132</text>
        <text x="1240" y="20" text-anchor="end" fill="#10B981" font-size="11">→</text>
      </g>
      <g transform="translate(0, 300)">
        <text x="0" y="20" fill="#6B7280">Aug 28, 21:30</text>
        <text x="160" y="20" fill="#111827">SBT minted: Vietnamese Cooking Expert</text>
        <text x="160" y="38" fill="#9CA3AF" font-size="11">Block #57,892,134</text>
        <text x="700" y="20" fill="#F59E0B" font-weight="600">Reward</text>
        <text x="900" y="20" fill="#10B981" font-weight="700">+10</text>
        <text x="1080" y="20" fill="#111827" font-weight="600">102</text>
        <text x="1240" y="20" text-anchor="end" fill="#10B981" font-size="11">→</text>
      </g>
    </g>

    <!-- Pagination -->
    <g transform="translate(0, 360)">
      <text x="20" y="0" fill="#6B7280" font-size="12">Showing 6 of 142 transactions</text>
      <text x="1260" y="0" text-anchor="end" fill="#374151" font-size="12">← 1 2 3 ... 24 →</text>
    </g>
  </g>
</svg>
