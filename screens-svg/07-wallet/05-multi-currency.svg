<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">Multi-currency Display</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">See your seed value in your local currency — rates update every minute</text>
  </g>

  <!-- Currency selector -->
  <g transform="translate(80, 200)">
    <rect width="1280" height="60" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 14)">
      <text x="0" y="20" fill="#6B7280" font-size="13">Display currency:</text>
    </g>
    <g transform="translate(150, 14)">
      <rect width="120" height="32" rx="16" fill="#10B981"/>
      <text x="60" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">🇺🇸 USD</text>
    </g>
    <g transform="translate(280, 14)">
      <rect width="120" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">🇪🇺 EUR</text>
    </g>
    <g transform="translate(410, 14)">
      <rect width="120" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">🇬🇧 GBP</text>
    </g>
    <g transform="translate(540, 14)">
      <rect width="120" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">🇻🇳 VND</text>
    </g>
    <g transform="translate(670, 14)">
      <rect width="120" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">🇯🇵 JPY</text>
    </g>
    <g transform="translate(800, 14)">
      <rect width="120" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">🇸🇬 SGD</text>
    </g>
    <g transform="translate(1100, 14)">
      <text x="0" y="22" fill="#9CA3AF" font-size="11">Last updated: 23s ago · Refresh</text>
    </g>
  </g>

  <!-- Big conversion card -->
  <g transform="translate(80, 290)">
    <rect width="600" height="380" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">YOUR SEED VALUE</text>
      <text x="0" y="60" fill="#111827" font-size="64" font-weight="800">142</text>
      <text x="220" y="60" fill="#6B7280" font-size="20">seeds</text>

      <line x1="0" y1="80" x2="520" y2="80" stroke="#E5E7EB"/>

      <g transform="translate(0, 110)" fill="#374151" font-size="14">
        <text x="0" y="0">1 seed = $0.10 USD</text>
        <text x="520" y="0" text-anchor="end" fill="#111827" font-weight="700">$14.20 USD</text>
      </g>
      <g transform="translate(0, 138)" fill="#374151" font-size="14">
        <text x="0" y="0">Equivalent in EUR</text>
        <text x="520" y="0" text-anchor="end" fill="#111827" font-weight="700">€13.05 EUR</text>
      </g>
      <g transform="translate(0, 166)" fill="#374151" font-size="14">
        <text x="0" y="0">Equivalent in VND</text>
        <text x="520" y="0" text-anchor="end" fill="#111827" font-weight="700">355,000 ₫</text>
      </g>
      <g transform="translate(0, 194)" fill="#374151" font-size="14">
        <text x="0" y="0">Equivalent in JPY</text>
        <text x="520" y="0" text-anchor="end" fill="#111827" font-weight="700">¥2,130 JPY</text>
      </g>
      <g transform="translate(0, 222)" fill="#374151" font-size="14">
        <text x="0" y="0">Equivalent in USDC (crypto)</text>
        <text x="520" y="0" text-anchor="end" fill="#111827" font-weight="700">14.20 USDC</text>
      </g>
    </g>
  </g>

  <!-- Chart -->
  <g transform="translate(700, 290)">
    <rect width="660" height="380" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 30)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📈 Seed-to-USD · Last 30 days</text>
      <text x="0" y="20" fill="#6B7280" font-size="12">Stable at $0.10/seed · minor fluctuations</text>
    </g>
    <g transform="translate(32, 80)">
      <!-- Grid -->
      <line x1="0" y1="0" x2="596" y2="0" stroke="#F3F4F6"/>
      <line x1="0" y1="60" x2="596" y2="60" stroke="#F3F4F6"/>
      <line x1="0" y1="120" x2="596" y2="120" stroke="#F3F4F6"/>
      <line x1="0" y1="180" x2="596" y2="180" stroke="#F3F4F6"/>
      <line x1="0" y1="240" x2="596" y2="240" stroke="#E5E7EB"/>

      <!-- Y-axis labels -->
      <g transform="translate(-32, 0)" fill="#9CA3AF" font-size="10">
        <text x="0" y="4">$0.12</text>
        <text x="0" y="64">$0.11</text>
        <text x="0" y="124">$0.10</text>
        <text x="0" y="184">$0.09</text>
        <text x="0" y="244">$0.08</text>
      </g>

      <!-- Line -->
      <polyline points="0,140 50,135 100,150 150,140 200,130 250,125 300,135 350,120 400,115 450,125 500,118 550,124 596,122" stroke="#10B981" stroke-width="3" fill="none"/>

      <!-- Area fill -->
      <polygon points="0,140 50,135 100,150 150,140 200,130 250,125 300,135 350,120 400,115 450,125 500,118 550,124 596,122 596,240 0,240" fill="url(#ctaGrad)" opacity="0.2"/>

      <!-- Current marker -->
      <circle cx="596" cy="122" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- Pricing in all currencies -->
  <g transform="translate(80, 700)">
    <rect width="1280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">Pricing in your currencies</text>

      <g transform="translate(0, 24)">
        <text x="0" y="14" fill="#374151" font-size="12">Starter (50 seeds)</text>
        <text x="200" y="14" fill="#111827" font-size="13" font-weight="600">$4.99</text>
        <text x="320" y="14" fill="#111827" font-size="13" font-weight="600">€4.59</text>
        <text x="440" y="14" fill="#111827" font-size="13" font-weight="600">£3.99</text>
        <text x="560" y="14" fill="#111827" font-size="13" font-weight="600">125,000 ₫</text>
        <text x="720" y="14" fill="#111827" font-size="13" font-weight="600">¥750</text>
        <text x="840" y="14" fill="#111827" font-size="13" font-weight="600">S$6.79</text>
      </g>
      <g transform="translate(0, 56)">
        <text x="0" y="14" fill="#374151" font-size="12">Value (220 seeds)</text>
        <text x="200" y="14" fill="#111827" font-size="13" font-weight="600">$14.99</text>
        <text x="320" y="14" fill="#111827" font-size="13" font-weight="600">€13.79</text>
        <text x="440" y="14" fill="#111827" font-size="13" font-weight="600">£11.99</text>
        <text x="560" y="14" fill="#111827" font-size="13" font-weight="600">375,000 ₫</text>
        <text x="720" y="14" fill="#111827" font-size="13" font-weight="600">¥2,250</text>
        <text x="840" y="14" fill="#111827" font-size="13" font-weight="600">S$20.39</text>
      </g>
      <g transform="translate(0, 88)">
        <text x="0" y="14" fill="#374151" font-size="12">Pro (575 seeds)</text>
        <text x="200" y="14" fill="#111827" font-size="13" font-weight="600">$29.99</text>
        <text x="320" y="14" fill="#111827" font-size="13" font-weight="600">€27.59</text>
        <text x="440" y="14" fill="#111827" font-size="13" font-weight="600">£23.99</text>
        <text x="560" y="14" fill="#111827" font-size="13" font-weight="600">750,000 ₫</text>
        <text x="720" y="14" fill="#111827" font-size="13" font-weight="600">¥4,500</text>
        <text x="840" y="14" fill="#111827" font-size="13" font-weight="600">S$40.79</text>
      </g>
    </g>
  </g>
</svg>
