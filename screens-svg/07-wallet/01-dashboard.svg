<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(540, 26)" fill="#374151" font-size="15">
      <text x="0" y="0">Discover</text>
      <text x="100" y="0">Bookings</text>
      <text x="200" y="0">Pods</text>
      <text x="280" y="0">Events</text>
      <text x="360" y="0" fill="#10B981" font-weight="600">Wallet</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">Wallet</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Track your seeds and transactions</text>
  </g>

  <!-- Balance card -->
  <g transform="translate(80, 200)">
    <rect width="600" height="220" rx="16" fill="url(#heroGrad)" filter="url(#cardShadow)"/>

    <g transform="translate(40, 36)">
      <text x="0" y="0" fill="#A7F3D0" font-size="13" font-weight="700">🌱 TOTAL BALANCE</text>
      <text x="0" y="60" fill="#FFFFFF" font-size="56" font-weight="800">142</text>
      <text x="170" y="60" fill="#A7F3D0" font-size="20" font-weight="600">seeds</text>
      <text x="0" y="90" fill="#A7F3D0" font-size="13">≈ $14.20 USD · Rollover: 38 seeds</text>
    </g>

    <g transform="translate(380, 30)">
      <rect width="180" height="48" rx="24" fill="rgba(255,255,255,0.2)"/>
      <text x="90" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">+ Buy seeds</text>
    </g>
    <g transform="translate(380, 90)">
      <rect width="180" height="48" rx="24" fill="rgba(255,255,255,0.2)"/>
      <text x="90" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">↗ Send / Gift</text>
    </g>

    <!-- Monthly cycle -->
    <g transform="translate(40, 160)" fill="#A7F3D0" font-size="11">
      <text x="0" y="0">📅 Monthly cycle resets in 14 days</text>
      <text x="0" y="16">Free monthly refill: 30 seeds (Starter) · 200 (Pro)</text>
    </g>
  </g>

  <!-- Right quick stats -->
  <g transform="translate(700, 200)">
    <!-- Earned this month -->
    <rect width="320" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">EARNED THIS MONTH</text>
      <text x="0" y="40" fill="#10B981" font-size="28" font-weight="800">+85</text>
      <text x="100" y="40" fill="#6B7280" font-size="14">seeds</text>
      <text x="0" y="64" fill="#10B981" font-size="11">↑ 23% vs last month</text>
    </g>

    <!-- Spent this month -->
    <g transform="translate(340, 0)">
      <rect width="320" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">SPENT THIS MONTH</text>
        <text x="0" y="40" fill="#EF4444" font-size="28" font-weight="800">-32</text>
        <text x="100" y="40" fill="#6B7280" font-size="14">seeds</text>
        <text x="0" y="64" fill="#6B7280" font-size="11">12 sessions booked</text>
      </g>
    </g>
  </g>

  <g transform="translate(700, 320)">
    <!-- SBT rewards -->
    <rect width="320" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">SBT REWARDS</text>
      <text x="0" y="40" fill="#F59E0B" font-size="28" font-weight="800">14</text>
      <text x="100" y="40" fill="#6B7280" font-size="14">minted</text>
      <text x="0" y="64" fill="#6B7280" font-size="11">+$15.00 earned in tips</text>
    </g>

    <!-- Referrals -->
    <g transform="translate(340, 0)">
      <rect width="320" height="100" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">REFERRAL EARNINGS</text>
        <text x="0" y="40" fill="#3B82F6" font-size="28" font-weight="800">+47</text>
        <text x="100" y="40" fill="#6B7280" font-size="14">seeds</text>
        <text x="0" y="64" fill="#3B82F6" font-size="11">5 friends joined</text>
      </g>
    </g>
  </g>

  <!-- Recent transactions -->
  <g transform="translate(80, 450)">
    <rect width="1280" height="380" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 24)">
      <text x="0" y="0" fill="#111827" font-size="18" font-weight="800">Recent activity</text>
      <g transform="translate(1080, -8)">
        <rect width="160" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
        <text x="80" y="22" text-anchor="middle" fill="#374151" font-size="12">All transactions</text>
      </g>
    </g>

    <g transform="translate(32, 80)" fill="#374151" font-size="13">
      <!-- Row -->
      <g>
        <rect x="0" y="0" width="1216" height="50" rx="8" fill="#F9FAFB"/>
        <g transform="translate(20, 14)">
          <circle cx="12" cy="12" r="12" fill="#FEE2E2"/>
          <text x="12" y="16" text-anchor="middle" font-size="14">-</text>
        </g>
        <text x="60" y="20" fill="#111827" font-weight="600">Session with Chef Marco</text>
        <text x="60" y="38" fill="#9CA3AF" font-size="11">Italian Pasta Masterclass · 45 min</text>
        <text x="900" y="20" fill="#EF4444" font-weight="700">-2 seeds</text>
        <text x="900" y="38" fill="#9CA3AF" font-size="11">Sep 7, 19:45</text>
        <text x="1180" y="32" text-anchor="end" fill="#10B981" font-size="11" font-weight="600">View</text>
      </g>

      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="1216" height="50" rx="8" fill="transparent"/>
        <g transform="translate(20, 14)">
          <circle cx="12" cy="12" r="12" fill="#D1FAE5"/>
          <text x="12" y="16" text-anchor="middle" font-size="14">+</text>
        </g>
        <text x="60" y="20" fill="#111827" font-weight="600">SBT minted: Italian Pasta Beginner</text>
        <text x="60" y="38" fill="#9CA3AF" font-size="11">+5 seed reward · Block #58,392,847</text>
        <text x="900" y="20" fill="#10B981" font-weight="700">+5 seeds</text>
        <text x="900" y="38" fill="#9CA3AF" font-size="11">Sep 7, 19:46</text>
      </g>

      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="1216" height="50" rx="8" fill="#F9FAFB"/>
        <g transform="translate(20, 14)">
          <circle cx="12" cy="12" r="12" fill="#FEE2E2"/>
          <text x="12" y="16" text-anchor="middle" font-size="14">-</text>
        </g>
        <text x="60" y="20" fill="#111827" font-weight="600">Booked: Sarah Lin - React Hooks</text>
        <text x="60" y="38" fill="#9CA3AF" font-size="11">60 min · Sep 12, 20:00</text>
        <text x="900" y="20" fill="#EF4444" font-weight="700">-3 seeds</text>
        <text x="900" y="38" fill="#9CA3AF" font-size="11">Sep 6, 14:23</text>
      </g>

      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="1216" height="50" rx="8" fill="transparent"/>
        <g transform="translate(20, 14)">
          <circle cx="12" cy="12" r="12" fill="#DBEAFE"/>
          <text x="12" y="16" text-anchor="middle" font-size="14">↗</text>
        </g>
        <text x="60" y="20" fill="#111827" font-weight="600">Received from Anna K.</text>
        <text x="60" y="38" fill="#9CA3AF" font-size="11">Gift for Italian Cooking class</text>
        <text x="900" y="20" fill="#3B82F6" font-weight="700">+10 seeds</text>
        <text x="900" y="38" fill="#9CA3AF" font-size="11">Sep 5, 09:15</text>
      </g>

      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="1216" height="50" rx="8" fill="#F9FAFB"/>
        <g transform="translate(20, 14)">
          <circle cx="12" cy="12" r="12" fill="#D1FAE5"/>
          <text x="12" y="16" text-anchor="middle" font-size="14">+</text>
        </g>
        <text x="60" y="20" fill="#111827" font-weight="600">Monthly refill (Starter)</text>
        <text x="60" y="38" fill="#9CA3AF" font-size="11">Auto-credited on Sep 1</text>
        <text x="900" y="20" fill="#10B981" font-weight="700">+30 seeds</text>
        <text x="900" y="38" fill="#9CA3AF" font-size="11">Sep 1, 00:00</text>
      </g>
    </g>
  </g>
</svg>
