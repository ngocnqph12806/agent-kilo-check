<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 100)" fill="#374151" font-size="14">
    <text x="0" y="0">Wallet</text>
    <text x="60" y="0">›</text>
    <text x="80" y="0" fill="#10B981" font-weight="600">Expiring Soon</text>
  </g>

  <!-- Alert banner -->
  <g transform="translate(80, 140)">
    <rect width="1280" height="120" rx="12" fill="#FEF3C7" filter="url(#cardShadow)"/>
    <g transform="translate(40, 30)">
      <circle cx="32" cy="32" r="32" fill="#F59E0B"/>
      <text x="32" y="44" text-anchor="middle" fill="#FFFFFF" font-size="28">⏰</text>
    </g>
    <g transform="translate(120, 30)">
      <text x="0" y="0" fill="#92400E" font-size="22" font-weight="800">38 seeds expiring in 14 days</text>
      <text x="0" y="28" fill="#78350F" font-size="14">Unused seeds roll over monthly. Use them or lose them on Oct 1, 2026.</text>
      <g transform="translate(0, 50)">
        <rect width="200" height="36" rx="18" fill="url(#ctaGrad)"/>
        <text x="100" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Browse mentors →</text>
      </g>
    </g>
  </g>

  <!-- Breakdown -->
  <g transform="translate(80, 300)">
    <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">Use your seeds before they expire</text>
    <text x="0" y="28" fill="#6B7280" font-size="14">Book sessions or gift to friends — seeds don't roll over once expired</text>
  </g>

  <!-- Mentor recommendations -->
  <g transform="translate(80, 380)">
    <!-- Card 1 -->
    <g>
      <rect width="400" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="400" height="100" rx="12" fill="#FEF3C7"/>
      <g transform="translate(20, 20)">
        <circle cx="30" cy="30" r="30" fill="#FFFFFF"/>
        <text x="30" y="44" text-anchor="middle" font-size="28">👨‍🍳</text>
      </g>
      <g transform="translate(100, 28)">
        <text x="0" y="0" fill="#92400E" font-size="14" font-weight="700">Chef Marco Rossi</text>
        <text x="0" y="20" fill="#78350F" font-size="11">🍝 Italian Cooking · ⭐ 4.9</text>
      </g>
      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">Italian Pasta Masterclass</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">45 min · Available today at 19:00</text>
        <g transform="translate(0, 40)">
          <rect width="100" height="32" rx="16" fill="url(#ctaGrad)"/>
          <text x="50" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Book 2 seeds</text>
        </g>
      </g>
      <line x1="20" y1="220" x2="380" y2="220" stroke="#E5E7EB"/>
      <g transform="translate(20, 240)">
        <text x="0" y="0" fill="#F59E0B" font-size="11" font-weight="600">⏰ EXPIRES OCT 1</text>
        <text x="0" y="20" fill="#92400E" font-size="11">Use 2 of your 38 expiring seeds</text>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(420, 0)">
      <rect width="400" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="400" height="100" rx="12" fill="#DBEAFE"/>
      <g transform="translate(20, 20)">
        <circle cx="30" cy="30" r="30" fill="#FFFFFF"/>
        <text x="30" y="44" text-anchor="middle" font-size="28">👩‍💻</text>
      </g>
      <g transform="translate(100, 28)">
        <text x="0" y="0" fill="#1E40AF" font-size="14" font-weight="700">Sarah Lin</text>
        <text x="0" y="20" fill="#1E3A8A" font-size="11">💻 React.js · ⭐ 4.8</text>
      </g>
      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">React Hooks Deep Dive</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">60 min · Available Sep 12, 20:00</text>
        <g transform="translate(0, 40)">
          <rect width="100" height="32" rx="16" fill="url(#ctaGrad)"/>
          <text x="50" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Book 3 seeds</text>
        </g>
      </g>
      <line x1="20" y1="220" x2="380" y2="220" stroke="#E5E7EB"/>
      <g transform="translate(20, 240)">
        <text x="0" y="0" fill="#F59E0B" font-size="11" font-weight="600">⏰ EXPIRES OCT 1</text>
        <text x="0" y="20" fill="#92400E" font-size="11">Use 3 of your 38 expiring seeds</text>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(840, 0)">
      <rect width="400" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="400" height="100" rx="12" fill="#FCE7F3"/>
      <g transform="translate(20, 20)">
        <circle cx="30" cy="30" r="30" fill="#FFFFFF"/>
        <text x="30" y="44" text-anchor="middle" font-size="28">🧘</text>
      </g>
      <g transform="translate(100, 28)">
        <text x="0" y="0" fill="#9D174D" font-size="14" font-weight="700">Aiko Tanaka</text>
        <text x="0" y="20" fill="#831843" font-size="11">🧘 Meditation · ⭐ 5.0</text>
      </g>
      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="13" font-weight="700">Morning Meditation Routine</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">30 min · Daily slots available</text>
        <g transform="translate(0, 40)">
          <rect width="100" height="32" rx="16" fill="url(#ctaGrad)"/>
          <text x="50" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Book 1 seed</text>
        </g>
      </g>
      <line x1="20" y1="220" x2="380" y2="220" stroke="#E5E7EB"/>
      <g transform="translate(20, 240)">
        <text x="0" y="0" fill="#F59E0B" font-size="11" font-weight="600">⏰ EXPIRES OCT 1</text>
        <text x="0" y="20" fill="#92400E" font-size="11">Use 1 of your 38 expiring seeds</text>
      </g>
    </g>
  </g>

  <!-- Bottom action -->
  <g transform="translate(80, 730)">
    <rect width="1280" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 30)">
      <text x="0" y="0" font-size="36">🎁</text>
    </g>
    <g transform="translate(100, 30)">
      <text x="0" y="0" fill="#111827" font-size="18" font-weight="800">Can't use them all? Gift to a friend</text>
      <text x="0" y="26" fill="#6B7280" font-size="13">Send seeds to anyone on SkillSeed — they last 6 months after transfer</text>
    </g>
    <g transform="translate(1000, 36)">
      <rect width="240" height="48" rx="24" fill="url(#warnGrad)"/>
      <text x="120" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Gift seeds →</text>
    </g>
  </g>
</svg>
