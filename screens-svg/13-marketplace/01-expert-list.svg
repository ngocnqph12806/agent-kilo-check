<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(540, 26)" fill="#374151" font-size="15">
      <text x="0" y="0">Discover</text>
      <text x="100" y="0">Marketplace</text>
      <text x="240" y="0">Pods</text>
      <text x="320" y="0">Events</text>
      <text x="400" y="0">Wallet</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Hero -->
  <rect x="80" y="110" width="1280" height="160" rx="16" fill="url(#heroGrad)" filter="url(#cardShadow)"/>
  <g transform="translate(120, 130)">
    <text x="0" y="0" font-size="60">⭐</text>
  </g>
  <g transform="translate(220, 150)">
    <text x="0" y="0" fill="#FFFFFF" font-size="36" font-weight="800">Verified Experts Marketplace</text>
    <text x="0" y="32" fill="#FEF3C7" font-size="14">Pro-level mentors with verified credentials · Premium pricing applies</text>
  </g>
  <g transform="translate(1140, 200)">
    <rect width="180" height="48" rx="24" fill="#FFFFFF"/>
    <text x="90" y="30" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700">Become an Expert</text>
  </g>

  <!-- Filters -->
  <g transform="translate(80, 300)">
    <rect width="200" height="44" rx="22" fill="#10B981"/>
    <text x="100" y="28" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">All Experts (124)</text>
    <g transform="translate(210, 0)">
      <rect width="120" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="28" text-anchor="middle" fill="#374151" font-size="13">🎓 Top Rated</text>
    </g>
    <g transform="translate(340, 0)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="13">🆕 New This Week</text>
    </g>
    <g transform="translate(510, 0)">
      <rect width="140" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="70" y="28" text-anchor="middle" fill="#374151" font-size="13">💼 Enterprise</text>
    </g>
    <g transform="translate(1100, 0)">
      <rect width="180" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="20" y="28" fill="#374151" font-size="13">Sort: Best match</text>
      <text x="160" y="28" fill="#9CA3AF" font-size="13">▼</text>
    </g>
  </g>

  <!-- Experts grid -->
  <g transform="translate(80, 380)">
    <!-- Expert 1 -->
    <g>
      <rect width="400" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="400" height="100" rx="12" fill="#1F2937"/>
      <g transform="translate(20, 20)">
        <circle cx="32" cy="32" r="32" fill="#FEF3C7"/>
        <text x="32" y="48" text-anchor="middle" font-size="28">👨‍💼</text>
        <g transform="translate(48, 48)">
          <circle cx="14" cy="14" r="14" fill="#F59E0B" stroke="#1F2937" stroke-width="3"/>
          <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14">⭐</text>
        </g>
      </g>
      <g transform="translate(110, 28)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Dr. James Wilson</text>
        <text x="0" y="20" fill="#9CA3AF" font-size="11">Senior Engineer @ Google</text>
      </g>

      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">System Design &amp; Architecture</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">PhD CS · 15+ years FAANG</text>
        <g transform="translate(0, 36)">
          <text x="0" y="0" fill="#F59E0B" font-size="11">⭐⭐⭐⭐⭐ 4.9 (328 reviews)</text>
          <text x="180" y="0" fill="#10B981" font-size="11" font-weight="600">✓ Verified Pro</text>
        </g>
        <g transform="translate(0, 60)">
          <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">$25/seeds · 60 min session</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="360" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="180" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book expert session</text>
        </g>
      </g>
    </g>

    <!-- Expert 2 -->
    <g transform="translate(420, 0)">
      <rect width="400" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="400" height="100" rx="12" fill="#3730A3"/>
      <g transform="translate(20, 20)">
        <circle cx="32" cy="32" r="32" fill="#FCE7F3"/>
        <text x="32" y="48" text-anchor="middle" font-size="28">👩‍🎨</text>
        <g transform="translate(48, 48)">
          <circle cx="14" cy="14" r="14" fill="#F59E0B" stroke="#3730A3" stroke-width="3"/>
          <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14">⭐</text>
        </g>
      </g>
      <g transform="translate(110, 28)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Lisa Anderson</text>
        <text x="0" y="20" fill="#C7D2FE" font-size="11">Creative Director · ex-IDEO</text>
      </g>

      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">UX Design &amp; Strategy</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">10+ years · Portfolio reviews</text>
        <g transform="translate(0, 36)">
          <text x="0" y="0" fill="#F59E0B" font-size="11">⭐⭐⭐⭐⭐ 4.8 (245 reviews)</text>
          <text x="180" y="0" fill="#10B981" font-size="11" font-weight="600">✓ Verified Pro</text>
        </g>
        <g transform="translate(0, 60)">
          <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">$20/seeds · 60 min session</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="360" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="180" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book expert session</text>
        </g>
      </g>
    </g>

    <!-- Expert 3 -->
    <g transform="translate(840, 0)">
      <rect width="400" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect width="400" height="100" rx="12" fill="#065F46"/>
      <g transform="translate(20, 20)">
        <circle cx="32" cy="32" r="32" fill="#FED7AA"/>
        <text x="32" y="48" text-anchor="middle" font-size="28">🧑‍🍳</text>
        <g transform="translate(48, 48)">
          <circle cx="14" cy="14" r="14" fill="#F59E0B" stroke="#065F46" stroke-width="3"/>
          <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14">⭐</text>
        </g>
      </g>
      <g transform="translate(110, 28)">
        <text x="0" y="0" fill="#FFFFFF" font-size="16" font-weight="700">Chef Tom Keller</text>
        <text x="0" y="20" fill="#A7F3D0" font-size="11">Michelin 2-star · Author</text>
      </g>

      <g transform="translate(20, 120)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Fine French Cuisine</text>
        <text x="0" y="20" fill="#6B7280" font-size="12">3 cookbooks · TV appearances</text>
        <g transform="translate(0, 36)">
          <text x="0" y="0" fill="#F59E0B" font-size="11">⭐⭐⭐⭐⭐ 5.0 (189 reviews)</text>
          <text x="180" y="0" fill="#10B981" font-size="11" font-weight="600">✓ Verified Pro</text>
        </g>
        <g transform="translate(0, 60)">
          <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">$30/seeds · 90 min session</text>
        </g>
        <g transform="translate(0, 84)">
          <rect width="360" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="180" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Book expert session</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(80, 690)">
    <text x="0" y="0" fill="#9CA3AF" font-size="12">Showing 3 of 124 verified experts · Premium pricing on top of standard seeds</text>
    <text x="1280" y="0" text-anchor="end" fill="#374151" font-size="13">← 1 2 3 ... 42 →</text>
  </g>
</svg>
