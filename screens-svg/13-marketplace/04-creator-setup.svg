<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(720, 130)" text-anchor="middle">
    <text x="0" y="0" font-size="48">🎨</text>
    <text x="0" y="56" fill="#111827" font-size="36" font-weight="800">Creator Subscription</text>
    <text x="0" y="90" fill="#6B7280" font-size="16">Get paid monthly for exclusive content &amp; recurring sessions</text>
  </g>

  <!-- Main card -->
  <g transform="translate(220, 270)">
    <rect width="1000" height="540" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Step tabs -->
    <g transform="translate(0, 0)">
      <rect width="1000" height="60" rx="16" fill="#F9FAFB"/>
      <g transform="translate(40, 20)" fill="#10B981" font-size="13" font-weight="600">
        <g>
          <circle cx="14" cy="14" r="14" fill="#10B981"/>
          <text x="14" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11">✓</text>
        </g>
        <text x="40" y="20">Setup</text>
        <line x1="120" y1="14" x2="200" y2="14" stroke="#10B981" stroke-width="2"/>
        <g transform="translate(200, 0)">
          <circle cx="14" cy="14" r="14" fill="#10B981"/>
          <text x="14" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11">2</text>
        </g>
        <text x="240" y="20">Pricing</text>
        <line x1="320" y1="14" x2="400" y2="14" stroke="#E5E7EB" stroke-width="2"/>
        <g transform="translate(400, 0)">
          <circle cx="14" cy="14" r="14" fill="#10B981"/>
          <text x="14" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11">3</text>
        </g>
        <text x="440" y="20">Benefits</text>
        <line x1="520" y1="14" x2="600" y2="14" stroke="#E5E7EB" stroke-width="2"/>
        <g transform="translate(600, 0)">
          <circle cx="14" cy="14" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
          <text x="14" y="19" text-anchor="middle" fill="#10B981" font-size="11">4</text>
        </g>
        <text x="640" y="20" fill="#10B981">Review</text>
      </g>
    </g>

    <g transform="translate(40, 90)">
      <text x="0" y="0" fill="#111827" font-size="20" font-weight="800">💎 Choose your pricing tiers</text>
      <text x="0" y="22" fill="#6B7280" font-size="13">Offer 1-3 subscription tiers · Subscribers can switch or cancel anytime</text>

      <!-- Tier 1 -->
      <g transform="translate(0, 60)">
        <rect width="300" height="180" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <g transform="translate(20, 20)">
          <rect width="260" height="140" rx="8" fill="#F9FAFB"/>
          <g transform="translate(16, 16)">
            <text x="0" y="14" fill="#10B981" font-size="11" font-weight="700">TIER 1 · STARTER</text>
            <text x="0" y="46" fill="#111827" font-size="28" font-weight="800">$5</text>
            <text x="60" y="46" fill="#6B7280" font-size="14">/month</text>
            <g transform="translate(0, 60)" fill="#374151" font-size="11">
              <text x="0" y="0">✓ Access to forum</text>
              <text x="0" y="20">✓ Monthly group Q&amp;A</text>
              <text x="0" y="40">✓ Exclusive resources</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Tier 2 -->
      <g transform="translate(316, 60)">
        <rect width="300" height="180" rx="12" fill="url(#heroGrad)"/>
        <g transform="translate(20, 20)">
          <rect width="260" height="140" rx="8" fill="rgba(255,255,255,0.1)"/>
          <g transform="translate(16, 16)">
            <text x="0" y="14" fill="#FFFFFF" font-size="11" font-weight="700">TIER 2 · PRO ⭐</text>
            <text x="0" y="46" fill="#FFFFFF" font-size="28" font-weight="800">$15</text>
            <text x="60" y="46" fill="#E0E7FF" font-size="14">/month</text>
            <g transform="translate(0, 60)" fill="#E0E7FF" font-size="11">
              <text x="0" y="0">✓ Everything in Tier 1</text>
              <text x="0" y="20">✓ 1 monthly 1:1 session</text>
              <text x="0" y="40">✓ Early access to content</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Tier 3 -->
      <g transform="translate(632, 60)">
        <rect width="300" height="180" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 4"/>
        <g transform="translate(20, 20)">
          <rect width="260" height="140" rx="8" fill="#F9FAFB"/>
          <g transform="translate(16, 16)">
            <text x="0" y="14" fill="#6B7280" font-size="11" font-weight="700">TIER 3 · VIP (optional)</text>
            <text x="0" y="46" fill="#111827" font-size="28" font-weight="800">$50</text>
            <text x="80" y="46" fill="#6B7280" font-size="14">/month</text>
            <g transform="translate(0, 60)" fill="#6B7280" font-size="11">
              <text x="0" y="0">+ Add tier 3</text>
              <text x="0" y="20" fill="#9CA3AF">4 weekly sessions + DM</text>
              <text x="0" y="40" fill="#9CA3AF">Custom roadmap</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Settings -->
      <g transform="translate(0, 270)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">⚙️ Subscription settings</text>

        <g transform="translate(0, 20)">
          <rect width="920" height="44" rx="10" fill="#F9FAFB"/>
          <text x="20" y="28" fill="#111827" font-size="13" font-weight="600">Billing cycle</text>
          <text x="200" y="28" fill="#374151" font-size="13">Monthly only (annual coming soon)</text>
          <text x="800" y="28" fill="#10B981" font-size="13">▼</text>
        </g>

        <g transform="translate(0, 72)">
          <rect width="920" height="44" rx="10" fill="#F9FAFB"/>
          <text x="20" y="28" fill="#111827" font-size="13" font-weight="600">Free trial</text>
          <text x="200" y="28" fill="#374151" font-size="13">7 days free (recommended)</text>
          <g transform="translate(800, 14)">
            <rect width="40" height="20" rx="10" fill="#10B981"/>
            <circle cx="30" cy="10" r="8" fill="#FFFFFF"/>
          </g>
        </g>

        <g transform="translate(0, 124)">
          <rect width="920" height="44" rx="10" fill="#F9FAFB"/>
          <text x="20" y="28" fill="#111827" font-size="13" font-weight="600">Platform fee</text>
          <text x="200" y="28" fill="#374151" font-size="13">15% (covers payment processing, hosting, support)</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(220, 840)">
    <rect width="160" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
    <text x="80" y="26" text-anchor="middle" fill="#374151" font-size="13">← Back</text>
  </g>
  <g transform="translate(1060, 840)">
    <rect width="160" height="40" rx="20" fill="url(#ctaGrad)"/>
    <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Continue →</text>
  </g>
</svg>
