<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Hero -->
  <rect x="80" y="110" width="1280" height="160" rx="16" fill="url(#heroGrad)" filter="url(#cardShadow)"/>
  <g transform="translate(120, 130)">
    <text x="0" y="0" font-size="60">🎁</text>
  </g>
  <g transform="translate(220, 150)">
    <text x="0" y="0" fill="#FFFFFF" font-size="36" font-weight="800">NGO Gifting Portal</text>
    <text x="0" y="32" fill="#FCE7F3" font-size="14">Donate learning seeds to underprivileged learners worldwide · 100% impact</text>
  </g>

  <!-- Tabs -->
  <g transform="translate(80, 300)">
    <rect width="180" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="90" y="28" text-anchor="middle" fill="#374151" font-size="13">Overview</text>
    <g transform="translate(190, 0)">
      <rect width="180" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="90" y="28" text-anchor="middle" fill="#374151" font-size="13">Recipients</text>
    </g>
    <g transform="translate(380, 0)">
      <rect width="220" height="44" rx="22" fill="#EC4899"/>
      <text x="110" y="28" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">🎁 Send gift batch</text>
    </g>
    <g transform="translate(610, 0)">
      <rect width="180" height="44" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="90" y="28" text-anchor="middle" fill="#374151" font-size="13">Reports</text>
    </g>
  </g>

  <!-- Stats -->
  <g transform="translate(80, 380)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">💝 LIFETIME IMPACT</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">12,480</text>
      <text x="0" y="74" fill="#6B7280" font-size="12">seeds donated · 187 learners</text>
    </g>
  </g>

  <g transform="translate(390, 380)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">📅 THIS QUARTER</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">2,840</text>
      <text x="0" y="74" fill="#10B981" font-size="12">+34% vs last quarter</text>
    </g>
  </g>

  <g transform="translate(700, 380)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">🌍 COUNTRIES</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">42</text>
      <text x="0" y="74" fill="#6B7280" font-size="12">Across 4 continents</text>
    </g>
  </g>

  <g transform="translate(1010, 380)">
    <rect width="350" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">🏅 LEARNERS ACTIVE</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">142 / 187</text>
      <text x="0" y="74" fill="#10B981" font-size="12">76% completion rate</text>
    </g>
  </g>

  <!-- Send gift batch form -->
  <g transform="translate(80, 530)">
    <rect width="1280" height="320" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="20" font-weight="800">🎁 Send a new gift batch</text>
      <text x="0" y="22" fill="#6B7280" font-size="13">Choose recipients, select amount, and send seeds instantly</text>

      <g transform="translate(0, 60)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Recipient group</text>
        <g transform="translate(0, 16)">
          <rect width="380" height="44" rx="10" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
          <text x="20" y="28" fill="#111827" font-size="13">👥 Rural Vietnam students (47 learners)</text>
        </g>

        <g transform="translate(396, 16)">
          <rect width="380" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="28" fill="#111827" font-size="13">+ Create new group</text>
        </g>
      </g>

      <g transform="translate(0, 140)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Seeds per recipient</text>
        <g transform="translate(0, 16)">
          <rect width="120" height="44" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
          <text x="60" y="28" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">50 seeds</text>
        </g>
        <text x="140" y="40" fill="#374151" font-size="13">× 47 recipients = 2,350 seeds total</text>
        <text x="140" y="56" fill="#6B7280" font-size="11">≈ $235 USD value</text>
      </g>

      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Personal message (optional)</text>
        <rect x="0" y="14" width="776" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="36" fill="#9CA3AF" font-size="12">e.g. "Best wishes on your learning journey from [Your NGO]"</text>
      </g>

      <g transform="translate(800, 0)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Cost breakdown</text>
        <g transform="translate(0, 24)" fill="#374151" font-size="13">
          <text x="0" y="0">2,350 seeds</text>
          <text x="240" y="0" text-anchor="end" fill="#111827" font-weight="600">$235.00</text>
          <text x="0" y="22">Platform fee (waived)</text>
          <text x="240" y="22" text-anchor="end" fill="#10B981">FREE</text>
          <line x1="0" y1="38" x2="240" y2="38" stroke="#E5E7EB"/>
          <text x="0" y="60" fill="#111827" font-weight="700">Total</text>
          <text x="240" y="60" text-anchor="end" fill="#EC4899" font-size="18" font-weight="800">$235.00</text>
        </g>

        <g transform="translate(0, 100)">
          <rect width="240" height="44" rx="22" fill="url(#ctaGrad)"/>
          <text x="120" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">🎁 Send to 47 learners</text>
        </g>
      </g>
    </g>
  </g>
</svg>
