        <text x="16" y="28" fill="#F59E0B" font-size="11">⭐⭐⭐⭐⭐</text>
        <text x="16" y="48" fill="#111827" font-size="12" font-weight="700">"Best in class"</text>
        <text x="16" y="64" fill="#374151" font-size="11">System design masterclass. Now I lead architecture at my startup.</text>
