        <text x="180" y="14" fill="#9CA3AF" font-size="11" font-weight="700">SESSION</text>
        <text x="700" y="14" fill="#9CA3AF" font-size="11" font-weight="700">GROSS</text>
        <text x="900" y="14" fill="#9CA3AF" font-size="11" font-weight="700">FEE</text>
        <text x="1100" y="14" fill="#9CA3AF" font-size="11" font-weight="700">NET</text>
      </g>

      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="1216" height="40" rx="6" fill="#F9FAFB"/>
        <text x="0" y="26" fill="#6B7280">Sep 7, 14:00</text>
        <text x="180" y="26" fill="#111827">System Design · Sarah L.</text>
        <text x="700" y="26" fill="#111827">$25.00</text>
        <text x="900" y="26" fill="#EF4444">-$3.75</text>
