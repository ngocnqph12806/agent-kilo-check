        <text x="180" y="26" fill="#111827">Mock Interview · David L.</text>
        <text x="700" y="26" fill="#111827">$40.00</text>
        <text x="900" y="26" fill="#EF4444">-$6.00</text>
        <text x="1100" y="26" fill="#10B981" font-weight="700">+$34.00</text>
      </g>

      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="1216" height="40" rx="6" fill="#F9FAFB"/>
        <text x="0" y="26" fill="#6B7280">Sep 5, 19:00</text>
        <text x="180" y="26" fill="#111827">System Design · Anna K.</text>
        <text x="700" y="26" fill="#111827">$25.00</text>
        <text x="900" y="26" fill="#EF4444">-$3.75</text>
        <text x="1100" y="26" fill="#10B981" font-weight="700">+$21.25</text>
