<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">💼 Expert Payouts</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Track your earnings, upcoming payouts, and tax documents</text>
  </g>

  <!-- Earnings cards -->
  <g transform="translate(80, 200)">
    <rect width="400" height="140" rx="12" fill="url(#ctaGrad)" filter="url(#cardShadow)"/>
    <g transform="translate(28, 28)">
      <text x="0" y="0" fill="#A7F3D0" font-size="11" font-weight="700">💵 AVAILABLE BALANCE</text>
      <text x="0" y="60" fill="#FFFFFF" font-size="40" font-weight="800">$4,820</text>
      <text x="0" y="86" fill="#A7F3D0" font-size="13">≈ 4,820 seeds · USD</text>
      <g transform="translate(0, 100)">
        <rect width="160" height="36" rx="18" fill="#FFFFFF"/>
        <text x="80" y="24" text-anchor="middle" fill="#10B981" font-size="13" font-weight="700">↗ Cash out</text>
      </g>
    </g>
  </g>

  <g transform="translate(500, 200)">
    <rect width="290" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">📅 THIS MONTH</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">$1,840</text>
      <text x="0" y="76" fill="#10B981" font-size="12">↑ +24% vs last month</text>
    </g>
  </g>

  <g transform="translate(810, 200)">
    <rect width="290" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">📊 LIFETIME</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">$32,485</text>
      <text x="0" y="76" fill="#6B7280" font-size="12">From 1,847 sessions</text>
    </g>
  </g>

  <g transform="translate(1120, 200)">
    <rect width="240" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">⭐ AVG RATING</text>
      <text x="0" y="50" fill="#111827" font-size="28" font-weight="800">4.9</text>
      <text x="0" y="76" fill="#F59E0B" font-size="12">⭐⭐⭐⭐⭐ (328 reviews)</text>
    </g>
  </g>

  <!-- Sessions this month -->
  <g transform="translate(80, 360)">
    <rect width="1280" height="220" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📊 Earnings trend (last 30 days)</text>
      <text x="0" y="20" fill="#6CA3AF" font-size="12">$1,840 total · $61 avg/day</text>
    </g>

    <g transform="translate(40, 80)">
      <!-- Simple bar chart -->
      <g fill="url(#ctaGrad)">
        <rect x="0" y="80" width="22" height="40" rx="3"/>
        <rect x="32" y="50" width="22" height="70" rx="3"/>
        <rect x="64" y="40" width="22" height="80" rx="3"/>
        <rect x="96" y="60" width="22" height="60" rx="3"/>
        <rect x="128" y="20" width="22" height="100" rx="3"/>
