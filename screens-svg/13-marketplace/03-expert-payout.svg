        <rect x="192" y="10" width="22" height="110" rx="3"/>
        <rect x="224" y="0" width="22" height="120" rx="3"/>
        <rect x="256" y="40" width="22" height="80" rx="3"/>
        <rect x="288" y="20" width="22" height="100" rx="3"/>
        <rect x="320" y="50" width="22" height="70" rx="3"/>
        <rect x="352" y="30" width="22" height="90" rx="3"/>
        <rect x="384" y="10" width="22" height="110" rx="3"/>
        <rect x="416" y="40" width="22" height="80" rx="3"/>
        <rect x="448" y="60" width="22" height="60" rx="3"/>
        <rect x="480" y="20" width="22" height="100" rx="3"/>
        <rect x="512" y="50" width="22" height="70" rx="3"/>
        <rect x="544" y="30" width="22" height="90" rx="3"/>
        <rect x="576" y="60" width="22" height="60" rx="3"/>
        <rect x="608" y="40" width="22" height="80" rx="3"/>
        <rect x="640" y="20" width="22" height="100" rx="3"/>
        <rect x="672" y="50" width="22" height="70" rx="3"/>
        <rect x="704" y="30" width="22" height="90" rx="3"/>
        <rect x="736" y="10" width="22" height="110" rx="3"/>
        <rect x="768" y="40" width="22" height="80" rx="3"/>
        <rect x="800" y="20" width="22" height="100" rx="3"/>
        <rect x="832" y="0" width="22" height="120" rx="3"/>
        <rect x="864" y="30" width="22" height="90" rx="3"/>
        <rect x="896" y="20" width="22" height="100" rx="3"/>
        <rect x="928" y="10" width="22" height="110" rx="3"/>
        <rect x="960" y="40" width="22" height="80" rx="3"/>
        <rect x="992" y="50" width="22" height="70" rx="3"/>
        <rect x="1024" y="30" width="22" height="90" rx="3"/>
        <rect x="1056" y="20" width="22" height="100" rx="3"/>
        <rect x="1088" y="0" width="22" height="120" rx="3"/>
        <rect x="1120" y="10" width="22" height="110" rx="3"/>
      </g>
    </g>
  </g>

  <!-- Recent transactions -->
  <g transform="translate(80, 600)">
    <rect width="1280" height="260" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">💵 Recent transactions</text>

      <g transform="translate(0, 32)" fill="#374151" font-size="13">
