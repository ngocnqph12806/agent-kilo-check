<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="videoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#videoBg)"/>

  <g>
    <rect width="1440" height="56" fill="rgba(0,0,0,0.5)"/>
    <text x="32" y="34" fill="#FFFFFF" font-size="14" font-weight="600">🍝 Italian Pasta Masterclass · AI Notes</text>
    <g transform="translate(640, 18)">
      <rect width="160" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
      <text x="80" y="17" text-anchor="middle" fill="#FFFFFF" font-size="12">⏱️ 32:18 / 45:00</text>
    </g>
  </g>

  <!-- Video PiP -->
  <g transform="translate(32, 80)">
    <rect width="280" height="200" rx="12" fill="#000000"/>
    <text x="140" y="120" text-anchor="middle" font-size="80">👨‍🍳</text>
    <rect x="8" y="170" width="80" height="20" rx="10" fill="rgba(0,0,0,0.5)"/>
    <text x="48" y="184" text-anchor="middle" fill="#FFFFFF" font-size="10">Chef Marco</text>
  </g>

  <!-- Self video -->
  <g transform="translate(220, 220)">
    <rect width="92" height="120" rx="8" fill="#374151"/>
    <text x="46" y="68" text-anchor="middle" font-size="40">👩</text>
  </g>

  <!-- AI Notes panel -->
  <g transform="translate(332, 80)">
    <rect width="800" height="640" rx="12" fill="#FFFFFF"/>

    <!-- Header -->
    <g>
      <rect width="800" height="64" rx="12" fill="url(#aiGrad)"/>
      <g transform="translate(20, 16)">
        <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.2)"/>
        <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">✨</text>
      </g>
      <text x="64" y="36" fill="#FFFFFF" font-size="18" font-weight="800">AI Live Notes</text>
      <text x="64" y="52" fill="#E0E7FF" font-size="11">Real-time transcription · generated by SkillSeed AI</text>
      <g transform="translate(700, 20)">
        <circle cx="6" cy="6" r="6" fill="#10B981"/>
        <circle cx="6" cy="6" r="6" fill="#10B981" opacity="0.4">
          <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="11" fill="#FFFFFF" font-size="11" font-weight="600">Recording</text>
      </g>
    </g>

    <!-- Tabs -->
    <g transform="translate(20, 80)">
      <rect width="80" height="32" rx="16" fill="#6366F1"/>
      <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Summary</text>
      <g transform="translate(88, 0)">
        <rect width="80" height="32" rx="16" fill="#F3F4F6"/>
        <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="12">Key Points</text>
      </g>
      <g transform="translate(176, 0)">
        <rect width="80" height="32" rx="16" fill="#F3F4F6"/>
        <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="12">Transcript</text>
      </g>
      <g transform="translate(264, 0)">
        <rect width="80" height="32" rx="16" fill="#F3F4F6"/>
        <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="12">Actions</text>
      </g>
    </g>

    <!-- Summary content -->
    <g transform="translate(20, 130)">
      <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">📋 Live Summary</text>

      <!-- Section 1 -->
      <g transform="translate(0, 20)">
        <rect width="760" height="100" rx="10" fill="#EEF2FF"/>
        <g transform="translate(16, 16)">
          <text x="0" y="0" fill="#4338CA" font-size="13" font-weight="700">01 · Ingredients (00:00 - 05:23)</text>
          <text x="0" y="22" fill="#3730A3" font-size="12">• Tipo 00 flour preferred, all-purpose works</text>
          <text x="0" y="42" fill="#3730A3" font-size="12">• 1 egg + 1 yolk per 100g flour (egg pasta)</text>
          <text x="0" y="62" fill="#3730A3" font-size="12">• Optional: 1 tsp olive oil for elasticity</text>
        </g>
      </g>

      <!-- Section 2 -->
      <g transform="translate(0, 130)">
        <rect width="760" height="100" rx="10" fill="#EEF2FF"/>
        <g transform="translate(16, 16)">
          <text x="0" y="0" fill="#4338CA" font-size="13" font-weight="700">02 · Kneading technique (05:23 - 18:45)</text>
          <text x="0" y="22" fill="#3730A3" font-size="12">• Hand knead 8-10 minutes for proper gluten</text>
          <text x="0" y="42" fill="#3730A3" font-size="12">• Stand mixer with dough hook: 8-10 min medium</text>
          <text x="0" y="62" fill="#3730A3" font-size="12">• Dough should pull away from bowl sides</text>
        </g>
      </g>

      <!-- Section 3 (active, being generated) -->
      <g transform="translate(0, 240)">
        <rect width="760" height="120" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="2" stroke-dasharray="6 4"/>
        <g transform="translate(16, 16)">
          <text x="0" y="0" fill="#4338CA" font-size="13" font-weight="700">03 · Resting &amp; rolling (18:45 - now)</text>
          <text x="0" y="22" fill="#3730A3" font-size="12">• Rest 30 min wrapped in plastic at room temp</text>
          <text x="0" y="42" fill="#3730A3" font-size="12">• Roll to thinness where you can see your hand</text>
          <text x="560" y="22" fill="#6366F1" font-size="11" font-style="italic">✨ Generating...</text>
          <g transform="translate(560, 32)">
            <rect width="120" height="8" rx="4" fill="#E0E7FF"/>
            <rect width="80" height="8" rx="4" fill="#6366F1">
              <animate attributeName="width" values="20;120;20" dur="2s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
      </g>

      <!-- Tips -->
      <g transform="translate(0, 380)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">💡 Smart Tips from this session</text>
        <g transform="translate(0, 16)">
          <rect width="760" height="40" rx="8" fill="#FEF3C7"/>
          <text x="16" y="26" fill="#92400E" font-size="12">🥚 Egg pasta is richer; flour+water pasta is lighter</text>
        </g>
        <g transform="translate(0, 64)">
          <rect width="760" height="40" rx="8" fill="#FEF3C7"/>
          <text x="16" y="26" fill="#92400E" font-size="12">⏱️ Don't skip resting — gluten needs time to relax</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom toolbar -->
  <g transform="translate(560, 760)">
    <g>
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🎤</text>
    </g>
    <g transform="translate(80, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📹</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🖥️</text>
    </g>
    <g transform="translate(240, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📝</text>
    </g>
    <g transform="translate(320, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">💬</text>
    </g>
    <g transform="translate(400, 0)">
      <circle cx="32" cy="32" r="32" fill="#10B981"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">✨</text>
    </g>
    <g transform="translate(520, 0)">
      <rect width="120" height="64" rx="32" fill="#EF4444"/>
      <text x="60" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">End</text>
    </g>
  </g>
</svg>
