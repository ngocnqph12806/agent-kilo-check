<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="videoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#videoBg)"/>

  <!-- Top bar -->
  <g>
    <rect width="1440" height="56" fill="rgba(0,0,0,0.5)"/>
    <text x="32" y="34" fill="#FFFFFF" font-size="14" font-weight="600">🍝 Italian Pasta Masterclass · Whiteboard</text>
    <g transform="translate(640, 18)">
      <rect width="160" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
      <text x="80" y="17" text-anchor="middle" fill="#FFFFFF" font-size="12">⏱️ 25:14 / 45:00</text>
    </g>
  </g>

  <!-- Whiteboard main area -->
  <rect x="32" y="80" width="1100" height="640" rx="12" fill="#FFFFFF"/>

  <!-- Whiteboard header -->
  <g transform="translate(32, 80)">
    <rect width="1100" height="40" fill="#F9FAFB"/>
    <text x="20" y="26" fill="#374151" font-size="13" font-weight="600">📝 Collaborative Whiteboard</text>
    <text x="240" y="26" fill="#6B7280" font-size="11">| Editing: Chef Marco + You</text>
    <g transform="translate(900, 8)">
      <rect width="80" height="24" rx="12" fill="transparent" stroke="#10B981"/>
      <text x="40" y="16" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">📥 Save</text>
    </g>
    <g transform="translate(990, 8)">
      <rect width="100" height="24" rx="12" fill="transparent" stroke="#10B981"/>
      <text x="50" y="16" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">📤 Export PDF</text>
    </g>
  </g>

  <!-- Tools toolbar -->
  <g transform="translate(48, 140)">
    <rect width="60" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="30" y="26" text-anchor="middle" font-size="18">✏️</text>
    <g transform="translate(70, 0)">
      <rect width="60" height="40" rx="8" fill="#10B981"/>
      <text x="30" y="26" text-anchor="middle" font-size="18">🖊️</text>
    </g>
    <g transform="translate(140, 0)">
      <rect width="60" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="30" y="26" text-anchor="middle" font-size="18">🖍️</text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="60" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="30" y="26" text-anchor="middle" font-size="18">⬜</text>
    </g>
    <g transform="translate(280, 0)">
      <rect width="60" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="30" y="26" text-anchor="middle" font-size="18">⭕</text>
    </g>
    <g transform="translate(350, 0)">
      <rect width="60" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="30" y="26" text-anchor="middle" font-size="18">📏</text>
    </g>
    <g transform="translate(420, 0)">
      <rect width="60" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="30" y="26" text-anchor="middle" font-size="18">📝</text>
    </g>

    <!-- Color picker -->
    <g transform="translate(500, 8)">
      <circle cx="12" cy="12" r="10" fill="#000000"/>
      <circle cx="36" cy="12" r="10" fill="#EF4444"/>
      <circle cx="60" cy="12" r="10" fill="#10B981"/>
      <circle cx="84" cy="12" r="10" fill="#3B82F6"/>
      <circle cx="108" cy="12" r="10" fill="#F59E0B"/>
    </g>

    <g transform="translate(640, 0)">
      <rect width="80" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="40" y="26" text-anchor="middle" fill="#EF4444" font-size="11">↶ Undo</text>
    </g>
    <g transform="translate(730, 0)">
      <rect width="80" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="11">↷ Redo</text>
    </g>
    <g transform="translate(820, 0)">
      <rect width="80" height="40" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
      <text x="40" y="26" text-anchor="middle" fill="#EF4444" font-size="11">🗑️ Clear</text>
    </g>
  </g>

  <!-- Whiteboard content -->
  <g transform="translate(60, 220)">
    <!-- Title -->
    <text x="0" y="0" fill="#111827" font-size="22" font-weight="800">Pasta Dough Components</text>

    <!-- Dough recipe -->
    <g transform="translate(0, 30)">
      <rect width="240" height="180" rx="10" fill="#FEF3C7"/>
      <text x="20" y="28" fill="#92400E" font-size="14" font-weight="700">🥚 Egg Pasta Dough</text>
      <text x="20" y="56" fill="#78350F" font-size="13">• 100g tipo 00 flour</text>
      <text x="20" y="78" fill="#78350F" font-size="13">• 1 large egg</text>
      <text x="20" y="100" fill="#78350F" font-size="13">• 1 egg yolk</text>
      <text x="20" y="122" fill="#78350F" font-size="13">• Pinch of salt</text>
      <text x="20" y="144" fill="#78350F" font-size="13">• 1 tsp olive oil</text>
      <text x="20" y="166" fill="#92400E" font-size="11" font-style="italic">Per 100g flour</text>
    </g>

    <!-- Kneading steps -->
    <g transform="translate(280, 30)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="700">Kneading Process</text>

      <!-- Step 1 -->
      <g transform="translate(0, 20)">
        <circle cx="14" cy="14" r="14" fill="#10B981"/>
        <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">1</text>
        <text x="40" y="20" fill="#374151" font-size="13">Mix flour &amp; eggs</text>
      </g>
      <!-- Step 2 -->
      <g transform="translate(0, 50)">
        <circle cx="14" cy="14" r="14" fill="#10B981"/>
        <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
        <text x="40" y="20" fill="#374151" font-size="13">Knead 8-10 min</text>
      </g>
      <!-- Step 3 -->
      <g transform="translate(0, 80)">
        <circle cx="14" cy="14" r="14" fill="#10B981"/>
        <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">3</text>
        <text x="40" y="20" fill="#374151" font-size="13">Rest 30 min wrapped</text>
      </g>
      <!-- Step 4 -->
      <g transform="translate(0, 110)">
        <circle cx="14" cy="14" r="14" fill="#10B981"/>
        <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">4</text>
        <text x="40" y="20" fill="#374151" font-size="13">Roll thin &amp; cut</text>
      </g>
    </g>

    <!-- Doodle by Marco (hand-drawn look) -->
    <g transform="translate(620, 50)">
      <text x="0" y="0" fill="#3B82F6" font-size="14" font-weight="700" font-style="italic">Chef's tip:</text>
      <path d="M 0 12 Q 50 22 100 12 T 200 8" stroke="#EF4444" stroke-width="2" fill="none"/>
      <text x="0" y="40" fill="#EF4444" font-size="13" font-style="italic">"Feel the texture, not the time!"</text>
      <text x="200" y="50" text-anchor="end" fill="#9CA3AF" font-size="10">- Marco, 19:24</text>
    </g>

    <!-- Drawing area -->
    <g transform="translate(0, 240)">
      <rect width="640" height="200" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-dasharray="6 4"/>
      <text x="320" y="106" text-anchor="middle" fill="#9CA3AF" font-size="14">📐 Draw your dough here — share techniques visually</text>
      <!-- Cursors -->
      <text x="100" y="60" fill="#EF4444" font-size="14">👨‍🍳</text>
      <text x="500" y="140" fill="#10B981" font-size="14">👩</text>
    </g>
  </g>

  <!-- Right participants sidebar -->
  <g transform="translate(1152, 80)">
    <rect width="256" height="640" rx="12" fill="rgba(0,0,0,0.4)"/>
    <text x="20" y="32" fill="#FFFFFF" font-size="14" font-weight="700">👥 2 people</text>
    <g transform="translate(20, 56)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="16">👩</text>
      <text x="56" y="18" fill="#FFFFFF" font-size="13">Mai Tran</text>
      <text x="56" y="34" fill="#10B981" font-size="10">Drawing now...</text>
    </g>
    <g transform="translate(20, 116)">
      <circle cx="20" cy="20" r="20" fill="#DBEAFE"/>
      <text x="20" y="28" text-anchor="middle" font-size="16">👨‍🍳</text>
      <text x="56" y="18" fill="#FFFFFF" font-size="13">Chef Marco</text>
      <text x="56" y="34" fill="#10B981" font-size="10">Drawing now...</text>
    </g>
  </g>

  <!-- Bottom toolbar -->
  <g transform="translate(560, 760)">
    <g>
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🎤</text>
    </g>
    <g transform="translate(80, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📹</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🖥️</text>
    </g>
    <g transform="translate(240, 0)">
      <circle cx="32" cy="32" r="32" fill="#10B981"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📝</text>
    </g>
    <g transform="translate(320, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">💬</text>
    </g>
    <g transform="translate(400, 0)">
      <circle cx="32" cy="32" r="32" fill="#6366F1"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">✨</text>
    </g>
    <g transform="translate(520, 0)">
      <rect width="120" height="64" rx="32" fill="#EF4444"/>
      <text x="60" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">End</text>
    </g>
  </g>
</svg>
