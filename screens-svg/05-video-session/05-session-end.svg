<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)" opacity="0.95"/>

  <!-- Modal -->
  <g transform="translate(370, 140)">
    <rect width="700" height="620" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Confetti emoji -->
    <g transform="translate(312, 20)" text-anchor="middle">
      <text x="0" y="0" font-size="64">🎉</text>
    </g>

    <text x="350" y="120" text-anchor="middle" fill="#111827" font-size="32" font-weight="800">Session complete!</text>
    <text x="350" y="150" text-anchor="middle" fill="#6B7280" font-size="14">You learned from Chef Marco for 45 minutes.</text>

    <!-- Session summary -->
    <g transform="translate(40, 180)">
      <rect width="620" height="100" rx="12" fill="#ECFDF5"/>
      <g transform="translate(20, 20)">
        <circle cx="30" cy="30" r="30" fill="#DBEAFE"/>
        <text x="30" y="46" text-anchor="middle" font-size="26">👨‍🍳</text>
      </g>
      <g transform="translate(80, 32)">
        <text x="0" y="0" fill="#111827" font-size="16" font-weight="700">Italian Pasta Masterclass</text>
        <text x="0" y="22" fill="#065F46" font-size="13">with Chef Marco Rossi · 19:00 - 19:45 (45 min)</text>
        <g transform="translate(0, 38)">
          <rect width="80" height="20" rx="10" fill="#10B981"/>
          <text x="40" y="14" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600">+1 SBT earned</text>
        </g>
        <g transform="translate(90, 38)">
          <rect width="100" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
          <text x="50" y="14" text-anchor="middle" fill="#047857" font-size="10" font-weight="600">12 notes captured</text>
        </g>
      </g>
    </g>

    <!-- Quick rating -->
    <g transform="translate(40, 310)" text-anchor="middle">
      <text x="310" y="0" fill="#111827" font-size="18" font-weight="700">How was your session?</text>
      <text x="310" y="22" fill="#6B7280" font-size="13">Quick rate → unlocks AI summary + SBT mint</text>

      <!-- Stars -->
      <g transform="translate(140, 50)">
        <text x="0" y="32" font-size="40">⭐</text>
        <text x="50" y="32" font-size="40">⭐</text>
        <text x="100" y="32" font-size="40">⭐</text>
        <text x="150" y="32" font-size="40">⭐</text>
        <text x="200" y="32" font-size="40">⭐</text>
      </g>
    </g>

    <!-- Quick tags -->
    <g transform="translate(40, 440)" text-anchor="middle">
      <text x="310" y="0" fill="#374151" font-size="13" font-weight="600">What stood out? (pick 1-3)</text>
      <g transform="translate(120, 20)">
        <rect width="80" height="32" rx="16" fill="#10B981"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">✓ Helpful</text>
      </g>
      <g transform="translate(210, 20)">
        <rect width="80" height="32" rx="16" fill="#10B981"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">✓ Clear</text>
      </g>
      <g transform="translate(300, 20)">
        <rect width="80" height="32" rx="16" fill="#10B981"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">✓ Patient</text>
      </g>
      <g transform="translate(390, 20)">
        <rect width="100" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
        <text x="50" y="22" text-anchor="middle" fill="#374151" font-size="12">Knowledgeable</text>
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(40, 530)">
      <rect width="180" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
      <text x="90" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">Skip for now</text>
    </g>
    <g transform="translate(240, 530)">
      <rect width="180" height="44" rx="22" fill="transparent" stroke="#10B981" stroke-width="2"/>
      <text x="90" y="28" text-anchor="middle" fill="#10B981" font-size="14" font-weight="600">Detailed rating →</text>
    </g>
    <g transform="translate(440, 530)">
      <rect width="220" height="44" rx="22" fill="url(#ctaGrad)"/>
      <text x="110" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Submit &amp; mint SBT ✓</text>
    </g>
  </g>
</svg>
