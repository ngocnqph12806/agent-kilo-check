<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="videoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#videoBg)"/>

  <!-- Top bar -->
  <g>
    <rect width="1440" height="56" fill="rgba(0,0,0,0.5)"/>
    <text x="32" y="34" fill="#FFFFFF" font-size="14" font-weight="600">🍝 Italian Pasta Masterclass</text>
    <text x="280" y="34" fill="#9CA3AF" font-size="13">with Chef Marco Rossi</text>

    <!-- Timer -->
    <g transform="translate(640, 18)">
      <rect width="160" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
      <text x="80" y="17" text-anchor="middle" fill="#FFFFFF" font-size="12">⏱️ 12:34 / 45:00</text>
    </g>

    <!-- Network -->
    <g transform="translate(1100, 18)">
      <text x="0" y="20" fill="#10B981" font-size="13">●●●</text>
      <text x="40" y="20" fill="#FFFFFF" font-size="13">HD · Stable</text>
    </g>

    <!-- Recording -->
    <g transform="translate(1240, 18)">
      <circle cx="8" cy="14" r="6" fill="#EF4444"/>
      <text x="22" y="18" fill="#FFFFFF" font-size="13">REC 12:34</text>
    </g>
    <g transform="translate(1380, 16)">
      <text x="20" y="22" text-anchor="middle" fill="#FFFFFF" font-size="18">⊗</text>
    </g>
  </g>

  <!-- Main video area -->
  <rect x="32" y="80" width="1080" height="640" rx="12" fill="#000000"/>
  <text x="572" y="400" text-anchor="middle" font-size="180">👨‍🍳</text>
  <text x="572" y="460" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">Chef Marco Rossi</text>
  <text x="572" y="484" text-anchor="middle" fill="#9CA3AF" font-size="13">🎤 Speaking</text>

  <!-- Self video (PiP) -->
  <g transform="translate(960, 100)">
    <rect width="140" height="180" rx="10" fill="#374151"/>
    <text x="70" y="100" text-anchor="middle" font-size="64">👩</text>
    <rect x="8" y="148" width="60" height="20" rx="10" fill="rgba(0,0,0,0.5)"/>
    <text x="38" y="162" text-anchor="middle" fill="#FFFFFF" font-size="10">You</text>
    <rect x="100" y="148" width="32" height="20" rx="10" fill="#10B981"/>
    <text x="116" y="162" text-anchor="middle" fill="#FFFFFF" font-size="10">🎤</text>
  </g>

  <!-- Connection quality bar -->
  <g transform="translate(48, 740)">
    <text x="0" y="0" fill="#9CA3AF" font-size="11">Chef Marco's video</text>
    <rect x="0" y="10" width="120" height="6" rx="3" fill="#374151"/>
    <rect x="0" y="10" width="110" height="6" rx="3" fill="#10B981"/>
  </g>

  <!-- Bottom toolbar -->
  <g transform="translate(560, 760)">
    <!-- Mic -->
    <g>
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🎤</text>
    </g>
    <!-- Camera -->
    <g transform="translate(80, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📹</text>
    </g>
    <!-- Share screen -->
    <g transform="translate(160, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🖥️</text>
    </g>
    <!-- Whiteboard -->
    <g transform="translate(240, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📝</text>
    </g>
    <!-- Chat -->
    <g transform="translate(320, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">💬</text>
      <circle cx="50" cy="14" r="10" fill="#EF4444"/>
      <text x="50" y="18" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">3</text>
    </g>
    <!-- AI Notes -->
    <g transform="translate(400, 0)">
      <circle cx="32" cy="32" r="32" fill="#6366F1"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">✨</text>
    </g>

    <!-- End call -->
    <g transform="translate(520, 0)">
      <rect width="120" height="64" rx="32" fill="#EF4444"/>
      <text x="60" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">End</text>
    </g>
  </g>

  <!-- Right sidebar (collapsed - participants) -->
  <g transform="translate(1132, 80)">
    <rect width="276" height="640" rx="12" fill="rgba(0,0,0,0.4)"/>
    <text x="20" y="32" fill="#FFFFFF" font-size="14" font-weight="700">Participants (2)</text>
    <g transform="translate(20, 56)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="16">👩</text>
      <text x="56" y="20" fill="#FFFFFF" font-size="13">You (Mai Tran)</text>
      <text x="56" y="36" fill="#10B981" font-size="11">🎤 ✓</text>
    </g>
    <g transform="translate(20, 116)">
      <circle cx="20" cy="20" r="20" fill="#DBEAFE"/>
      <text x="20" y="28" text-anchor="middle" font-size="16">👨‍🍳</text>
      <text x="56" y="20" fill="#FFFFFF" font-size="13">Chef Marco</text>
      <text x="56" y="36" fill="#10B981" font-size="11">🎤 ✓ host</text>
    </g>

    <line x1="20" y1="180" x2="256" y2="180" stroke="#374151"/>

    <text x="20" y="210" fill="#FFFFFF" font-size="14" font-weight="700">Session info</text>
    <g transform="translate(20, 230)" fill="#D1D5DB" font-size="12">
      <text x="0" y="0">Started: 19:00</text>
      <text x="0" y="22">Duration: 45 min</text>
      <text x="0" y="44">Skill: Italian Pasta</text>
      <text x="0" y="66">SBT reward: +1 to Passport</text>
    </g>
  </g>

  <!-- Tip toast -->
  <g transform="translate(1132, 740)">
    <rect width="276" height="56" rx="10" fill="rgba(99, 102, 241, 0.95)"/>
    <text x="20" y="24" fill="#FFFFFF" font-size="12" font-weight="700">✨ AI Tip</text>
    <text x="20" y="44" fill="#E0E7FF" font-size="11">Try asking about gluten-free options</text>
  </g>
</svg>
