<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <rect width="1440" height="72" fill="url(#adminGrad)"/>
  <g transform="translate(80, 22)">
    <text x="0" y="20" fill="#FFFFFF" font-size="20" font-weight="700">🌱 SkillSeed Admin</text>
  </g>
  <g transform="translate(1280, 18)">
    <circle cx="20" cy="20" r="20" fill="#FEE2E2"/>
    <text x="20" y="28" text-anchor="middle" fill="#991B1B" font-size="14">🛡️</text>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">📊 System Health</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Live infrastructure metrics and uptime</text>
  </g>

  <!-- Overall status -->
  <g transform="translate(80, 200)">
    <rect width="1280" height="120" rx="12" fill="url(#ctaGrad)" filter="url(#cardShadow)"/>
    <g transform="translate(28, 24)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF"/>
      <path d="M14 20 L18 24 L26 16" stroke="#10B981" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(80, 24)">
      <text x="0" y="0" fill="#A7F3D0" font-size="11" font-weight="700">ALL SYSTEMS</text>
      <text x="0" y="32" fill="#FFFFFF" font-size="24" font-weight="800">Operational</text>
      <text x="0" y="58" fill="#A7F3D0" font-size="13">99.98% uptime · Last 90 days · Auto-recovering</text>
    </g>

    <g transform="translate(800, 24)">
      <text x="0" y="0" fill="#A7F3D0" font-size="11" font-weight="700">REGIONS</text>
      <g transform="translate(0, 12)">
        <circle cx="8" cy="8" r="6" fill="#10B981"/>
        <text x="20" y="14" fill="#FFFFFF" font-size="13">us-east-1 · Healthy</text>
      </g>
      <g transform="translate(0, 36)">
        <circle cx="8" cy="8" r="6" fill="#10B981"/>
        <text x="20" y="38" fill="#FFFFFF" font-size="13">eu-west-1 · Healthy</text>
      </g>
      <g transform="translate(0, 60)">
        <circle cx="8" cy="8" r="6" fill="#F59E0B"/>
        <text x="20" y="62" fill="#FFFFFF" font-size="13">ap-southeast-1 · Elevated</text>
      </g>
    </g>

    <g transform="translate(1100, 24)">
      <text x="0" y="0" fill="#A7F3D0" font-size="11" font-weight="700">RESPONSE TIME</text>
      <text x="0" y="36" fill="#FFFFFF" font-size="32" font-weight="800">142ms</text>
      <text x="0" y="62" fill="#A7F3D0" font-size="13">p95 across all APIs</text>
    </g>
  </g>

  <!-- Service status grid -->
  <g transform="translate(80, 350)">
    <rect width="1280" height="200" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">🔧 Service status</text>

      <g transform="translate(0, 36)">
        <rect width="295" height="120" rx="10" fill="#ECFDF5"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" fill="#047857" font-size="14" font-weight="700">✅ API Gateway</text>
          <text x="0" y="36" fill="#065F46" font-size="11">99.99% uptime</text>
          <text x="0" y="56" fill="#065F46" font-size="11">p95: 142ms · 8K req/s</text>
          <text x="0" y="80" fill="#10B981" font-size="11" font-weight="600">All regions healthy</text>
        </g>
      </g>

      <g transform="translate(311, 36)">
        <rect width="295" height="120" rx="10" fill="#ECFDF5"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" fill="#047857" font-size="14" font-weight="700">✅ PostgreSQL Primary</text>
          <text x="0" y="36" fill="#065F46" font-size="11">99.99% uptime</text>
          <text x="0" y="56" fill="#065F46" font-size="11">Replication lag: 12ms</text>
          <text x="0" y="80" fill="#10B981" font-size="11" font-weight="600">Healthy</text>
        </g>
      </g>

      <g transform="translate(622, 36)">
        <rect width="295" height="120" rx="10" fill="#ECFDF5"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" fill="#047857" font-size="14" font-weight="700">✅ Redis Cache</text>
          <text x="0" y="36" fill="#065F46" font-size="11">Hit rate: 96.4%</text>
          <text x="0" y="56" fill="#065F46" font-size="11">p95: 1.2ms</text>
          <text x="0" y="80" fill="#10B981" font-size="11" font-weight="600">Healthy</text>
        </g>
      </g>

      <g transform="translate(933, 36)">
        <rect width="295" height="120" rx="10" fill="#FEF3C7"/>
        <g transform="translate(16, 16)">
          <text x="0" y="14" fill="#92400E" font-size="14" font-weight="700">⚠️ Video Relay</text>
          <text x="0" y="36" fill="#78350F" font-size="11">99.87% uptime</text>
          <text x="0" y="56" fill="#78350F" font-size="11">us-east p95: 480ms</text>
          <text x="0" y="80" fill="#F59E0B" font-size="11" font-weight="600">Investigating</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Charts -->
  <g transform="translate(80, 580)">
    <rect width="630" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📈 API request volume (24h)</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">847K requests today · +12% vs yesterday</text>

      <g transform="translate(0, 60)">
        <line x1="0" y1="0" x2="582" y2="0" stroke="#F3F4F6"/>
        <line x1="0" y1="50" x2="582" y2="50" stroke="#F3F4F6"/>
        <line x1="0" y1="100" x2="582" y2="100" stroke="#F3F4F6"/>
        <line x1="0" y1="150" x2="582" y2="150" stroke="#E5E7EB"/>

        <g fill="url(#ctaGrad)" opacity="0.3">
          <polygon points="0,140 24,130 48,120 72,100 96,90 120,80 144,60 168,40 192,30 216,20 240,40 264,50 288,30 312,40 336,60 360,50 384,40 408,30 432,20 456,10 480,20 504,40 528,30 552,40 582,50 582,150 0,150"/>
        </g>
        <polyline points="0,140 24,130 48,120 72,100 96,90 120,80 144,60 168,40 192,30 216,20 240,40 264,50 288,30 312,40 336,60 360,50 384,40 408,30 432,20 456,10 480,20 504,40 528,30 552,40 582,50" stroke="url(#ctaGrad)" stroke-width="2" fill="none"/>
      </g>

      <g transform="translate(0, 220)" fill="#9CA3AF" font-size="10">
        <text x="0" y="0">00:00</text>
        <text x="100" y="0">04:00</text>
        <text x="200" y="0">08:00</text>
        <text x="300" y="0">12:00</text>
        <text x="400" y="0">16:00</text>
        <text x="500" y="0">20:00</text>
        <text x="580" y="0" text-anchor="end">24:00</text>
      </g>
    </g>
  </g>

  <g transform="translate(730, 580)">
    <rect width="630" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">⚡ Response time p95 (24h)</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">Target: &lt; 200ms · Current: 142ms ✓</text>

      <g transform="translate(0, 60)">
        <line x1="0" y1="0" x2="582" y2="0" stroke="#F3F4F6"/>
        <line x1="0" y1="50" x2="582" y2="50" stroke="#F3F4F6"/>
        <line x1="0" y1="100" x2="582" y2="100" stroke="#E5E7EB"/>
        <line x1="0" y1="60" x2="582" y2="60" stroke="#EF4444" stroke-dasharray="4 4"/>

        <polyline points="0,120 24,110 48,100 72,90 96,80 120,75 144,70 168,75 192,68 216,72 240,80 264,85 288,78 312,82 336,90 360,95 384,100 408,105 432,98 456,92 480,88 504,82 528,76 552,72 582,68" stroke="#F59E0B" stroke-width="2" fill="none"/>
      </g>

      <g transform="translate(0, 220)" fill="#9CA3AF" font-size="10">
        <text x="0" y="0">00:00</text>
        <text x="100" y="0">04:00</text>
        <text x="200" y="0">08:00</text>
        <text x="300" y="0">12:00</text>
        <text x="400" y="0">16:00</text>
        <text x="500" y="0">20:00</text>
        <text x="580" y="0" text-anchor="end">24:00</text>
      </g>
    </g>
  </g>
</svg>
