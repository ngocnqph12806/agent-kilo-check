<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Top nav (admin) -->
  <rect width="1440" height="72" fill="url(#adminGrad)"/>
  <g transform="translate(80, 22)">
    <text x="0" y="20" fill="#FFFFFF" font-size="20" font-weight="700">🌱 SkillSeed Admin</text>
    <text x="180" y="20" fill="#FCA5A5" font-size="13">· Internal Console</text>
  </g>
  <g transform="translate(540, 26)" fill="#FFFFFF" font-size="15">
    <text x="0" y="0" fill="#FFFFFF" font-weight="700">Dashboard</text>
    <text x="120" y="0" opacity="0.85">Users</text>
    <text x="200" y="0" opacity="0.85">Bookings</text>
    <text x="300" y="0" opacity="0.85">Moderation</text>
    <text x="420" y="0" opacity="0.85">Reports</text>
    <text x="520" y="0" opacity="0.85">Settings</text>
  </g>
  <g transform="translate(1280, 18)">
    <circle cx="20" cy="20" r="20" fill="#FEE2E2"/>
    <text x="20" y="28" text-anchor="middle" fill="#991B1B" font-size="14">🛡️</text>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">🛡️ Admin Dashboard</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">System health, KPIs, and alerts</text>
  </g>

  <!-- KPI cards -->
  <g transform="translate(80, 200)">
    <rect width="290" height="120" rx="12" fill="url(#adminGrad)" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#FECACA" font-size="11" font-weight="700">👥 TOTAL USERS</text>
      <text x="0" y="60" fill="#FFFFFF" font-size="36" font-weight="800">847,520</text>
      <text x="0" y="86" fill="#FCA5A5" font-size="12">+12,480 this week</text>
    </g>
  </g>

  <g transform="translate(390, 200)">
    <rect width="290" height="120" rx="12" bg fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">📅 BOOKINGS (24h)</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">28,847</text>
      <text x="0" y="86" fill="#10B981" font-size="12">↑ 8% vs yesterday</text>
    </g>
  </g>

  <g transform="translate(700, 200)">
    <rect width="290" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">💵 REVENUE (24h)</text>
      <text x="0" y="60" fill="#111827" font-size="36" font-weight="800">$187K</text>
      <text x="0" y="86" fill="#10B981" font-size="12">↑ 12% vs yesterday</text>
    </g>
  </g>

  <g transform="translate(1010, 200)">
    <rect width="350" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">🚨 OPEN ALERTS</text>
      <text x="0" y="60" fill="#EF4444" font-size="36" font-weight="800">12</text>
      <text x="0" y="86" fill="#EF4444" font-size="12">3 critical · 9 warning</text>
    </g>
  </g>

  <!-- System health -->
  <g transform="translate(80, 350)">
    <rect width="800" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="18" font-weight="800">💚 System health</text>
      <g transform="translate(0, 30)">
        <rect width="752" height="44" rx="8" fill="#ECFDF5"/>
        <text x="20" y="28" fill="#047857" font-size="13" font-weight="600">✅ API</text>
        <text x="80" y="28" fill="#065F46" font-size="13">99.98% uptime · p95: 142ms</text>
        <text x="700" y="28" text-anchor="end" fill="#10B981" font-size="13" font-weight="700">Healthy</text>
      </g>
      <g transform="translate(0, 84)">
        <rect width="752" height="44" rx="8" fill="#ECFDF5"/>
        <text x="20" y="28" fill="#047857" font-size="13" font-weight="600">✅ Database</text>
        <text x="100" y="28" fill="#065F46" font-size="13">8ms avg query · 12% CPU</text>
        <text x="700" y="28" text-anchor="end" fill="#10B981" font-size="13" font-weight="700">Healthy</text>
      </g>
      <g transform="translate(0, 138)">
        <rect width="752" height="44" rx="8" fill="#FEF3C7"/>
        <text x="20" y="28" fill="#92400E" font-size="13" font-weight="600">⚠️ Video relay</text>
        <text x="120" y="28" fill="#78350F" font-size="13">Region us-east elevated · p95: 480ms</text>
        <text x="700" y="28" text-anchor="end" fill="#F59E0B" font-size="13" font-weight="700">Warning</text>
      </g>
      <g transform="translate(0, 192)">
        <rect width="752" height="44" rx="8" fill="#ECFDF5"/>
        <text x="20" y="28" fill="#047857" font-size="13" font-weight="600">✅ Webhook queue</text>
        <text x="140" y="28" fill="#065F46" font-size="13">0 backlog · processing in real-time</text>
        <text x="700" y="28" text-anchor="end" fill="#10B981" font-size="13" font-weight="700">Healthy</text>
      </g>
    </g>
  </g>

  <!-- Alerts -->
  <g transform="translate(900, 350)">
    <rect width="460" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="18" font-weight="800">🚨 Recent alerts</text>

      <g transform="translate(0, 24)">
        <rect width="412" height="60" rx="8" fill="#FEE2E2"/>
        <g transform="translate(16, 14)">
          <rect width="32" height="32" rx="6" fill="#EF4444"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">⚠️</text>
        </g>
        <g transform="translate(60, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Critical: SBT minting paused</text>
          <text x="0" y="32" fill="#7F1D1D" font-size="11">Polygon RPC unreachable · 5min ago</text>
        </g>
      </g>

      <g transform="translate(0, 96)">
        <rect width="412" height="60" rx="8" fill="#FEF3C7"/>
        <g transform="translate(16, 14)">
          <rect width="32" height="32" rx="6" fill="#F59E0B"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">⚠️</text>
        </g>
        <g transform="translate(60, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">Warning: Video relay latency</text>
          <text x="0" y="32" fill="#78350F" font-size="11">us-east-1 p95 elevated · 15min ago</text>
        </g>
      </g>

      <g transform="translate(0, 168)">
        <rect width="412" height="60" rx="8" fill="#FEF3C7"/>
        <g transform="translate(16, 14)">
          <rect width="32" height="32" rx="6" fill="#F59E0B"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">📋</text>
        </g>
        <g transform="translate(60, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">12 reports pending review</text>
          <text x="0" y="32" fill="#78350F" font-size="11">SLA: 4 hours · oldest 2h ago</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Quick actions -->
  <g transform="translate(80, 660)">
    <rect width="1280" height="200" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(24, 24)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">⚡ Quick actions</text>

      <g transform="translate(0, 30)">
        <rect width="200" height="140" rx="10" fill="#ECFDF5"/>
        <text x="100" y="50" text-anchor="middle" font-size="32">👤</text>
        <text x="100" y="86" text-anchor="middle" fill="#047857" font-size="13" font-weight="700">User management</text>
        <text x="100" y="106" text-anchor="middle" fill="#065F46" font-size="11">View, search, suspend</text>
      </g>

      <g transform="translate(216, 30)">
        <rect width="200" height="140" rx="10" fill="#FEE2E2"/>
        <text x="100" y="50" text-anchor="middle" font-size="32">🚨</text>
        <text x="100" y="86" text-anchor="middle" fill="#991B1B" font-size="13" font-weight="700">Reports queue</text>
        <text x="100" y="106" text-anchor="middle" fill="#7F1D1D" font-size="11">12 awaiting review</text>
      </g>

      <g transform="translate(432, 30)">
        <rect width="200" height="140" rx="10" fill="#FEF3C7"/>
        <text x="100" y="50" text-anchor="middle" font-size="32">⭐</text>
        <text x="100" y="86" text-anchor="middle" fill="#92400E" font-size="13" font-weight="700">Ratings moderation</text>
        <text x="100" y="106" text-anchor="middle" fill="#78350F" font-size="11">Review flagged reviews</text>
      </g>

      <g transform="translate(648, 30)">
        <rect width="200" height="140" rx="10" fill="#DBEAFE"/>
        <text x="100" y="50" text-anchor="middle" font-size="32">🎯</text>
        <text x="100" y="86" text-anchor="middle" fill="#1E40AF" font-size="13" font-weight="700">Skills review</text>
        <text x="100" y="106" text-anchor="middle" fill="#1E3A8A" font-size="11">Approve new skills</text>
      </g>

      <g transform="translate(864, 30)">
        <rect width="200" height="140" rx="10" fill="#FCE7F3"/>
        <text x="100" y="50" text-anchor="middle" font-size="32">⚙️</text>
        <text x="100" y="86" text-anchor="middle" fill="#9D174D" font-size="13" font-weight="700">Feature flags</text>
        <text x="100" y="106" text-anchor="middle" fill="#831843" font-size="11">Toggle &amp; rollout</text>
      </g>

      <g transform="translate(1080, 30)">
        <rect width="180" height="140" rx="10" fill="#F3F4F6"/>
        <text x="90" y="50" text-anchor="middle" font-size="32">📈</text>
        <text x="90" y="86" text-anchor="middle" fill="#111827" font-size="13" font-weight="700">System health</text>
        <text x="90" y="106" text-anchor="middle" fill="#6B7280" font-size="11">Live metrics</text>
      </g>
    </g>
  </g>
</svg>
