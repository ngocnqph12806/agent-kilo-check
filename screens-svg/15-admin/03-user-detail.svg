<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <rect width="1440" height="72" fill="url(#adminGrad)"/>
  <g transform="translate(80, 22)">
    <text x="0" y="20" fill="#FFFFFF" font-size="20" font-weight="700">🌱 SkillSeed Admin</text>
  </g>

  <g transform="translate(80, 100)" fill="#374151" font-size="13">
    <text x="0" y="0">Users</text>
    <text x="60" y="0">›</text>
    <text x="75" y="0" fill="#EF4444" font-weight="600">spam_2849@gmail.com</text>
    <g transform="translate(220, -8)">
      <rect width="100" height="24" rx="12" fill="#FEE2E2"/>
      <text x="50" y="16" text-anchor="middle" fill="#991B1B" font-size="11" font-weight="700">⚠️ FLAGGED</text>
    </g>
  </g>

  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">👤 spam_2849</text>
    <text x="0" y="32" fill="#6B7280" font-size="14" font-family="monospace">spam_2849@gmail.com · ID: 9E2D1F3A</text>
  </g>

  <!-- Quick actions -->
  <g transform="translate(1140, 140)">
    <rect width="220" height="48" rx="24" fill="url(#ctaGrad)"/>
    <text x="110" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">✓ Restore account</text>
  </g>

  <g transform="translate(80, 220)">
    <!-- Avatar + status -->
    <rect width="1280" height="180" rx="12" fill="#FEE2E2" filter="url(#cardShadow)"/>
    <g transform="translate(28, 28)">
      <circle cx="48" cy="48" r="48" fill="#9CA3AF"/>
      <text x="48" y="68" text-anchor="middle" fill="#FFFFFF" font-size="44">⚠️</text>
    </g>
    <g transform="translate(150, 36)">
      <text x="0" y="0" fill="#991B1B" font-size="20" font-weight="800">⚠️ This account has been flagged for review</text>
      <text x="0" y="26" fill="#7F1D1D" font-size="13">Detected by automated system on Sep 7, 14:48 · 12 user reports received</text>
      <text x="0" y="50" fill="#7F1D1D" font-size="13">Reasons: Spam · Fake skills · Misleading profile</text>
    </g>

    <g transform="translate(900, 30)">
      <rect width="160" height="44" rx="22" fill="transparent" stroke="#EF4444" stroke-width="2"/>
      <text x="80" y="28" text-anchor="middle" fill="#EF4444" font-size="13" font-weight="600">🚫 Ban account</text>
    </g>
    <g transform="translate(1080, 30)">
      <rect width="160" height="44" rx="22" fill="#FFFFFF"/>
      <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">📨 Send warning</text>
    </g>
  </g>

  <!-- Tabs -->
  <g transform="translate(80, 430)">
    <rect width="180" height="40" rx="20" fill="#10B981"/>
    <text x="90" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">⚠️ Flag reasons</text>
    <g transform="translate(190, 0)">
      <rect width="140" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
      <text x="70" y="26" text-anchor="middle" fill="#374151" font-size="13">Activity</text>
    </g>
    <g transform="translate(340, 0)">
      <rect width="140" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
      <text x="70" y="26" text-anchor="middle" fill="#374151" font-size="13">Sessions</text>
    </g>
    <g transform="translate(490, 0)">
      <rect width="160" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
      <text x="80" y="26" text-anchor="middle" fill="#374151" font-size="13">Moderation log</text>
    </g>
  </g>

  <!-- Flag reasons -->
  <g transform="translate(80, 490)">
    <rect width="1280" height="360" rx="12" bg fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <text x="0" y="0" fill="#111827" font-size="16" font-weight="800">📋 Reasons why this account was flagged</text>

      <g transform="translate(0, 30)">
        <rect width="1216" height="60" rx="10" fill="#FEF2F2"/>
        <g transform="translate(20, 16)">
          <rect width="32" height="32" rx="6" fill="#EF4444"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">📧</text>
        </g>
        <g transform="translate(64, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">📧 Spam · 8 reports</text>
          <text x="0" y="32" fill="#7F1D1D" font-size="11">"Sent promotional messages to 50+ users in 1 hour"</text>
        </g>
        <text x="1196" y="34" text-anchor="end" fill="#9CA3AF" font-size="11">Sep 7, 14:30</text>
      </g>

      <g transform="translate(0, 102)">
        <rect width="1216" height="60" rx="10" bg fill="#FEF2F2"/>
        <g transform="translate(20, 16)">
          <rect width="32" height="32" rx="6" fill="#EF4444"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">📚</text>
        </g>
        <g transform="translate(64, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">📚 Fake skills · Auto-detected</text>
          <text x="0" y="32" fill="#7F1D1D" font-size="11">"Lists 247 skills with no supporting credentials"</text>
        </g>
        <text x="1196" y="34" text-anchor="end" fill="#9CA3AF" font-size="11">Sep 7, 14:48</text>
      </g>

      <g transform="translate(0, 174)">
        <rect width="1216" height="60" rx="10" fill="#FEF2F2"/>
        <g transform="translate(20, 16)">
          <rect width="32" height="32" rx="6" fill="#EF4444"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">👤</text>
        </g>
        <g transform="translate(64, 16)">
          <text x="0" y="14" fill="#111827" font-size="13" font-weight="700">👤 Misleading profile · 4 reports</text>
          <text x="0" y="32" fill="#7F1D1D" font-size="11">"Claims to be Google engineer with no verification"</text>
        </g>
        <text x="1196" y="34" text-anchor="end" fill="#9CA3AF" font-size="11">Sep 7, 15:12</text>
      </g>

      <g transform="translate(0, 246)">
        <rect width="1216" height="40" rx="10" bg fill="#ECFDF5" stroke="#10B981" stroke-dasharray="6 4"/>
        <text x="608" y="26" text-anchor="middle" fill="#047857" font-size="13" font-weight="600">+ Add admin note</text>
      </g>
    </g>
  </g>
</svg>
