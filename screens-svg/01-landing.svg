<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <g transform="translate(0, 0)">
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#F3F4F6" stroke-width="1"/>

    <!-- Logo -->
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="14" y="20" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">🌱</text>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>

    <!-- Nav -->
    <g transform="translate(360, 26)" fill="#374151" font-size="15">
      <text x="0" y="0">Discover</text>
      <text x="100" y="0">How it works</text>
      <text x="220" y="0">Pricing</text>
      <text x="300" y="0">About</text>
      <text x="370" y="0">Blog</text>
    </g>

    <!-- Right side -->
    <g transform="translate(1192, 22)">
      <text x="0" y="20" fill="#374151" font-size="15" font-weight="500">Login</text>
      <g transform="translate(56, 0)">
        <rect width="120" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="60" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Get Started</text>
      </g>
    </g>
  </g>

  <!-- Hero Section -->
  <rect x="0" y="72" width="1440" height="600" fill="url(#heroGrad)"/>

  <g transform="translate(720, 230)">
    <!-- Badge -->
    <g transform="translate(-90, -130)">
      <rect width="180" height="32" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#10B981"/>
      <text x="34" y="21" fill="#047857" font-size="13" font-weight="600">🌱 Now in 4 countries</text>
    </g>

    <!-- Headline -->
    <text x="0" y="-30" text-anchor="middle" fill="#111827" font-size="64" font-weight="800">
      <tspan x="0" dy="0">Teach what you know.</tspan>
      <tspan x="0" dy="76">Learn what you love.</tspan>
    </text>
    <text x="0" y="130" text-anchor="middle" fill="#4B5563" font-size="20" font-weight="400">
      Pay with your time, not your wallet. AI-matched mentors
    </text>
    <text x="0" y="158" text-anchor="middle" fill="#4B5563" font-size="20" font-weight="400">
      teach you skills 1-on-1 via video call.
    </text>

    <!-- Email signup -->
    <g transform="translate(-300, 220)">
      <rect width="600" height="64" rx="32" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(24, 0)">
        <rect width="400" height="64" rx="32" fill="transparent"/>
        <text x="24" y="38" fill="#9CA3AF" font-size="16">📧 your@email.com</text>
      </g>
      <g transform="translate(420, 8)">
        <rect width="172" height="48" rx="24" fill="url(#ctaGrad)"/>
        <text x="86" y="31" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Join Waitlist →</text>
      </g>
    </g>

    <!-- Trust badges -->
    <g transform="translate(0, 320)" font-size="13" fill="#6B7280">
      <text x="-180" y="0">🌱 30 free starter seeds</text>
      <text x="40" y="0">✓ No credit card required</text>
      <text x="-50" y="24">8,000+ verified mentors worldwide</text>
    </g>
  </g>

  <!-- Floating cards (illustration) -->
  <g transform="translate(180, 320)" filter="url(#cardShadow)">
    <rect width="220" height="280" rx="16" fill="#FFFFFF"/>
    <circle cx="110" cy="60" r="40" fill="#DBEAFE"/>
    <text x="110" y="68" text-anchor="middle" font-size="40">👩‍💻</text>
    <text x="110" y="130" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">Mai Tran</text>
    <text x="110" y="150" text-anchor="middle" fill="#6B7280" font-size="12">Public Speaking</text>
    <g transform="translate(20, 180)">
      <text x="0" y="0" font-size="11" fill="#F59E0B">⭐⭐⭐⭐⭐</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">4.9 · 145 sessions</text>
      <g transform="translate(0, 38)">
        <rect width="180" height="32" rx="6" fill="#10B981"/>
        <text x="90" y="21" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Book Session</text>
      </g>
    </g>
  </g>

  <g transform="translate(1040, 380)" filter="url(#cardShadow)">
    <rect width="220" height="280" rx="16" fill="#FFFFFF"/>
    <circle cx="110" cy="60" r="40" fill="#FEF3C7"/>
    <text x="110" y="68" text-anchor="middle" font-size="40">👨‍🍳</text>
    <text x="110" y="130" text-anchor="middle" fill="#111827" font-size="15" font-weight="700">Chef Tom</text>
    <text x="110" y="150" text-anchor="middle" fill="#6B7280" font-size="12">Italian Cooking</text>
    <g transform="translate(20, 180)">
      <text x="0" y="0" font-size="11" fill="#F59E0B">⭐⭐⭐⭐⭐</text>
      <text x="0" y="20" fill="#6B7280" font-size="11">4.8 · 89 sessions</text>
      <g transform="translate(0, 38)">
        <rect width="180" height="32" rx="6" fill="#10B981"/>
        <text x="90" y="21" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Book Session</text>
      </g>
    </g>
  </g>

  <!-- Stats bar -->
  <g transform="translate(0, 672)">
    <rect width="1440" height="100" fill="#FFFFFF"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#F3F4F6"/>
    <g transform="translate(220, 32)" font-size="13" fill="#6B7280">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">200K+</text>
      <text x="0" y="28">learners</text>
    </g>
    <g transform="translate(520, 32)" font-size="13" fill="#6B7280">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">8K+</text>
      <text x="0" y="28">verified mentors</text>
    </g>
    <g transform="translate(820, 32)" font-size="13" fill="#6B7280">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">1.2M</text>
      <text x="0" y="28">sessions completed</text>
    </g>
    <g transform="translate(1140, 32)" font-size="13" fill="#6B7280">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">4.8★</text>
      <text x="0" y="28">avg session rating</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(0, 772)">
    <rect width="1440" height="128" fill="#F9FAFB"/>
    <text x="80" y="40" fill="#111827" font-size="16" font-weight="700">🌱 SkillSeed</text>
    <text x="80" y="62" fill="#6B7280" font-size="13">Teach what you know. Learn what you love.</text>
    <text x="80" y="96" fill="#9CA3AF" font-size="12">© 2026 SkillSeed · Privacy · Terms · Contact</text>

    <g transform="translate(700, 32)" fill="#6B7280" font-size="13">
      <text x="0" y="0" fill="#111827" font-weight="700">Product</text>
      <text x="0" y="24">Discover</text>
      <text x="0" y="44">Pricing</text>
      <text x="0" y="64">For Business</text>
    </g>
    <g transform="translate(900, 32)" fill="#6B7280" font-size="13">
      <text x="0" y="0" fill="#111827" font-weight="700">Company</text>
      <text x="0" y="24">About</text>
      <text x="0" y="44">Blog</text>
      <text x="0" y="64">Careers</text>
    </g>
    <g transform="translate(1100, 32)" fill="#6B7280" font-size="13">
      <text x="0" y="0" fill="#111827" font-weight="700">Connect</text>
      <text x="0" y="24">Twitter</text>
      <text x="0" y="44">LinkedIn</text>
      <text x="0" y="64">Discord</text>
    </g>
  </g>
</svg>
