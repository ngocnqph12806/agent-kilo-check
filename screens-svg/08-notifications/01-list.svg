<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">🔔 Notifications</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">3 unread · 12 this week</text>
    <g transform="translate(1140, -10)">
      <rect width="140" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
      <text x="70" y="26" text-anchor="middle" fill="#374151" font-size="13">⚙️ Settings</text>
    </g>
  </g>

  <!-- Tabs -->
  <g transform="translate(80, 200)">
    <rect width="120" height="36" rx="18" fill="#10B981"/>
    <text x="60" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">All (15)</text>
    <g transform="translate(130, 0)">
      <rect width="120" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">Unread (3)</text>
    </g>
    <g transform="translate(260, 0)">
      <rect width="120" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">Bookings</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="120" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">Messages</text>
    </g>
    <g transform="translate(520, 0)">
      <rect width="120" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
      <text x="60" y="22" text-anchor="middle" fill="#374151" font-size="13">SBTs</text>
    </g>
    <g transform="translate(1140, 0)">
      <rect width="140" height="36" rx="18" fill="transparent" stroke="#10B981" stroke-width="2"/>
      <text x="70" y="22" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">✓ Mark all read</text>
    </g>
  </g>

  <!-- Today -->
  <g transform="translate(80, 260)">
    <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">📅 TODAY</text>

    <!-- Notif 1 (unread) -->
    <g transform="translate(0, 16)">
      <rect width="1280" height="80" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#cardShadow)"/>
      <rect width="4" height="80" rx="2" fill="#10B981"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#10B981"/>
        <text x="24" y="36" text-anchor="middle" fill="#FFFFFF" font-size="22">📅</text>
      </g>
      <g transform="translate(80, 20)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">Session starts in 4 hours</text>
        <text x="0" y="20" fill="#374151" font-size="13">Chef Marco Rossi · Italian Pasta Masterclass · 19:00 - 19:45</text>
        <text x="0" y="40" fill="#10B981" font-size="11" font-weight="600">NEW · Just now</text>
      </g>
      <g transform="translate(1180, 30)">
        <rect width="80" height="32" rx="16" fill="url(#ctaGrad)"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Join</text>
      </g>
    </g>

    <!-- Notif 2 (unread) -->
    <g transform="translate(0, 108)">
      <rect width="1280" height="80" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#cardShadow)"/>
      <rect width="4" height="80" rx="2" fill="#10B981"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#F59E0B"/>
        <text x="24" y="36" text-anchor="middle" fill="#FFFFFF" font-size="22">💬</text>
      </g>
      <g transform="translate(80, 20)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">New message from Sarah Lin</text>
        <text x="0" y="20" fill="#374151" font-size="13">"Looking forward to our React Hooks session tomorrow! Let me know if..."</text>
        <text x="0" y="40" fill="#10B981" font-size="11" font-weight="600">NEW · 2h ago</text>
      </g>
      <g transform="translate(1180, 30)">
        <rect width="80" height="32" rx="16" fill="transparent" stroke="#10B981" stroke-width="2"/>
        <text x="40" y="22" text-anchor="middle" fill="#10B981" font-size="12" font-weight="600">Reply</text>
      </g>
    </g>

    <!-- Notif 3 -->
    <g transform="translate(0, 200)">
      <rect width="1280" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 16)">
        <circle cx="24" cy="24" r="24" fill="#F59E0B"/>
        <text x="24" y="36" text-anchor="middle" fill="#FFFFFF" font-size="22">🏅</text>
      </g>
      <g transform="translate(80, 20)">
        <text x="0" y="0" fill="#111827" font-size="14" font-weight="700">SBT minted: Italian Pasta Beginner</text>
        <text x="0" y="20" fill="#374151" font-size="13">Your verified skill is now on-chain · Earned +5 seeds reward</text>
        <text x="0" y="40" fill="#9CA3AF" font-size="11">5h ago</text>
      </g>
      <g transform="translate(1180, 30)">
        <rect width="80" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
        <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="12">View</text>
      </g>
    </g>
  </g>

  <!-- Yesterday -->
  <g transform="translate(80, 570)">
    <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">📅 YESTERDAY</text>

    <g transform="translate(0, 16)">
      <rect width="1280" height="64" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 16)">
        <circle cx="16" cy="16" r="16" fill="#3B82F6"/>
        <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">🎁</text>
      </g>
      <g transform="translate(64, 16)">
        <text x="0" y="14" fill="#111827" font-size="13" font-weight="600">Anna K. gifted you 10 seeds</text>
        <text x="0" y="34" fill="#9CA3AF" font-size="11">"Thanks for the Italian Cooking class!"</text>
      </g>
      <text x="1240" y="40" text-anchor="end" fill="#9CA3AF" font-size="11">Yesterday</text>
    </g>

    <g transform="translate(0, 92)">
      <rect width="1280" height="64" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 16)">
        <circle cx="16" cy="16" r="16" fill="#10B981"/>
        <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">👤</text>
      </g>
      <g transform="translate(64, 16)">
        <text x="0" y="14" fill="#111827" font-size="13" font-weight="600">Aiko Tanaka accepted your booking</text>
        <text x="0" y="34" fill="#9CA3AF" font-size="11">Meditation · Tue Sep 17, 07:00</text>
      </g>
      <text x="1240" y="40" text-anchor="end" fill="#9CA3AF" font-size="11">Yesterday</text>
    </g>
  </g>

  <!-- This week -->
  <g transform="translate(80, 760)">
    <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="700">📅 THIS WEEK</text>

    <g transform="translate(0, 16)">
      <rect width="1280" height="64" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <g transform="translate(20, 16)">
        <circle cx="16" cy="16" r="16" fill="#EF4444"/>
        <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14">⭐</text>
      </g>
      <g transform="translate(64, 16)">
        <text x="0" y="14" fill="#111827" font-size="13" font-weight="600">Chef Marco left you a 5-star review</text>
        <text x="0" y="34" fill="#9CA3AF" font-size="11">"Excellent student — ask great questions!"</text>
      </g>
      <text x="1240" y="40" text-anchor="end" fill="#9CA3AF" font-size="11">Sep 5</text>
    </g>
  </g>
</svg>
