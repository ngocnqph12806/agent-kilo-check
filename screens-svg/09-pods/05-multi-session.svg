<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="videoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#videoBg)"/>

  <g>
    <rect width="1440" height="56" fill="rgba(0,0,0,0.5)"/>
    <text x="32" y="34" fill="#FFFFFF" font-size="14" font-weight="600">🍝 Pod: Italian Cooking Crew · Hand-rolled Orecchiette</text>
    <text x="380" y="34" fill="#9CA3AF" font-size="13">5/8 participants</text>
    <g transform="translate(640, 18)">
      <rect width="160" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
      <text x="80" y="17" text-anchor="middle" fill="#FFFFFF" font-size="12">⏱️ 42:18 / 90:00</text>
    </g>
    <g transform="translate(1100, 18)">
      <rect width="120" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="60" y="17" text-anchor="middle" fill="#10B981" font-size="12">REC · Group session</text>
    </g>
  </g>

  <!-- Main grid: 2x3 + 1 speaker -->
  <g transform="translate(32, 80)">
    <!-- Tile 1 (host) -->
    <g>
      <rect width="440" height="300" rx="12" fill="#000000"/>
      <text x="220" y="160" text-anchor="middle" font-size="100">👨‍🍳</text>
      <rect x="12" y="260" width="100" height="28" rx="14" fill="rgba(0,0,0,0.6)"/>
      <text x="62" y="278" text-anchor="middle" fill="#FFFFFF" font-size="12">Marco (Host)</text>
      <rect x="120" y="260" width="40" height="28" rx="14" fill="#10B981"/>
      <text x="140" y="278" text-anchor="middle" fill="#FFFFFF" font-size="12">🎤</text>
    </g>

    <g transform="translate(456, 0)">
      <rect width="440" height="300" rx="12" fill="#000000"/>
      <text x="220" y="160" text-anchor="middle" font-size="100">👩</text>
      <rect x="12" y="260" width="120" height="28" rx="14" fill="rgba(0,0,0,0.6)"/>
      <text x="72" y="278" text-anchor="middle" fill="#FFFFFF" font-size="12">Mai (You)</text>
    </g>

    <g transform="translate(912, 0)">
      <rect width="440" height="300" rx="12" fill="#000000"/>
      <text x="220" y="160" text-anchor="middle" font-size="100">👩</text>
      <rect x="12" y="260" width="100" height="28" rx="14" fill="rgba(0,0,0,0.6)"/>
      <text x="62" y="278" text-anchor="middle" fill="#FFFFFF" font-size="12">Anna</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 316)">
      <rect width="440" height="300" rx="12" fill="#000000"/>
      <text x="220" y="160" text-anchor="middle" font-size="100">👨</text>
      <rect x="12" y="260" width="100" height="28" rx="14" fill="rgba(0,0,0,0.6)"/>
      <text x="62" y="278" text-anchor="middle" fill="#FFFFFF" font-size="12">David</text>
      <rect x="12" y="12" width="40" height="28" rx="14" fill="#EF4444"/>
      <text x="32" y="32" text-anchor="middle" fill="#FFFFFF" font-size="14">🔇</text>
    </g>

    <g transform="translate(456, 316)">
      <rect width="440" height="300" rx="12" fill="#000000"/>
      <text x="220" y="160" text-anchor="middle" font-size="100">👩</text>
      <rect x="12" y="260" width="100" height="28" rx="14" fill="rgba(0,0,0,0.6)"/>
      <text x="62" y="278" text-anchor="middle" fill="#FFFFFF" font-size="12">Sara</text>
    </g>

    <g transform="translate(912, 316)">
      <rect width="440" height="300" rx="12" fill="#374151"/>
      <text x="220" y="140" text-anchor="middle" fill="#9CA3AF" font-size="60">+3</text>
      <text x="220" y="180" text-anchor="middle" fill="#9CA3AF" font-size="13">more participants</text>
      <g transform="translate(170, 200)">
        <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
        <text x="20" y="28" text-anchor="middle" font-size="16">👩</text>
        <circle cx="60" cy="20" r="20" fill="#DBEAFE"/>
        <text x="60" y="28" text-anchor="middle" font-size="16">👨</text>
        <circle cx="100" cy="20" r="20" fill="#FCE7F3"/>
        <text x="100" y="28" text-anchor="middle" font-size="16">👩</text>
      </g>
    </g>
  </g>

  <!-- Bottom toolbar -->
  <g transform="translate(540, 740)">
    <g>
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🎤</text>
    </g>
    <g transform="translate(80, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📹</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">🖥️</text>
    </g>
    <g transform="translate(240, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">📝</text>
    </g>
    <g transform="translate(320, 0)">
      <circle cx="32" cy="32" r="32" fill="#374151"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">💬</text>
      <circle cx="50" cy="14" r="10" fill="#EF4444"/>
      <text x="50" y="18" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">7</text>
    </g>
    <g transform="translate(400, 0)">
      <circle cx="32" cy="32" r="32" fill="#10B981"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">✋</text>
    </g>
    <g transform="translate(480, 0)">
      <circle cx="32" cy="32" r="32" fill="#6366F1"/>
      <text x="32" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20">✨</text>
    </g>

    <!-- Pod-specific -->
    <g transform="translate(580, 0)">
      <rect width="120" height="64" rx="32" fill="transparent" stroke="#10B981" stroke-width="2"/>
      <text x="60" y="40" text-anchor="middle" fill="#10B981" font-size="13" font-weight="700">Breakout rooms</text>
    </g>
    <g transform="translate(720, 0)">
      <rect width="120" height="64" rx="32" fill="#EF4444"/>
      <text x="60" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Leave</text>
    </g>
  </g>

  <!-- Hands raised indicator -->
  <g transform="translate(32, 800)">
    <rect width="280" height="56" rx="10" fill="rgba(99, 102, 241, 0.95)"/>
    <text x="20" y="24" fill="#FFFFFF" font-size="13" font-weight="700">✋ 2 hands raised</text>
    <text x="20" y="42" fill="#E0E7FF" font-size="11">Anna and Sara have questions</text>
    <g transform="translate(220, 16)">
      <rect width="40" height="24" rx="6" fill="#FFFFFF"/>
      <text x="20" y="17" text-anchor="middle" fill="#6366F1" font-size="11" font-weight="700">View</text>
    </g>
  </g>
</svg>
