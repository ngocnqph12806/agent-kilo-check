<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 100)" fill="#374151" font-size="13">
    <text x="0" y="0">Pods</text>
    <text x="40" y="0">›</text>
    <text x="55" y="0" fill="#10B981" font-weight="600">Create New</text>
  </g>

  <!-- Stepper -->
  <g transform="translate(220, 150)">
    <g>
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">✓</text>
    </g>
    <line x1="40" y1="20" x2="160" y2="20" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(160, 0)">
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
    </g>
    <line x1="200" y1="20" x2="320" y2="20" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(320, 0)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="26" text-anchor="middle" fill="#9CA3AF" font-size="14" font-weight="700">3</text>
    </g>
    <line x1="360" y1="20" x2="480" y2="20" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(480, 0)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="26" text-anchor="middle" fill="#9CA3AF" font-size="14" font-weight="700">4</text>
    </g>

    <g transform="translate(-12, 64)" fill="#10B981" font-size="11" font-weight="600">
      <text x="20" y="0" text-anchor="middle">BASICS</text>
      <text x="200" y="0" text-anchor="middle">SCHEDULE</text>
      <text x="340" y="0" text-anchor="middle" fill="#9CA3AF">MEMBERS</text>
      <text x="500" y="0" text-anchor="middle" fill="#9CA3AF">REVIEW</text>
    </g>
  </g>

  <!-- Main card -->
  <g transform="translate(220, 270)">
    <rect width="1000" height="560" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">📅 Set your schedule</text>
      <text x="0" y="28" fill="#6B7280" font-size="14">When will your pod meet? Pick a recurring time that works for you.</text>

      <!-- Frequency -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">How often?</text>
        <g transform="translate(0, 16)">
          <rect width="100" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="50" y="26" text-anchor="middle" fill="#374151" font-size="13">Daily</text>
        </g>
        <g transform="translate(110, 16)">
          <rect width="100" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="50" y="26" text-anchor="middle" fill="#374151" font-size="13">Twice/week</text>
        </g>
        <g transform="translate(220, 16)">
          <rect width="100" height="40" rx="20" fill="url(#ctaGrad)"/>
          <text x="50" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Weekly</text>
        </g>
        <g transform="translate(330, 16)">
          <rect width="100" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="50" y="26" text-anchor="middle" fill="#374151" font-size="13">Bi-weekly</text>
        </g>
        <g transform="translate(440, 16)">
          <rect width="100" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="50" y="26" text-anchor="middle" fill="#374151" font-size="13">Monthly</text>
        </g>
      </g>

      <!-- Day picker -->
      <g transform="translate(0, 150)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Which day(s)?</text>
        <g transform="translate(0, 16)">
          <rect width="80" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">Mon</text>
        </g>
        <g transform="translate(90, 16)">
          <rect width="80" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">Tue</text>
        </g>
        <g transform="translate(180, 16)">
          <rect width="80" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">Wed</text>
        </g>
        <g transform="translate(270, 16)">
          <rect width="80" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">Thu</text>
        </g>
        <g transform="translate(360, 16)">
          <rect width="80" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">Fri</text>
        </g>
        <g transform="translate(450, 16)">
          <rect width="80" height="40" rx="20" fill="url(#ctaGrad)"/>
          <text x="40" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Sat ✓</text>
        </g>
        <g transform="translate(540, 16)">
          <rect width="80" height="40" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="40" y="26" text-anchor="middle" fill="#374151" font-size="13">Sun</text>
        </g>
      </g>

      <!-- Time -->
      <g transform="translate(0, 240)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">What time? (your local timezone)</text>
        <g transform="translate(0, 16)">
          <rect width="200" height="44" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
          <text x="20" y="28" fill="#111827" font-size="13">⏰ 14:00 (90 min)</text>
          <text x="180" y="28" fill="#10B981" font-size="13">▼</text>
        </g>

        <g transform="translate(220, 16)">
          <rect width="240" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="20" y="28" fill="#111827" font-size="13">🌍 GMT+7 (Ho Chi Minh)</text>
          <text x="220" y="28" fill="#9CA3AF" font-size="13">▼</text>
        </g>
      </g>

      <!-- Capacity -->
      <g transform="translate(0, 320)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Max members: 12</text>
        <g transform="translate(0, 16)">
          <rect width="500" height="8" rx="4" fill="#E5E7EB"/>
          <rect width="500" height="8" rx="4" fill="url(#ctaGrad)"/>
          <circle cx="500" cy="4" r="14" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
        </g>
        <g transform="translate(0, 30)" fill="#374151" font-size="11">
          <text x="0" y="0">3</text>
          <text x="100" y="0">6</text>
          <text x="200" y="0">9</text>
          <text x="320" y="0">12</text>
          <text x="450" y="0" font-weight="700">15</text>
          <text x="500" y="0" fill="#9CA3AF">20</text>
        </g>
      </g>

      <!-- Recap -->
      <g transform="translate(0, 410)">
        <rect width="920" height="60" rx="10" fill="#ECFDF5"/>
        <text x="20" y="26" fill="#047857" font-size="13" font-weight="700">📌 Pod schedule:</text>
        <text x="20" y="48" fill="#065F46" font-size="12">Every Saturday at 14:00 GMT+7 (90 min) · Up to 12 members</text>
      </g>
    </g>
  </g>

  <!-- Buttons -->
  <g transform="translate(220, 850)">
    <rect width="160" height="40" rx="20" fill="transparent" stroke="#D1D5DB"/>
    <text x="80" y="26" text-anchor="middle" fill="#374151" font-size="13">← Back</text>
  </g>
  <g transform="translate(1060, 850)">
    <rect width="160" height="40" rx="20" fill="url(#ctaGrad)"/>
    <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Continue →</text>
  </g>
</svg>
