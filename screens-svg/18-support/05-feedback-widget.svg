<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="widgetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB" opacity="1"/>

  <!-- Background page (dimmed) -->
  <g opacity="0.5">
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(720, 380)" text-anchor="middle">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="700">Discover</text>
    </g>
  </g>

  <!-- Floating feedback widget (bottom-right) -->
  <g transform="translate(1140, 540)">
    <!-- Tab trigger -->
    <g>
      <circle cx="200" cy="200" r="48" fill="url(#widgetGrad)"/>
      <circle cx="200" cy="200" r="44" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <text x="200" y="214" text-anchor="middle" fill="#FFFFFF" font-size="32">💬</text>
    </g>

    <!-- Widget panel -->
    <g transform="translate(-100, 0)">
      <rect width="380" height="500" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

      <!-- Header -->
      <g>
        <rect width="380" height="80" rx="16" fill="url(#widgetGrad)"/>
        <g transform="translate(20, 18)">
          <circle cx="22" cy="22" r="22" fill="rgba(255,255,255,0.2)"/>
          <text x="22" y="30" text-anchor="middle" fill="#FFFFFF" font-size="20">✨</text>
        </g>
        <g transform="translate(60, 22)">
          <text x="0" y="0" fill="#E0E7FF" font-size="11" font-weight="700">FEEDBACK</text>
          <text x="0" y="22" fill="#FFFFFF" font-size="16" font-weight="800">Help us improve</text>
          <text x="0" y="40" fill="#C7D2FE" font-size="11">Earn 5 seeds per feedback</text>
        </g>
      </g>

      <!-- Emoji rating -->
      <g transform="translate(24, 100)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">How do you feel about SkillSeed?</text>
        <g transform="translate(0, 16)">
          <g>
            <rect width="64" height="64" rx="32" fill="#FEF3C7"/>
            <text x="32" y="46" text-anchor="middle" font-size="36">😡</text>
          </g>
          <g transform="translate(74, 0)">
            <rect width="64" height="64" rx="32" fill="#FED7AA"/>
            <text x="32" y="46" text-anchor="middle" font-size="36">😕</text>
          </g>
          <g transform="translate(148, 0)">
            <rect width="64" height="64" rx="32" fill="#FEF3C7"/>
            <text x="32" y="46" text-anchor="middle" font-size="36">😐</text>
          </g>
          <g transform="translate(222, 0)">
            <rect width="64" height="64" rx="32" fill="#D1FAE5" stroke="#10B981" stroke-width="3"/>
            <text x="32" y="46" text-anchor="middle" font-size="36">😊</text>
          </g>
          <g transform="translate(296, 0)">
            <rect width="64" height="64" rx="32" fill="#D1FAE5"/>
            <text x="32" y="46" text-anchor="middle" font-size="36">🤩</text>
          </g>
        </g>
      </g>

      <!-- Quick feedback -->
      <g transform="translate(24, 220)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">What did you like? (multi-select)</text>
        <g transform="translate(0, 16)">
          <rect width="100" height="32" rx="16" fill="#10B981"/>
          <text x="50" y="22" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">✓ Easy to use</text>
        </g>
        <g transform="translate(110, 16)">
          <rect width="100" height="32" rx="16" fill="#10B981"/>
          <text x="50" y="22" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">✓ Great mentors</text>
        </g>
        <g transform="translate(220, 16)">
          <rect width="80" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
          <text x="40" y="22" text-anchor="middle" fill="#374151" font-size="11">Useful</text>
        </g>
        <g transform="translate(310, 16)">
          <rect width="60" height="32" rx="16" fill="transparent" stroke="#D1D5DB"/>
          <text x="30" y="22" text-anchor="middle" fill="#374151" font-size="11">Free</text>
        </g>
      </g>

      <!-- Improvements -->
      <g transform="translate(24, 290)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">What can we improve?</text>
        <g transform="translate(0, 16)">
          <rect width="332" height="80" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="32" fill="#9CA3AF" font-size="12">Tell us what would make SkillSeed better...</text>
        </g>
      </g>

      <!-- NPS -->
      <g transform="translate(24, 410)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">How likely to recommend? (0-10)</text>
        <g transform="translate(0, 16)" fill="#374151" font-size="11">
          <text x="0" y="14">0</text>
          <text x="332" y="14" text-anchor="end">10</text>
        </g>
        <g transform="translate(0, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">0</text>
        </g>
        <g transform="translate(36, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">1</text>
        </g>
        <g transform="translate(72, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">2</text>
        </g>
        <g transform="translate(108, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">3</text>
        </g>
        <g transform="translate(144, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">4</text>
        </g>
        <g transform="translate(180, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">5</text>
        </g>
        <g transform="translate(216, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">6</text>
        </g>
        <g transform="translate(252, 26)">
          <rect width="32" height="32" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="22" text-anchor="middle" fill="#374151" font-size="13">7</text>
        </g>
        <g transform="translate(288, 26)">
          <rect width="32" height="32" rx="6" fill="#10B981" stroke="#10B981"/>
          <text x="16" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">9</text>
        </g>
      </g>

      <!-- Submit -->
      <g transform="translate(24, 590)">
        <rect width="332" height="40" rx="20" fill="url(#ctaGrad)"/>
        <text x="166" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">📤 Submit · +5 seeds</text>
      </g>
    </g>
  </g>
</svg>
