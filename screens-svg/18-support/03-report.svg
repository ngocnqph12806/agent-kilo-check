<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#000000" opacity="0.4"/>

  <g transform="translate(420, 130)">
    <rect width="600" height="640" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g>
      <rect width="600" height="80" rx="16" fill="#FEE2E2"/>
      <g transform="translate(32, 20)">
        <rect width="40" height="40" rx="20" fill="#EF4444"/>
        <text x="20" y="28" text-anchor="middle" fill="#FFFFFF" font-size="18">⚠️</text>
      </g>
      <g transform="translate(84, 24)">
        <text x="0" y="0" fill="#991B1B" font-size="18" font-weight="800">Report a problem</text>
        <text x="0" y="20" fill="#7F1D1D" font-size="12">Help us keep SkillSeed safe</text>
      </g>
    </g>

    <g transform="translate(40, 100)">
      <!-- Type -->
      <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">What happened?</text>
      <g transform="translate(0, 16)">
        <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
        <text x="20" y="28" fill="#111827" font-size="13">⚠️ Inappropriate behavior</text>
      </g>

      <g transform="translate(0, 76)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Who is involved? (optional)</text>
        <rect x="0" y="10" width="520" height="44" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="38" fill="#111827" font-size="13">@badactor123 (the user)</text>
      </g>

      <g transform="translate(0, 150)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Where did this happen?</text>
        <g transform="translate(0, 16)">
          <rect width="160" height="36" rx="18" fill="#FEE2E2"/>
          <text x="80" y="22" text-anchor="middle" fill="#991B1B" font-size="12" font-weight="600">✓ Video session</text>
        </g>
        <g transform="translate(170, 16)">
          <rect width="160" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
          <text x="80" y="22" text-anchor="middle" fill="#374151" font-size="12">Chat message</text>
        </g>
        <g transform="translate(340, 16)">
          <rect width="160" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
          <text x="80" y="22" text-anchor="middle" fill="#374151" font-size="12">Forum post</text>
        </g>
      </g>

      <g transform="translate(0, 240)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">What happened? (please be specific)</text>
        <rect x="0" y="14" width="520" height="140" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="20" y="42" fill="#111827" font-size="13">During a 1:1 cooking lesson, the user started making</text>
        <text x="20" y="62" fill="#111827" font-size="13">inappropriate comments and showed unwanted content.</text>
        <text x="20" y="82" fill="#111827" font-size="13">I left the session immediately. Session ID: SK-2026-09-1042</text>
        <text x="20" y="142" fill="#9CA3AF" font-size="10">142 / 1000 characters</text>
      </g>

      <g transform="translate(0, 410)">
        <rect width="520" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
        <text x="20" y="22" fill="#374151" font-size="12">📎 Attach screenshot (optional)</text>
      </g>

      <g transform="translate(0, 460)">
        <rect width="520" height="40" rx="10" fill="#FEF3C7"/>
        <text x="20" y="26" fill="#92400E" font-size="11" font-weight="600">🔒 Reports are confidential · Reviewed within 24 hours</text>
      </g>

      <g transform="translate(0, 520)">
        <rect width="160" height="44" rx="22" fill="transparent" stroke="#D1D5DB"/>
        <text x="80" y="28" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">Cancel</text>
      </g>
      <g transform="translate(180, 520)">
        <rect width="340" height="44" rx="22" fill="url(#warnGrad)"/>
        <text x="170" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">🚨 Submit report</text>
      </g>
    </g>
  </g>
</svg>
