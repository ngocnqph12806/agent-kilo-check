<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <text x="720" y="40" text-anchor="middle" fill="#6B7280" font-size="13">🔒 Secure checkout · Powered by Stripe</text>
  </g>

  <g transform="translate(220, 130)">
    <!-- Left form -->
    <rect width="700" height="660" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="24" font-weight="800">⚡ Upgrade to Pro</text>

      <g transform="translate(0, 60)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Email</text>
        <rect x="0" y="10" width="620" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="38" fill="#111827" font-size="14">mai.tran@example.com</text>
      </g>

      <g transform="translate(0, 130)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Card information</text>
        <rect x="0" y="10" width="620" height="44" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="16" y="38" fill="#111827" font-size="14">4242 4242 4242 4242</text>
        <text x="540" y="38" fill="#9CA3AF" font-size="11">VISA</text>
      </g>

      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="305" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="28" fill="#111827" font-size="14">MM / YY</text>
        <text x="16" y="28" fill="#9CA3AF" font-size="11">12/27</text>
        <g transform="translate(315, 0)">
          <rect width="305" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="28" fill="#111827" font-size="14">CVC</text>
          <text x="290" y="28" fill="#9CA3AF" font-size="11">123</text>
        </g>
      </g>

      <g transform="translate(0, 280)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Name on card</text>
        <rect x="0" y="10" width="620" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="38" fill="#111827" font-size="14">Mai Tran</text>
      </g>

      <g transform="translate(0, 360)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Country</text>
        <rect x="0" y="10" width="305" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="16" y="38" fill="#111827" font-size="14">🇻🇳 Vietnam</text>
        <g transform="translate(315, 0)">
          <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Postal code</text>
          <rect x="0" y="10" width="305" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="38" fill="#111827" font-size="14">700000</text>
        </g>
      </g>

      <!-- Discount -->
      <g transform="translate(0, 450)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="700">Have a promo code?</text>
        <g transform="translate(0, 12)">
          <rect width="450" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
          <text x="16" y="26" fill="#111827" font-size="13">🎁 FIRST50 (50% off first month)</text>
        </g>
        <g transform="translate(460, 12)">
          <rect width="160" height="40" rx="8" fill="url(#ctaGrad)"/>
          <text x="80" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">✓ Applied</text>
        </g>
      </g>

      <g transform="translate(0, 540)">
        <rect width="620" height="44" rx="22" fill="url(#ctaGrad)"/>
        <text x="310" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">🔒 Subscribe for $4.50 (50% off first month)</text>
      </g>

      <g transform="translate(0, 600)" fill="#9CA3AF" font-size="11">
        <text x="0" y="0">By subscribing, you agree to our <tspan fill="#10B981" font-weight="600">Terms</tspan> and authorize recurring charges.</text>
        <text x="0" y="16">Cancel anytime. 30-day money-back guarantee.</text>
      </g>
    </g>
  </g>

  <!-- Right summary -->
  <g transform="translate(960, 130)">
    <rect width="380" height="660" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <text x="0" y="0" fill="#111827" font-size="20" font-weight="800">⚡ Pro Plan</text>
      <text x="0" y="22" fill="#6B7280" font-size="13">Monthly subscription</text>

      <line x1="0" y1="44" x2="316" y2="44" stroke="#E5E7EB"/>

      <g transform="translate(0, 60)" fill="#374151" font-size="13">
        <text x="0" y="14">⚡ Pro · Monthly</text>
        <text x="316" y="14" text-anchor="end" fill="#111827" font-weight="600">$9.00</text>
        <text x="0" y="40">🎁 Promo (FIRST50)</text>
        <text x="316" y="40" text-anchor="end" fill="#10B981" font-weight="600">-$4.50</text>
        <text x="0" y="66">🌱 Tax (estimated)</text>
        <text x="316" y="66" text-anchor="end" fill="#111827" font-weight="600">$0.00</text>
      </g>

      <line x1="0" y1="146" x2="316" y2="146" stroke="#E5E7EB"/>

      <g transform="translate(0, 160)">
        <text x="0" y="14" fill="#111827" font-size="16" font-weight="800">Total due today</text>
        <text x="316" y="14" text-anchor="end" fill="#10B981" font-size="22" font-weight="800">$4.50</text>
        <text x="0" y="40" fill="#9CA3AF" font-size="11">Then $9.00/mo starting Oct 7, 2026</text>
      </g>

      <g transform="translate(0, 240)">
        <rect width="316" height="200" rx="10" fill="#ECFDF5"/>
        <g transform="translate(16, 16)">
          <text x="0" y="0" fill="#047857" font-size="13" font-weight="700">✓ What's included:</text>
          <g transform="translate(0, 22)" fill="#065F46" font-size="12">
            <text x="0" y="0">• 200 seeds/month</text>
            <text x="0" y="20">• Unlimited sessions</text>
            <text x="0" y="40">• Advanced AI matching</text>
            <text x="0" y="60">• HD video recording</text>
            <text x="0" y="80">• Verified Expert badge</text>
            <text x="0" y="100">• Priority booking</text>
            <text x="0" y="120">• AI Notes &amp; Summary</text>
          </g>
        </g>
      </g>

      <g transform="translate(0, 470)" fill="#6B7280" font-size="11">
        <text x="0" y="0">🛡️ 30-day money-back guarantee</text>
        <text x="0" y="16">🔒 SSL encrypted · PCI DSS compliant</text>
        <text x="0" y="32">↻ Cancel anytime from Settings</text>
      </g>
    </g>
  </g>
</svg>
