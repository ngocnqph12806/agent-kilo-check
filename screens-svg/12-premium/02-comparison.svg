<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">📊 Compare plans</text>
    <text x="0" y="32" fill="#6B7280" font-size="14">Choose the plan that fits your learning style</text>
  </g>

  <!-- Comparison table -->
  <g transform="translate(80, 200)">
    <rect width="1280" height="640" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g transform="translate(0, 0)">
      <rect width="1280" height="80" rx="12" fill="#F9FAFB"/>
      <g transform="translate(40, 24)" fill="#374151" font-size="13">
        <text x="0" y="14" fill="#9CA3AF" font-size="11" font-weight="700">FEATURE</text>

        <g transform="translate(440, 0)">
          <text x="120" y="14" text-anchor="middle" fill="#374151" font-size="14" font-weight="700">🌱 Free</text>
          <text x="120" y="34" text-anchor="middle" fill="#111827" font-size="14" font-weight="800">$0/mo</text>
        </g>
        <g transform="translate(720, 0)">
          <rect x="-20" y="-8" width="240" height="80" rx="10" fill="#FEF3C7"/>
          <text x="100" y="14" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700">⚡ Pro</text>
          <text x="100" y="34" text-anchor="middle" fill="#111827" font-size="14" font-weight="800">$9/mo</text>
          <text x="100" y="54" text-anchor="middle" fill="#92400E" font-size="11" font-weight="600">Most popular</text>
        </g>
        <g transform="translate(1000, 0)">
          <text x="120" y="14" text-anchor="middle" fill="#374151" font-size="14" font-weight="700">🏢 Team</text>
          <text x="120" y="34" text-anchor="middle" fill="#111827" font-size="14" font-weight="800">$29/seat</text>
        </g>
      </g>
    </g>

    <!-- Rows -->
    <g transform="translate(40, 110)" fill="#374151" font-size="13">
      <!-- Seeds -->
      <text x="0" y="20" fill="#9CA3AF" font-size="11" font-weight="700" transform="translate(0, 30)">SEEDS</text>
      <g transform="translate(0, 60)">
        <text x="0" y="20">Monthly seeds</text>
        <text x="560" y="20" text-anchor="middle">30</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">200</text>
        <text x="1120" y="20" text-anchor="middle">Custom</text>
      </g>
      <g transform="translate(0, 100)">
        <text x="0" y="20">Rollover (months)</text>
        <text x="560" y="20" text-anchor="middle">1</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">3</text>
        <text x="1120" y="20" text-anchor="middle">∞</text>
      </g>
      <line x1="0" y1="140" x2="1200" y2="140" stroke="#E5E7EB"/>

      <!-- Sessions -->
      <text x="0" y="170" fill="#9CA3AF" font-size="11" font-weight="700">SESSIONS</text>
      <g transform="translate(0, 190)">
        <text x="0" y="20">Sessions per month</text>
        <text x="560" y="20" text-anchor="middle">3</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">∞</text>
        <text x="1120" y="20" text-anchor="middle">∞</text>
      </g>
      <g transform="translate(0, 230)">
        <text x="0" y="20">HD video recording</text>
        <text x="560" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
        <text x="1120" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
      </g>
      <g transform="translate(0, 270)">
        <text x="0" y="20">AI Notes &amp; Summary</text>
        <text x="560" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
        <text x="1120" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
      </g>
      <line x1="0" y1="310" x2="1200" y2="310" stroke="#E5E7EB"/>

      <!-- Features -->
      <text x="0" y="340" fill="#9CA3AF" font-size="11" font-weight="700">FEATURES</text>
      <g transform="translate(0, 360)">
        <text x="0" y="20">Verified Expert badge</text>
        <text x="560" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
        <text x="1120" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
      </g>
      <g transform="translate(0, 400)">
        <text x="0" y="20">Priority booking</text>
        <text x="560" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="840" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
        <text x="1120" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
      </g>
      <g transform="translate(0, 440)">
        <text x="0" y="20">SSO / SAML</text>
        <text x="560" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="840" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="1120" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
      </g>
      <g transform="translate(0, 480)">
        <text x="0" y="20">Team analytics</text>
        <text x="560" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="840" y="20" text-anchor="middle" fill="#EF4444">✗</text>
        <text x="1120" y="20" text-anchor="middle" fill="#10B981" font-weight="700">✓</text>
      </g>
    </g>

    <!-- CTA -->
    <g transform="translate(440, 600)">
      <rect width="240" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
      <text x="120" y="22" text-anchor="middle" fill="#374151" font-size="13">Current plan</text>
    </g>
    <g transform="translate(720, 600)">
      <rect width="240" height="36" rx="18" fill="url(#ctaGrad)"/>
      <text x="120" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Upgrade to Pro →</text>
    </g>
    <g transform="translate(1000, 600)">
      <rect width="240" height="36" rx="18" fill="transparent" stroke="#10B981"/>
      <text x="120" y="22" text-anchor="middle" fill="#10B981" font-size="13" font-weight="600">Contact Sales</text>
    </g>
  </g>
</svg>
