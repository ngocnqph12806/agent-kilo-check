<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="popularGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Header -->
  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Hero -->
  <rect x="0" y="72" width="1440" height="200" fill="url(#heroGrad)"/>
  <g transform="translate(720, 130)" text-anchor="middle">
    <text x="0" y="0" font-size="60">⭐</text>
    <text x="0" y="50" fill="#FFFFFF" font-size="48" font-weight="800">SkillSeed Premium</text>
    <text x="0" y="86" fill="#A7F3D0" font-size="16">Unlock unlimited learning, expert sessions, and AI tools · Cancel anytime</text>
  </g>

  <!-- Toggle -->
  <g transform="translate(620, 320)">
    <rect width="200" height="44" rx="22" fill="#F9FAFB" stroke="#E5E7EB"/>
    <rect x="2" y="2" width="98" height="40" rx="20" fill="#FFFFFF"/>
    <text x="51" y="28" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">Monthly</text>
    <text x="151" y="28" text-anchor="middle" fill="#6B7280" font-size="14">Yearly · save 25%</text>
  </g>

  <!-- Plans -->
  <g transform="translate(80, 410)">
    <!-- Free -->
    <g>
      <rect width="400" height="420" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
      <g transform="translate(32, 32)">
        <text x="0" y="0" fill="#374151" font-size="14" font-weight="700">🌱 FREE</text>
        <text x="0" y="40" fill="#111827" font-size="14">Current plan</text>
        <text x="0" y="100" fill="#111827" font-size="48" font-weight="800">$0</text>
        <text x="100" y="100" fill="#6B7280" font-size="14">/month</text>
        <text x="0" y="130" fill="#6B7280" font-size="12">30 starter seeds, 3 sessions/month</text>
        <line x1="0" y1="150" x2="336" y2="150" stroke="#E5E7EB"/>
        <g transform="translate(0, 170)" fill="#374151" font-size="12">
          <text x="0" y="0">✓ 30 seeds/month</text>
          <text x="0" y="22">✓ 3 sessions/month</text>
          <text x="0" y="44">✓ Basic matching</text>
          <text x="0" y="66">✓ Community access</text>
          <text x="0" y="88" fill="#9CA3AF">✗ HD recordings</text>
          <text x="0" y="110" fill="#9CA3AF">✗ Expert badge</text>
        </g>
        <g transform="translate(0, 320)">
          <rect width="336" height="40" rx="20" fill="#F3F4F6"/>
          <text x="168" y="26" text-anchor="middle" fill="#9CA3AF" font-size="13" font-weight="600">Current plan ✓</text>
        </g>
      </g>
    </g>

    <!-- Pro (Popular) -->
    <g transform="translate(420, -20)">
      <rect width="400" height="460" rx="16" fill="url(#popularGrad)" stroke="#F59E0B" stroke-width="2"/>
      <g transform="translate(160, -16)">
        <rect width="80" height="32" rx="16" fill="#F59E0B"/>
        <text x="40" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">POPULAR</text>
      </g>
      <g transform="translate(32, 50)">
        <text x="0" y="0" fill="#92400E" font-size="14" font-weight="700">⚡ PRO</text>
        <text x="0" y="100" fill="#111827" font-size="48" font-weight="800">$9</text>
        <text x="80" y="100" fill="#6B7280" font-size="14">/month</text>
        <text x="0" y="130" fill="#92400E" font-size="12">$7/mo billed yearly · Save $24</text>
        <line x1="0" y1="150" x2="336" y2="150" stroke="#FCD34D"/>
        <g transform="translate(0, 170)" fill="#374151" font-size="12">
          <text x="0" y="0">✓ 200 seeds/month</text>
          <text x="0" y="22">✓ Unlimited sessions</text>
          <text x="0" y="44">✓ Advanced AI matching</text>
          <text x="0" y="66">✓ HD video recording</text>
          <text x="0" y="88">✓ Priority booking</text>
          <text x="0" y="110">✓ Verified Expert badge</text>
          <text x="0" y="132">✓ AI Notes &amp; Summary</text>
        </g>
        <g transform="translate(0, 340)">
          <rect width="336" height="44" rx="22" fill="url(#ctaGrad)"/>
          <text x="168" y="28" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Upgrade to Pro →</text>
        </g>
      </g>
    </g>

    <!-- Team -->
    <g transform="translate(840, 0)">
      <rect width="400" height="420" rx="16" fill="#1F2937"/>
      <g transform="translate(32, 32)">
        <text x="0" y="0" fill="#A7F3D0" font-size="14" font-weight="700">🏢 TEAM</text>
        <text x="0" y="100" fill="#FFFFFF" font-size="48" font-weight="800">$29</text>
        <text x="110" y="100" fill="#9CA3AF" font-size="14">/seat/mo</text>
        <text x="0" y="130" fill="#A7F3D0" font-size="12">Everything in Pro + team features</text>
        <line x1="0" y1="150" x2="336" y2="150" stroke="#374151"/>
        <g transform="translate(0, 170)" fill="#E5E7EB" font-size="12">
          <text x="0" y="0">✓ Everything in Pro</text>
          <text x="0" y="22">✓ SSO / SAML</text>
          <text x="0" y="44">✓ Skill gap analytics</text>
          <text x="0" y="66">✓ Admin dashboard</text>
          <text x="0" y="88">✓ Dedicated CSM</text>
          <text x="0" y="110">✓ Audit logs</text>
        </g>
        <g transform="translate(0, 320)">
          <rect width="336" height="40" rx="20" fill="url(#ctaGrad)"/>
          <text x="168" y="26" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Contact Sales</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Trust -->
  <g transform="translate(720, 870)" text-anchor="middle">
    <text x="0" y="0" fill="#9CA3AF" font-size="12">30-day money-back · No credit card for trial · Cancel anytime · 4.8★ from 8K+ reviews</text>
  </g>
</svg>
