<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <g transform="translate(720, 130)" text-anchor="middle">
    <text x="0" y="0" font-size="48">👨‍👩‍👧‍👦</text>
    <text x="0" y="56" fill="#111827" font-size="36" font-weight="800">Set up Family Plan</text>
    <text x="0" y="90" fill="#6B7280" font-size="16">Up to 6 family members · Share Pro benefits · One bill</text>
  </g>

  <!-- Main card -->
  <g transform="translate(220, 280)">
    <rect width="1000" height="540" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Step 1: Add members -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#111827" font-size="20" font-weight="800">👥 Family members (3 of 6)</text>
      <text x="0" y="22" fill="#6B7280" font-size="13">Each member gets their own SkillSeed profile and personal passport</text>

      <!-- Member 1 -->
      <g transform="translate(0, 60)">
        <rect width="920" height="80" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
        <g transform="translate(20, 16)">
          <circle cx="24" cy="24" r="24" fill="#FEF3C7"/>
          <text x="24" y="36" text-anchor="middle" font-size="22">👩</text>
        </g>
        <g transform="translate(80, 20)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="700">Mai Tran</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">mai.tran@example.com · Admin (you)</text>
        </g>
        <g transform="translate(800, 22)">
          <rect width="100" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="50" y="23" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">👑 Admin</text>
        </g>
      </g>

      <!-- Member 2 -->
      <g transform="translate(0, 152)">
        <rect width="920" height="80" rx="12" fill="#F9FAFB"/>
        <g transform="translate(20, 16)">
          <circle cx="24" cy="24" r="24" fill="#DBEAFE"/>
          <text x="24" y="36" text-anchor="middle" font-size="22">👨</text>
        </g>
        <g transform="translate(80, 20)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="700">Hung Tran (Husband)</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">hung.tran@example.com · Joined Sep 8</text>
        </g>
        <g transform="translate(800, 22)">
          <rect width="100" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
          <text x="50" y="23" text-anchor="middle" fill="#374151" font-size="12">Manage</text>
        </g>
      </g>

      <!-- Member 3 -->
      <g transform="translate(0, 244)">
        <rect width="920" height="80" rx="12" fill="#F9FAFB"/>
        <g transform="translate(20, 16)">
          <circle cx="24" cy="24" r="24" fill="#FCE7F3"/>
          <text x="24" y="36" text-anchor="middle" font-size="22">👧</text>
        </g>
        <g transform="translate(80, 20)">
          <text x="0" y="14" fill="#111827" font-size="14" font-weight="700">Linh Tran (Daughter, 14)</text>
          <text x="0" y="32" fill="#6B7280" font-size="11">linh.tran@example.com · Parental controls enabled</text>
        </g>
        <g transform="translate(800, 22)">
          <rect width="100" height="36" rx="18" fill="transparent" stroke="#D1D5DB"/>
          <text x="50" y="23" text-anchor="middle" fill="#374151" font-size="12">Manage</text>
        </g>
      </g>

      <!-- Add more -->
      <g transform="translate(0, 340)">
        <rect width="920" height="80" rx="12" fill="transparent" stroke="#10B981" stroke-dasharray="6 6"/>
        <g transform="translate(20, 28)">
          <rect width="24" height="24" rx="12" fill="#10B981"/>
          <text x="12" y="17" text-anchor="middle" fill="#FFFFFF" font-size="14">+</text>
        </g>
        <g transform="translate(60, 22)">
          <text x="0" y="14" fill="#10B981" font-size="14" font-weight="700">Invite a family member</text>
          <text x="0" y="32" fill="#047857" font-size="11">Send an invite link via email</text>
        </g>
        <g transform="translate(770, 22)">
          <rect width="120" height="36" rx="18" fill="url(#ctaGrad)"/>
          <text x="60" y="23" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">+ Send invite</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom -->
  <g transform="translate(220, 850)">
    <text x="500" y="0" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">$19.99/month for up to 6 members · Save 63% vs individual Pro</text>
  </g>
</svg>
