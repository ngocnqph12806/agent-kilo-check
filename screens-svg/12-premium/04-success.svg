<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Confetti -->
  <g fill="#10B981" opacity="0.5">
    <circle cx="200" cy="150" r="6"/>
    <circle cx="280" cy="100" r="4"/>
    <circle cx="1100" cy="120" r="5"/>
    <circle cx="1200" cy="180" r="6"/>
  </g>
  <g fill="#F59E0B" opacity="0.6">
    <circle cx="220" cy="350" r="5"/>
    <circle cx="1230" cy="350" r="5"/>
  </g>

  <!-- Card -->
  <g transform="translate(420, 150)">
    <rect width="600" height="600" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(252, 50)">
      <circle cx="48" cy="48" r="48" fill="#FFFFFF"/>
      <circle cx="48" cy="48" r="40" fill="#10B981"/>
      <path d="M28 48 L42 62 L70 34" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="300" y="220" text-anchor="middle" fill="#111827" font-size="36" font-weight="800">Welcome to Pro! ⭐</text>
    <text x="300" y="260" text-anchor="middle" fill="#6B7280" font-size="14">Your subscription is now active</text>

    <!-- Receipt -->
    <g transform="translate(60, 290)">
      <rect width="480" height="160" rx="12" fill="#F9FAFB"/>
      <g transform="translate(24, 24)" fill="#374151" font-size="13">
        <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">RECEIPT</text>
        <text x="0" y="22" fill="#111827" font-weight="700" font-size="15">Order #SUB-2026-09-7892</text>
        <line x1="0" y1="32" x2="432" y2="32" stroke="#E5E7EB"/>
        <text x="0" y="58">⚡ Pro Plan (monthly)</text>
        <text x="432" y="58" text-anchor="end" fill="#111827" font-weight="600">$4.50</text>
        <text x="0" y="82">Next charge: Oct 7, 2026</text>
        <text x="432" y="82" text-anchor="end" fill="#111827" font-weight="600">$9.00</text>
        <text x="0" y="106">Payment method</text>
        <text x="432" y="106" text-anchor="end" fill="#374151">Visa •••• 4242</text>
      </g>
    </g>

    <!-- Unlocked -->
    <g transform="translate(60, 470)">
      <text x="240" y="0" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">🎉 You unlocked:</text>
      <g transform="translate(20, 20)">
        <rect width="140" height="60" rx="10" fill="#ECFDF5"/>
        <text x="70" y="26" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">200 seeds/mo</text>
        <text x="70" y="46" text-anchor="middle" fill="#065F46" font-size="11">vs 30 before</text>
      </g>
      <g transform="translate(170, 20)">
        <rect width="140" height="60" rx="10" fill="#DBEAFE"/>
        <text x="70" y="26" text-anchor="middle" fill="#1E40AF" font-size="11" font-weight="600">∞ Sessions</text>
        <text x="70" y="46" text-anchor="middle" fill="#1E3A8A" font-size="11">unlimited</text>
      </g>
      <g transform="translate(320, 20)">
        <rect width="140" height="60" rx="10" fill="#FEF3C7"/>
        <text x="70" y="26" text-anchor="middle" fill="#92400E" font-size="11" font-weight="600">Expert badge</text>
        <text x="70" y="46" text-anchor="middle" fill="#78350F" font-size="11">verified</text>
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(60, 580)">
      <rect width="220" height="48" rx="24" fill="transparent" stroke="#D1D5DB"/>
      <text x="110" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">View invoice</text>
    </g>
    <g transform="translate(320, 580)">
      <rect width="220" height="48" rx="24" fill="url(#ctaGrad)"/>
      <text x="110" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Start exploring →</text>
    </g>
  </g>
</svg>
