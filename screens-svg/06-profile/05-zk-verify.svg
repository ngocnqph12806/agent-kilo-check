<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="zkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g>
    <rect width="1440" height="72" fill="#FFFFFF"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#E5E7EB"/>
    <g transform="translate(80, 22)">
      <circle cx="14" cy="14" r="14" fill="url(#ctaGrad)"/>
      <text x="38" y="20" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
    </g>
    <g transform="translate(1280, 18)">
      <circle cx="20" cy="20" r="20" fill="#FEF3C7"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
    </g>
  </g>

  <!-- Hero -->
  <g transform="translate(720, 130)" text-anchor="middle">
    <text x="0" y="0" font-size="48">🔐</text>
    <text x="0" y="50" fill="#111827" font-size="36" font-weight="800">zk-Proof Skill Verification</text>
    <text x="0" y="84" fill="#6B7280" font-size="16">Prove a skill without revealing the underlying data. Privacy-preserving credentials.</text>
  </g>

  <!-- Main card -->
  <g transform="translate(220, 270)">
    <rect width="1000" height="540" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Top progress -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" fill="#9CA3AF" font-size="11" font-weight="600">VERIFICATION PROGRESS</text>
      <g transform="translate(0, 16)">
        <rect width="920" height="8" rx="4" fill="#E5E7EB"/>
        <rect width="690" height="8" rx="4" fill="url(#ctaGrad)"/>
        <circle cx="690" cy="4" r="10" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
      </g>
      <text x="0" y="48" fill="#374151" font-size="13" font-weight="600">3 of 4 steps completed</text>
    </g>

    <!-- Steps -->
    <g transform="translate(40, 130)">
      <!-- Step 1 -->
      <g>
        <circle cx="20" cy="20" r="20" fill="#10B981"/>
        <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">✓</text>
        <text x="60" y="14" fill="#111827" font-size="14" font-weight="700">Connect wallet</text>
        <text x="60" y="34" fill="#6B7280" font-size="12">0x7F3A...8E2d connected</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 60)">
        <circle cx="20" cy="20" r="20" fill="#10B981"/>
        <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">✓</text>
        <text x="60" y="14" fill="#111827" font-size="14" font-weight="700">Generate zk-SNARK proof</text>
        <text x="60" y="34" fill="#6B7280" font-size="12">Proof generated in 1.8s · 256 KB</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 120)">
        <circle cx="20" cy="20" r="20" fill="#10B981"/>
        <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">✓</text>
        <text x="60" y="14" fill="#111827" font-size="14" font-weight="700">Submit to verifier contract</text>
        <text x="60" y="34" fill="#6B7280" font-size="12">Confirmed on Polygon · Block #58,392,847</text>
      </g>

      <!-- Step 4 (current) -->
      <g transform="translate(0, 180)">
        <circle cx="20" cy="20" r="20" fill="#8B5CF6" opacity="0.2"/>
        <circle cx="20" cy="20" r="14" fill="#8B5CF6"/>
        <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">4</text>
        <text x="60" y="14" fill="#111827" font-size="14" font-weight="700">Mint SBT with verified proof</text>
        <text x="60" y="34" fill="#8B5CF6" font-size="12">In progress... (~30s remaining)</text>
        <g transform="translate(60, 44)">
          <rect width="200" height="6" rx="3" fill="#E5E7EB"/>
          <rect width="140" height="6" rx="3" fill="url(#zkGrad)"/>
        </g>
      </g>
    </g>

    <!-- Right side: what's verified -->
    <g transform="translate(540, 130)">
      <rect width="420" height="320" rx="12" fill="url(#zkGrad)"/>
      <g transform="translate(24, 24)">
        <text x="0" y="0" fill="#FFFFFF" font-size="14" font-weight="700">📋 Claim being verified</text>
        <text x="0" y="32" fill="#E0E7FF" font-size="13">"Mai Tran has completed 3+ sessions of Italian Cooking as a learner, all rated 4+ stars"</text>
        <line x1="0" y1="60" x2="372" y2="60" stroke="rgba(255,255,255,0.2)"/>

        <text x="0" y="92" fill="#FFFFFF" font-size="13" font-weight="700">Public output:</text>
        <g transform="translate(0, 100)">
          <circle cx="6" cy="6" r="6" fill="#10B981"/>
          <text x="20" y="10" fill="#E0E7FF" font-size="12">✓ Verified true/false</text>
        </g>
        <g transform="translate(0, 124)">
          <circle cx="6" cy="6" r="6" fill="#10B981"/>
          <text x="20" y="10" fill="#E0E7FF" font-size="12">✓ Timestamp</text>
        </g>

        <text x="0" y="172" fill="#FFFFFF" font-size="13" font-weight="700">Hidden inputs (kept private):</text>
        <g transform="translate(0, 184)">
          <text x="0" y="0" fill="#C7D2FE" font-size="11">🔒 Session IDs</text>
        </g>
        <g transform="translate(0, 200)">
          <text x="0" y="0" fill="#C7D2FE" font-size="11">🔒 Mentor names</text>
        </g>
        <g transform="translate(0, 216)">
          <text x="0" y="0" fill="#C7D2FE" font-size="11">🔒 Specific ratings</text>
        </g>
        <g transform="translate(0, 232)">
          <text x="0" y="0" fill="#C7D2FE" font-size="11">🔒 Booking dates</text>
        </g>

        <line x1="0" y1="260" x2="372" y2="260" stroke="rgba(255,255,255,0.2)"/>
        <text x="0" y="284" fill="#FFFFFF" font-size="11">Powered by zk-SNARKs (Groth16)</text>
        <text x="0" y="302" fill="#E0E7FF" font-size="10">Cryptographic proof · ~256 KB · Verify in 200ms</text>
      </g>
    </g>
  </g>

  <!-- Bottom info -->
  <g transform="translate(220, 830)" text-anchor="middle">
    <text x="500" y="0" fill="#6B7280" font-size="12">Privacy-preserving by design · No personal data exposed · Compliant with GDPR &amp; CCPA</text>
  </g>
</svg>
