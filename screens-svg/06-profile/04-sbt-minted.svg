<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sbtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Confetti -->
  <g fill="#10B981" opacity="0.5">
    <circle cx="200" cy="150" r="6"/>
    <circle cx="280" cy="100" r="4"/>
    <circle cx="350" cy="200" r="5"/>
    <circle cx="1100" cy="120" r="5"/>
    <circle cx="1200" cy="180" r="6"/>
    <circle cx="1250" cy="100" r="4"/>
    <circle cx="180" cy="700" r="5"/>
    <circle cx="1150" cy="700" r="5"/>
  </g>
  <g fill="#F59E0B" opacity="0.6">
    <circle cx="220" cy="350" r="5"/>
    <circle cx="1230" cy="350" r="5"/>
  </g>

  <!-- Center -->
  <g transform="translate(720, 200)" text-anchor="middle">
    <!-- Success icon -->
    <g transform="translate(-40, -40)">
      <circle cx="40" cy="40" r="40" fill="#FFFFFF"/>
      <circle cx="40" cy="40" r="34" fill="#10B981"/>
      <path d="M22 40 L34 52 L58 28" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="0" y="80" fill="#111827" font-size="40" font-weight="800">🎉 Soulbound Token minted!</text>
    <text x="0" y="120" fill="#4B5563" font-size="16">Your verified skill is now permanently on-chain.</text>
  </g>

  <!-- SBT card -->
  <g transform="translate(540, 380)">
    <rect width="360" height="320" rx="20" fill="url(#sbtGrad)" filter="url(#cardShadow)"/>

    <text x="180" y="50" text-anchor="middle" fill="#FEF3C7" font-size="11" font-weight="700">SKILL PASSPORT · SBT</text>
    <text x="180" y="120" text-anchor="middle" font-size="80">🍝</text>
    <text x="180" y="170" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">Italian Pasta</text>
    <text x="180" y="194" text-anchor="middle" fill="#FEF3C7" font-size="13">Beginner · Tier 1</text>

    <line x1="40" y1="220" x2="320" y2="220" stroke="rgba(255,255,255,0.3)"/>

    <g transform="translate(40, 240)" fill="#FEF3C7" font-size="11">
      <text x="0" y="0">ISSUED TO</text>
      <text x="0" y="16" fill="#FFFFFF" font-weight="600">0x7F3A...8E2d</text>
      <text x="280" y="0" text-anchor="end">ISSUED BY</text>
      <text x="280" y="16" fill="#FFFFFF" font-weight="600" text-anchor="end">SkillSeed v1.0</text>

      <text x="0" y="50">SBT ID</text>
      <text x="0" y="66" fill="#FFFFFF" font-weight="600">#SBT-2026-09-0042</text>
      <text x="280" y="50" text-anchor="end">BLOCK</text>
      <text x="280" y="66" fill="#FFFFFF" font-weight="600" text-anchor="end">#58,392,847</text>
    </g>
  </g>

  <!-- Stats -->
  <g transform="translate(280, 730)" text-anchor="middle">
    <rect width="240" height="80" rx="12" fill="#FFFFFF"/>
    <text x="120" y="30" fill="#9CA3AF" font-size="11" font-weight="600">YOUR PASSPORT</text>
    <text x="120" y="60" fill="#111827" font-size="20" font-weight="800">15 SBTs ✨</text>
  </g>
  <g transform="translate(600, 730)" text-anchor="middle">
    <rect width="240" height="80" rx="12" fill="#FFFFFF"/>
    <text x="120" y="30" fill="#9CA3AF" font-size="11" font-weight="600">REWARD</text>
    <text x="120" y="60" fill="#10B981" font-size="20" font-weight="800">+5 seeds 🌱</text>
  </g>
  <g transform="translate(920, 730)" text-anchor="middle">
    <rect width="240" height="80" rx="12" fill="#FFFFFF"/>
    <text x="120" y="30" fill="#9CA3AF" font-size="11" font-weight="600">BLOCKCHAIN</text>
    <text x="120" y="60" fill="#111827" font-size="16" font-weight="700">Polygon · Confirmed</text>
  </g>

  <!-- Buttons -->
  <g transform="translate(520, 830)">
    <rect width="200" height="48" rx="24" fill="transparent" stroke="#D1D5DB"/>
    <text x="100" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">View on PolygonScan</text>
  </g>
  <g transform="translate(740, 830)">
    <rect width="180" height="48" rx="24" fill="url(#ctaGrad)"/>
    <text x="90" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Share to feed →</text>
  </g>
</svg>
