          <rect x="96" y="56" width="8" height="8"/>
          <rect x="72" y="72" width="8" height="8"/>
          <rect x="88" y="80" width="8" height="8"/>
          <rect x="104" y="96" width="8" height="8"/>
          <rect x="64" y="104" width="8" height="8"/>
          <rect x="80" y="120" width="8" height="8"/>
