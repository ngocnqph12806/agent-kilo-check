      <text x="100" y="56" fill="#A5B4FC" font-size="13">@mai_tran · 🇻🇳 Vietnam</text>
      <text x="100" y="74" fill="#A5B4FC" font-size="11">Wallet: 0x7F3A...8E2d</text>
