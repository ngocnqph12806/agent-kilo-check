<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Left side: gradient hero -->
  <rect x="0" y="0" width="600" height="900" fill="url(#leftGrad)"/>
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-size="22" font-weight="700">🌱 SkillSeed</text>
  </g>
  <g transform="translate(60, 380)">
    <text x="0" y="0" fill="#FFFFFF" font-size="44" font-weight="800">Start your learning</text>
    <text x="0" y="56" fill="#FFFFFF" font-size="44" font-weight="800">journey today</text>
    <text x="0" y="120" fill="#A7F3D0" font-size="16">Join 200,000+ learners and 8,000+</text>
    <text x="0" y="142" fill="#A7F3D0" font-size="16">mentors teaching each other — for free.</text>
  </g>

  <!-- Floating badges -->
  <g transform="translate(80, 600)" fill="#FFFFFF" opacity="0.95">
    <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="20" y="27" text-anchor="middle" font-size="20">✓</text>
    <text x="60" y="18" font-size="14" font-weight="600">30 free starter seeds</text>
    <text x="60" y="36" font-size="12" opacity="0.8">No credit card required</text>
  </g>

  <!-- Right side: form -->
  <g transform="translate(720, 100)">
    <rect width="600" height="700" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(50, 50)">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">Create your account</text>
      <text x="0" y="28" fill="#6B7280" font-size="14">Already have one? <tspan fill="#10B981" font-weight="600">Log in</tspan></text>

      <!-- Social buttons -->
      <g transform="translate(0, 60)">
        <rect width="245" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="122" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="500">🔵 Continue with Google</text>
      </g>
      <g transform="translate(255, 60)">
        <rect width="245" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="122" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="500">🍎 Continue with Apple</text>
      </g>

      <g transform="translate(0, 130)">
        <line x1="0" y1="14" x2="220" y2="14" stroke="#E5E7EB"/>
        <line x1="280" y1="14" x2="500" y2="14" stroke="#E5E7EB"/>
        <text x="250" y="20" text-anchor="middle" fill="#9CA3AF" font-size="12">OR</text>
      </g>

      <!-- Form fields -->
      <g transform="translate(0, 170)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="600">Full name</text>
        <rect x="0" y="10" width="500" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="16" y="38" fill="#111827" font-size="14">Alex Johnson</text>
      </g>
      <g transform="translate(0, 240)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="600">Email</text>
        <rect x="0" y="10" width="500" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="16" y="38" fill="#111827" font-size="14">alex@example.com</text>
      </g>
      <g transform="translate(0, 310)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="600">Password</text>
        <rect x="0" y="10" width="500" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="16" y="38" fill="#111827" font-size="14">••••••••••••</text>
        <text x="468" y="38" fill="#9CA3AF" font-size="14">👁</text>
        <!-- Strength bar -->
        <rect x="0" y="62" width="120" height="4" rx="2" fill="#10B981"/>
        <rect x="124" y="62" width="120" height="4" rx="2" fill="#10B981"/>
        <rect x="248" y="62" width="120" height="4" rx="2" fill="#10B981"/>
        <rect x="372" y="62" width="128" height="4" rx="2" fill="#E5E7EB"/>
        <text x="0" y="84" fill="#047857" font-size="11" font-weight="600">Strong password</text>
      </g>

      <!-- Terms -->
      <g transform="translate(0, 410)">
        <rect width="20" height="20" rx="4" fill="#10B981"/>
        <path d="M5 10 L9 14 L15 7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="32" y="16" fill="#6B7280" font-size="12">I agree to the <tspan fill="#10B981" font-weight="600">Terms of Service</tspan> and <tspan fill="#10B981" font-weight="600">Privacy Policy</tspan></text>
      </g>

      <!-- Submit -->
      <g transform="translate(0, 450)">
        <rect width="500" height="52" rx="26" fill="url(#ctaGrad)"/>
        <text x="250" y="33" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Create account →</text>
      </g>

      <text x="250" y="540" text-anchor="middle" fill="#9CA3AF" font-size="11">Protected by reCAPTCHA · Privacy &amp; Terms</text>
    </g>
  </g>
</svg>
