<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <g transform="translate(720, 80)" text-anchor="middle">
    <circle cx="0" cy="0" r="20" fill="url(#ctaGrad)"/>
    <text x="0" y="40" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
  </g>

  <!-- Stepper -->
  <g transform="translate(420, 170)">
    <g transform="translate(60, 0)">
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">✓</text>
    </g>
    <line x1="100" y1="20" x2="240" y2="20" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(240, 0)">
      <circle cx="20" cy="20" r="20" fill="#10B981"/>
      <text x="20" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
    </g>
    <line x1="280" y1="20" x2="420" y2="20" stroke="#E5E7EB" stroke-width="2"/>
    <g transform="translate(420, 0)">
      <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="26" text-anchor="middle" fill="#9CA3AF" font-size="14" font-weight="700">3</text>
    </g>
    <line x1="460" y1="20" x2="600" y2="20" stroke="#E5E7EB" stroke-width="2"/>

    <text x="80" y="64" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">EMAIL</text>
    <text x="260" y="64" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">VERIFY CODE</text>
    <text x="440" y="64" text-anchor="middle" fill="#9CA3AF" font-size="11" font-weight="600">NEW PASSWORD</text>
    <text x="620" y="64" text-anchor="middle" fill="#9CA3AF" font-size="11" font-weight="600">DONE</text>
  </g>

  <!-- Main card -->
  <g transform="translate(420, 290)">
    <rect width="600" height="500" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(60, 50)">
      <!-- Lock icon -->
      <g transform="translate(210, 0)">
        <circle cx="30" cy="30" r="30" fill="#FEF3C7"/>
        <text x="30" y="42" text-anchor="middle" font-size="32">🔑</text>
      </g>

      <text x="240" y="130" text-anchor="middle" fill="#111827" font-size="28" font-weight="800">Reset your password</text>
      <text x="240" y="160" text-anchor="middle" fill="#6B7280" font-size="14">Enter the 6-digit code we sent to</text>
      <text x="240" y="180" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">alex@example.com</text>

      <!-- OTP boxes -->
      <g transform="translate(40, 220)">
        <rect x="0" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="32" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">5</text>
        <rect x="76" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="108" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">9</text>
        <rect x="152" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="184" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">3</text>
        <rect x="228" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <rect x="304" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <rect x="380" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      </g>

      <!-- Submit -->
      <g transform="translate(0, 340)">
        <rect width="480" height="52" rx="26" fill="url(#ctaGrad)"/>
        <text x="240" y="33" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Continue</text>
      </g>

      <g transform="translate(0, 410)" text-anchor="middle">
        <text x="240" y="0" fill="#10B981" font-size="13" font-weight="600">← Back to login</text>
      </g>
    </g>
  </g>
</svg>
