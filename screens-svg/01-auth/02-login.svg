<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Left side: gradient hero -->
  <rect x="0" y="0" width="600" height="900" fill="url(#leftGrad)"/>
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-size="22" font-weight="700">🌱 SkillSeed</text>
  </g>

  <!-- Testimonial card -->
  <g transform="translate(60, 360)">
    <rect width="480" height="220" rx="16" fill="rgba(255,255,255,0.12)"/>
    <text x="30" y="40" fill="#FFFFFF" font-size="60">"</text>
    <text x="30" y="90" fill="#FFFFFF" font-size="18" font-weight="500">SkillSeed helped me learn React</text>
    <text x="30" y="116" fill="#FFFFFF" font-size="18" font-weight="500">in exchange for teaching cooking.</text>
    <text x="30" y="142" fill="#FFFFFF" font-size="18" font-weight="500">Now I run both as side gigs.</text>
    <g transform="translate(30, 170)">
      <circle cx="20" cy="20" r="20" fill="#A7F3D0"/>
      <text x="20" y="28" text-anchor="middle" font-size="18">👩</text>
      <text x="56" y="18" fill="#FFFFFF" font-size="14" font-weight="600">Mai Tran</text>
      <text x="56" y="36" fill="#A7F3D0" font-size="12">Frontend Dev · HCMC</text>
    </g>
  </g>

  <!-- Stats footer -->
  <g transform="translate(60, 640)" fill="#A7F3D0" font-size="13">
    <text x="0" y="0" font-weight="600">TRUSTED BY</text>
    <g transform="translate(0, 20)">
      <text x="0" y="20" fill="#FFFFFF" font-size="20" font-weight="700">200K+</text>
      <text x="0" y="40">learners</text>
      <text x="120" y="20" fill="#FFFFFF" font-size="20" font-weight="700">4.8★</text>
      <text x="120" y="40">rating</text>
      <text x="240" y="20" fill="#FFFFFF" font-size="20" font-weight="700">120+</text>
      <text x="240" y="40">countries</text>
    </g>
  </g>

  <!-- Right side: form -->
  <g transform="translate(720, 130)">
    <rect width="600" height="640" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(50, 50)">
      <text x="0" y="0" fill="#111827" font-size="32" font-weight="800">Welcome back</text>
      <text x="0" y="28" fill="#6B7280" font-size="14">New to SkillSeed? <tspan fill="#10B981" font-weight="600">Create an account</tspan></text>

      <!-- Social buttons -->
      <g transform="translate(0, 60)">
        <rect width="245" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="122" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="500">🔵 Continue with Google</text>
      </g>
      <g transform="translate(255, 60)">
        <rect width="245" height="48" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="122" y="30" text-anchor="middle" fill="#374151" font-size="14" font-weight="500">🍎 Continue with Apple</text>
      </g>

      <g transform="translate(0, 130)">
        <line x1="0" y1="14" x2="220" y2="14" stroke="#E5E7EB"/>
        <line x1="280" y1="14" x2="500" y2="14" stroke="#E5E7EB"/>
        <text x="250" y="20" text-anchor="middle" fill="#9CA3AF" font-size="12">OR</text>
      </g>

      <!-- Form fields -->
      <g transform="translate(0, 170)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="600">Email</text>
        <rect x="0" y="10" width="500" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="16" y="38" fill="#111827" font-size="14">alex@example.com</text>
      </g>
      <g transform="translate(0, 240)">
        <text x="0" y="0" fill="#374151" font-size="13" font-weight="600">Password</text>
        <rect x="0" y="10" width="500" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="16" y="38" fill="#111827" font-size="14">••••••••••••</text>
        <text x="468" y="38" fill="#9CA3AF" font-size="14">👁</text>
      </g>

      <!-- Remember + forgot -->
      <g transform="translate(0, 320)">
        <rect width="20" height="20" rx="4" fill="#10B981"/>
        <path d="M5 10 L9 14 L15 7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="32" y="16" fill="#6B7280" font-size="12">Remember me for 30 days</text>
        <text x="500" y="16" text-anchor="end" fill="#10B981" font-size="12" font-weight="600">Forgot password?</text>
      </g>

      <!-- Submit -->
      <g transform="translate(0, 360)">
        <rect width="500" height="52" rx="26" fill="url(#ctaGrad)"/>
        <text x="250" y="33" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Log in →</text>
      </g>

      <!-- Wallet login -->
      <g transform="translate(0, 440)">
        <line x1="0" y1="0" x2="500" y2="0" stroke="#E5E7EB"/>
        <text x="250" y="20" text-anchor="middle" fill="#9CA3AF" font-size="12">OR</text>
        <rect x="0" y="36" width="500" height="52" rx="26" fill="transparent" stroke="#6366F1" stroke-width="2"/>
        <text x="250" y="69" text-anchor="middle" fill="#6366F1" font-size="14" font-weight="600">🔗 Sign in with Web3 Wallet</text>
      </g>
    </g>
  </g>
</svg>
