<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#F9FAFB"/>

  <!-- Logo top -->
  <g transform="translate(720, 80)" text-anchor="middle">
    <circle cx="0" cy="0" r="20" fill="url(#ctaGrad)"/>
    <text x="0" y="40" fill="#111827" font-size="20" font-weight="700">SkillSeed</text>
  </g>

  <!-- Main card -->
  <g transform="translate(420, 180)">
    <rect width="600" height="600" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <g transform="translate(60, 60)">
      <!-- Envelope icon -->
      <g transform="translate(210, 0)">
        <circle cx="30" cy="30" r="30" fill="#DBEAFE"/>
        <text x="30" y="42" text-anchor="middle" font-size="32">📧</text>
      </g>

      <text x="240" y="130" text-anchor="middle" fill="#111827" font-size="28" font-weight="800">Check your email</text>
      <text x="240" y="160" text-anchor="middle" fill="#6B7280" font-size="14">We sent a 6-digit code to</text>
      <text x="240" y="180" text-anchor="middle" fill="#111827" font-size="14" font-weight="600">alex@example.com</text>

      <!-- OTP input boxes -->
      <g transform="translate(40, 220)">
        <rect x="0" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="32" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">8</text>
        <rect x="76" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="108" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">4</text>
        <rect x="152" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
        <text x="184" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">2</text>
        <rect x="228" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <text x="260" y="48" text-anchor="middle" fill="#111827" font-size="32" font-weight="700">_</text>
        <rect x="304" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <rect x="380" y="0" width="64" height="72" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      </g>

      <!-- Submit -->
      <g transform="translate(0, 340)">
        <rect width="480" height="52" rx="26" fill="url(#ctaGrad)"/>
        <text x="240" y="33" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Verify Email</text>
      </g>

      <!-- Resend -->
      <g transform="translate(0, 410)" text-anchor="middle">
        <text x="240" y="0" fill="#6B7280" font-size="13">Didn't receive the code?</text>
        <text x="240" y="24" fill="#9CA3AF" font-size="13">Resend in <tspan fill="#10B981" font-weight="600">00:42</tspan></text>
      </g>

      <!-- Change email -->
      <g transform="translate(0, 470)" text-anchor="middle">
        <text x="240" y="0" fill="#10B981" font-size="13" font-weight="600">← Use a different email</text>
      </g>
    </g>
  </g>
</svg>
