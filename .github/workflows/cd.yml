name: CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # ---------- BACKEND → Railway ----------
  backend-deploy:
    name: Backend · Deploy to Railway
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://api.skillseed.app' || 'https://api.staging.skillseed.app' }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip on [skip cd] commit
        run: |
          if echo "${{ github.event.head_commit.message }}" | grep -q '\[skip cd\]'; then
            echo "Commit opts out of CD. Skipping."
            exit 0
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

  # ---------- FRONTEND → Vercel ----------
  frontend-deploy:
    name: Frontend · Deploy to Vercel
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ---------- PR PREVIEWS ----------
  pr-preview:
    name: PR · Preview comment
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: vercel-preview
          message: |
            🚀 Vercel preview will be available shortly at:
            `https://skillseed-git-${{ github.head_ref }}-<org>.vercel.app`
            _(Vercel bot also posts the exact URL.)_

  pr-cleanup:
    name: PR · Cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: vercel-preview
          message: '🧹 Preview cleaned up after PR close.'

  # ---------- POST-DEPLOY SMOKE TEST ----------
  smoke:
    name: Post-Deploy · Smoke Test
    needs: [backend-deploy, frontend-deploy]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Health check (backend)
        run: |
          for i in {1..30}; do
            if curl -fsS https://api.skillseed.app/actuator/health > /dev/null; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          echo "❌ Backend not healthy after 5 min"
          exit 1

      - name: Health check (frontend)
        run: |
          for i in {1..30}; do
            if curl -fsS -o /dev/null -w "%{http_code}" https://skillseed.app | grep -q 200; then
              echo "✅ Frontend reachable"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done
          echo "❌ Frontend not reachable"
          exit 1

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "🚨 *SkillSeed prod deploy smoke test failed*\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on success
        if: success()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "✅ *SkillSeed prod deploy succeeded*\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}