spring:
  application:
    name: skillseed-backend
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillseed}
    username: ${DATABASE_USERNAME:skillseed}
    password: ${DATABASE_PASSWORD:skillseed_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://:skillseed_dev_password@localhost:6379}
      timeout: 5s

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:local_dev_secret_min_256_bits_long_enough_for_security_requirements_xyz}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}

notification:
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:no-reply@skillseed.app}

oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  apple:
    client-id: ${APPLE_OAUTH_CLIENT_ID:}
    issuer: ${APPLE_OAUTH_ISSUER:https://appleid.apple.com}

storage:
  local-dir: ${STORAGE_LOCAL_DIR:/tmp/skillseed-avatars}
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    region: ${R2_REGION:auto}

logging:
  level:
    root: INFO
    com.skillseed: DEBUG
    org.hibernate.SQL: INFO
