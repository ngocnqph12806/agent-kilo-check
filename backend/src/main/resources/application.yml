spring:
  application:
    name: skillseed-backend
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillseed}
    username: ${DATABASE_USERNAME:skillseed}
    password: ${DATABASE_PASSWORD:skillseed_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://:skillseed_dev_password@localhost:6379}
      timeout: 5s

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:local_dev_secret_min_256_bits_long_enough_for_security_requirements_xyz}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

logging:
  level:
    root: INFO
    com.skillseed: DEBUG
    org.hibernate.SQL: INFO
