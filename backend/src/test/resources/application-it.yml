spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration
  autoconfigure:
    exclude: []

jwt:
  secret: it_secret_must_be_at_least_32_bytes_for_hs256_security_requirements_xx
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

app:
  public-base-url: https://app.skillseed.test

notification:
  resend:
    api-key: ""
    from: no-reply@skillseed.test

oauth:
  google:
    client-id: ""
  apple:
    client-id: ""
    issuer: https://appleid.apple.com

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
