spring:
  datasource:
    url: jdbc:h2:mem:skillseed;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  secret: test_secret_must_be_at_least_32_bytes_for_hs256_security_requirements_xx

app:
  public-base-url: https://app.skillseed.test

notification:
  resend:
    api-key: ""
    from: no-reply@skillseed.test

oauth:
  google:
    client-id: ""
  apple:
    client-id: ""
    issuer: https://appleid.apple.com

logging:
  level:
    org.hibernate: WARN
    org.springframework: WARN
